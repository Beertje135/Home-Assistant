- id: vacuum_001
  alias: 'Stofzuiger: Dusty - Status Update'
  description: Stuurt live een slimme AI of lokale melding wanneer Dusty van status
    verandert (Vastgelopen, Vol, Gedockt of Bezig) via het centrale script.
  triggers:
  - trigger: state
    entity_id: vacuum.dusty
    attribute: bin_full
    to: 'true'
  - trigger: state
    entity_id: vacuum.dusty
    attribute: status
    to: Stuck
  - trigger: state
    entity_id: vacuum.dusty
    to:
    - docked
    - cleaning
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Dusty Status Live
        entity_id: ai_task.google_ai_task
        instructions: "{% from 'ai_formatting.jinja' import persona, regels %} {{
          persona() }} Geef een gevatte, ietwat humoristische en live statusupdate
          over onze robotstofzuiger \"Dusty\". \nGEBRUIK DE VOLGENDE STATUSGEGEVENS:
          \ - Algemene status: {{ states('vacuum.dusty') }}  - Specifieke status (attr):
          {{ state_attr('vacuum.dusty', 'status') }}  - Opvangbak vol (attr): {{ state_attr('vacuum.dusty',
          'bin_full') }}  - Moet vandaag nog kuisen: {{ states('input_boolean.vacuum_clean_today')
          }}\nRICHTLIJNEN VOOR JE BERICHT:  - Als Dusty vastzit (\"stuck\" of specifieke
          status bevat \"stuck/error\"): Maak een grapje over dat hij weer eens vastzit
          (domme Dusty).  - Als de opvangbak vol is (\"bin_full\" is true): Zeg dat
          hij te veel stof geeten heeft en geleegd moet worden.  - Als hij aan het
          kuisen is (\"cleaning\"): Wens hem succes of zeg \"Beep Beep\".  - Als hij
          in zijn docking staat (\"docked\") maar vandaag nog MOET kuisen (\"vacuum_clean_today\"
          is ON): Zeg dat hij lui is of zijn werk nog moet afmaken.  - In alle andere
          gevallen: Geef een korte, vrolijke update dat hij braaf in zijn station
          staat te laden.\nHoud het kort, vrolijk en grappig. Maximaal 2 zinnen.\n{{
          regels() }}\n"
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Dusty Live Update \U0001F916"
        melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}\n{#
          Uitgebreide live lokale fallback #} {% set status = states('vacuum.dusty')
          %}  {% set bin = state_attr('vacuum.dusty', 'bin_full') %}  {% set kuisen
          = states('input_boolean.vacuum_clean_today') %} {% set specifieke_status
          = state_attr('vacuum.dusty', 'status') %}\n{% if 'stuck' in status or 'error'
          in status or specifieke_status == 'Stuck' %}\n  {% set fallback = '⚠️ [Lokaal]
          Domme Dusty! Hij zit weer ergens vast en heeft hulp nodig.' %}\n{% elif
          bin == true or bin == 'true' %}\n  {% set fallback = '⚠️ [Lokaal] Dusty
          heeft te veel stof geeten, zijn opvangbak zit helemaal vol!' %}\n{% elif
          status == 'cleaning' %}\n  {% set fallback = '⚠️ [Lokaal] Beep beep! Dusty
          is momenteel vlijtig de boel aan het kuisen.' %}\n{% elif status == 'docked'
          and kuisen == 'on' %}\n  {% set fallback = '⚠️ [Lokaal] Dusty staat in zijn
          station, maar hij is lui geweest want hij moet vandaag eigenlijk nog kuisen!'
          %}\n{% else %}\n  {% set fallback = '⚠️ [Lokaal] Dusty staat netjes opgeladen
          in zijn honk. Alles is proper!' %}\n{% endif %}\n{{ render_melding(ai_antwoord,
          fallback) }}\n"
        prioriteit: Geen
        melding_tag: dusty-status
        melding_group: huis
    continue_on_error: true
  mode: single
  max_exceeded: silent
