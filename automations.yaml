            %}\n  scene.dressing_normaal\n{% else %}\n  scene.dressing_uit\n{% endif
            %}"
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''stay_on_autoreset'' }}'
      - condition: state
        entity_id: input_boolean.light_dressing_stay_on
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.light_dressing_stay_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''status_slapen'' }}'
      - condition: or
        conditions:
        - condition: state
          entity_id: light.hue_white_filament_bulb_g93_1
          state: 'on'
        - condition: state
          entity_id: light.hue_white_filament_bulb_g93_2
          state: 'on'
        - condition: state
          entity_id: light.hue_white_filament_bulb_g93_3
          state: 'on'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.light_dressing_on
