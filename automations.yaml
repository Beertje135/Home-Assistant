            instructions: '{% from ''ai_formatting.jinja'' import persona, regels
              %} {{ persona() }} Zeg tegen Caroline en de kinderen (Elmo & Trix) dat
              papa (Bert) zojuist in de buurt is gespot en zo dadelijk binnenkomt.
              Maak het kort en vlot. {{ regels() }}

              '
          response_variable: ai_antwoord
        else:
        - variables:
            ai_antwoord:
              response: ''
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: Papa komt zo thuis
            melding_tekst: '{% from ''ai_formatting.jinja'' import render_melding
              %} {{ render_melding(ai_antwoord, ''⚠️ [Lokaal] Papa gaat bijna thuiskomen.'')
              }}

              '
            prioriteit: Caroline
            melding_tag: bert-status
    - conditions:
      - condition: trigger
        id:
        - Bert Thuis
      - condition: state
        entity_id: person.caroline
        state: home
        for:
