    - condition: or
      conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Juist Weg
      - condition: state
        entity_id: input_select.woning_status
        state: Weg
      - condition: state
        entity_id: input_select.woning_status
        state: Op Vakantie
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: light.lightstrip_badkamer
        state: unavailable
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: light.lightstrip_badkamer
          not_from: unavailable
        timeout: 00:00:30
        continue_on_timeout: false
      - delay: 00:00:01
      - action: script.turn_on
        target:
          entity_id: script.light_bathroom_on
