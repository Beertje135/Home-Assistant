          zit weer ergens vast en heeft hulp nodig.' %}\n{% elif bin == true or bin
          == 'true' %}\n  {% set fallback = '⚠️ [Lokaal] Dusty heeft te veel stof
          gegeten, zijn opvangbak zit helemaal vol!' %}\n{% elif status == 'cleaning'
          %}\n  {% set fallback = '⚠️ [Lokaal] Beep beep! Dusty is momenteel vlijtig
          de boel aan het kuisen.' %}\n{% elif status == 'docked' and kuisen == 'on'
          %}\n  {% set fallback = '⚠️ [Lokaal] Dusty staat in zijn station, maar hij
          is lui geweest want hij moet vandaag eigenlijk nog kuisen!' %}\n{% else
          %}\n  {% set fallback = '⚠️ [Lokaal] Dusty staat netjes opgeladen in zijn
          honk. Alles is proper!' %}\n{% endif %}\n{{ render_melding(ai_antwoord,
          fallback) }}\n"
        prioriteit: Geen
        melding_tag: dusty-status
        melding_group: huis
    continue_on_error: true
  mode: single
