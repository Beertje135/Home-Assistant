    else:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.sun_up_down
- id: battery_001
  alias: Herinneringen - Batterij - Bijna Leeg
  description: Melding wanneer een batterij onder de 10% of 5% zakt
  triggers:
  - entity_id:
    - sensor.hue_outdoor_sensor_1_power
    - sensor.hue_outdoor_sensor_2_power
    - sensor.hue_outdoor_sensor_3_power
    - sensor.hue_motion_sensor_1_power
    - sensor.hue_motion_sensor_2_power
    - sensor.hue_motion_sensor_3_power
    - sensor.hue_motion_sensor_4_power
    - sensor.hue_dimmer_switch_1_power
    - sensor.hue_dimmer_switch_2_power
    - sensor.aqara_raamsensor_1_batterij
    - sensor.aqara_raamsensor_2_batterij
    - sensor.aqara_raamsensor_3_batterij
    - sensor.aqara_raamsensor_4_batterij
    - sensor.aqara_raamsensor_5_batterij
    - sensor.aqara_raamsensor_6_batterij
    below: 10
    trigger: numeric_state
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Batterij status
        entity_id: ai_task.google_ai_task
        instructions: '{% from ''ai_formatting.jinja'' import persona, regels %} {{
          persona() }}

          Meld aan Bert (en Caroline als zij thuis is) welke specifieke batterijen
          bijna leeg zijn (< 10%). Noem de exacte naam van het apparaat en het percentage.
          Wees heel kort en bondig voor een iOS notificatie. Als er geen enkele batterij
          onder de 10% staat, zeg dan simpelweg dat alle batterijen oké zijn.

          Status bewoners: Bert is {{ states(''person.bert'') }}, Caroline is {{ states(''person.caroline'')
          }}.

          Data batterijen (Apparaatnaam + status):  - Schuifraam keuken: {{ states(''sensor.aqara_raamsensor_1_batterij'')
          }}%  - Raam Trix: {{ states(''sensor.aqara_raamsensor_2_batterij'') }}%  -
          Raam Elmo: {{ states(''sensor.aqara_raamsensor_3_batterij'') }}%  - Raam
          Zolder: {{ states(''sensor.aqara_raamsensor_4_batterij'') }}%  - Hue Motion
          1: {{ states(''sensor.hue_motion_sensor_1_power'') }}%  - Hue Motion 2:
          {{ states(''sensor.hue_motion_sensor_2_power'') }}%  - Hue Motion 3: {{
          states(''sensor.hue_motion_sensor_3_power'') }}%  - Hue Motion 4: {{ states(''sensor.hue_motion_sensor_4_power'')
          }}%  - Hue Outdoor 1: {{ states(''sensor.hue_outdoor_sensor_1_power'') }}%  -
          Hue Outdoor 2: {{ states(''sensor.hue_outdoor_sensor_2_power'') }}%  - Hue
          Outdoor 3: {{ states(''sensor.hue_outdoor_sensor_3_power'') }}%  - Ewelink
          Badkamer: {{ states(''sensor.ewelink_ds01_01_battery'') }}%  - Ewelink 2:
          {{ states(''sensor.ewelink_ds01_02_battery'') }}%  - Ewelink 3: {{ states(''sensor.ewelink_ds01_03_battery'')
          }}%  - Hue Dimmer 1: {{ states(''sensor.hue_dimmer_switch_1_power'') }}%  -
          Hue Dimmer 2: {{ states(''sensor.hue_dimmer_switch_2_power'') }}%

          {{ regels() }}'
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Batterij Alert! \U0001F50B"
        melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}\n{#
          We bouwen de lokale fallback dynamisch op op basis van dezelfde sensoren
          #} {% set ns = namespace(lege_batterijen=[]) %} {% set batterijen = {\n
          \ 'Schuifraam keuken': states('sensor.aqara_raamsensor_1_batterij'),\n  'Raam
          Trix': states('sensor.aqara_raamsensor_2_batterij'),\n  'Raam Elmo': states('sensor.aqara_raamsensor_3_batterij'),\n
          \ 'Raam Zolder': states('sensor.aqara_raamsensor_4_batterij'),\n  'Hue Motion
          1': states('sensor.hue_motion_sensor_1_power'),\n  'Hue Motion 2': states('sensor.hue_motion_sensor_2_power'),\n
          \ 'Hue Motion 3': states('sensor.hue_motion_sensor_3_power'),\n  'Hue Motion
          4': states('sensor.hue_motion_sensor_4_power'),\n  'Hue Outdoor 1': states('sensor.hue_outdoor_sensor_1_power'),\n
          \ 'Hue Outdoor 2': states('sensor.hue_outdoor_sensor_2_power'),\n  'Hue
          Outdoor 3': states('sensor.hue_outdoor_sensor_3_power'),\n  'Ewelink Badkamer':
          states('sensor.ewelink_ds01_01_battery'),\n  'Ewelink 2': states('sensor.ewelink_ds01_02_battery'),\n
          \ 'Ewelink 3': states('sensor.ewelink_ds01_03_battery'),\n  'Hue Dimmer
          1': states('sensor.hue_dimmer_switch_1_power'),\n  'Hue Dimmer 2': states('sensor.hue_dimmer_switch_2_power')\n}
          %}\n{% for naam, status in batterijen.items() %}\n  {% if status not in
          ['unknown', 'unavailable'] and status | float(100) < 10 %}\n    {% set ns.lege_batterijen
          = ns.lege_batterijen + [naam ~ ' (' ~ status ~ '%)'] %}\n  {% endif %}\n{%
          endfor %}\n{% if ns.lege_batterijen | length > 0 %}\n  {% set fallback =
          'Volgende apparaten zijn bijna leeg: ' ~ ns.lege_batterijen | join(', ')
          ~ '.' %}\n{% else %}\n  {% set fallback = 'Alle batterijen zijn oké!' %}\n{%
          endif %}\n{{ render_melding(ai_antwoord, fallback) }}"
        prioriteit: Bert Kritiek
        melding_tag: batterij-status
        melding_group: huis
    continue_on_error: true
  mode: queued
  max: 10
