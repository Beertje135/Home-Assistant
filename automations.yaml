      value_template: "{{ is_state('light.hue_lily_outdoor_spot_light_rgbcct_1', 'on')
        and \n   (now() - states.scene.tuin2_normaal.last_changed).total_seconds()
        > 300 }}\n"
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.light_garden_stay_on
      state: 'on'
