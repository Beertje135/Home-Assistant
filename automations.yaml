- id: music_follow_off_001
  alias: 'Muziek: Overal - Volgen Uit'
  description: Schakelt de volg-modus automatisch uit bij inactiviteit, specifieke
    tijdstippen of wanneer Bert alleen thuis werkt.
  mode: single
  max_exceeded: silent
  trigger:
  - platform: state
    entity_id: media_player.apple_homepod_mini_wit_1
    from: playing
    to: paused
    for: 00:00:05
    id: Keuken Stopt
  - platform: state
    entity_id: media_player.apple_homepod_mini_wit_3
    from: playing
    to: paused
    for: 00:00:05
    id: Bureau Stopt
  - platform: time
    at: '18:35:00'
    id: Avond
  condition:
  - condition: state
    entity_id: input_boolean.music_follow
    state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.woning_status
      state:
      - Juist Weg
      - Weg
      - Slapen
  - condition: or
    conditions:
    - condition: state
      entity_id: remote.harmony_hub
      attribute: current_activity
      state: PowerOff
    - condition: and
      conditions:
      - condition: state
        entity_id: person.caroline
        state: not_home
      - condition: state
        entity_id: input_select.woning_status
        state: Thuis Werk
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: Bureau Stopt
      - condition: state
        entity_id: binary_sensor.hue_motion_sensor_4_motion
        state: 'off'
        for: 00:15:00
    - condition: and
      conditions:
      - condition: trigger
        id: Keuken Stopt
      - condition: state
        entity_id: binary_sensor.hue_motion_sensor_2_motion
        state: 'off'
        for: 00:15:00
    - condition: trigger
      id: Avond
  action:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.music_follow
