- id: battery_001
  alias: Herinneringen - Batterij - Bijna Leeg
  description: Melding wanneer een batterij onder de 10% of 5% zakt
  triggers:
  - entity_id:
    - sensor.hue_outdoor_sensor_1_power
    - sensor.hue_outdoor_sensor_2_power
    - sensor.hue_outdoor_sensor_3_power
    - sensor.hue_motion_sensor_1_power
    - sensor.hue_motion_sensor_2_power
    - sensor.hue_motion_sensor_3_power
    - sensor.hue_motion_sensor_4_power
    - sensor.hue_dimmer_switch_1_power
    - sensor.hue_dimmer_switch_2_power
    - sensor.aqara_raamsensor_1_batterij
    - sensor.aqara_raamsensor_2_batterij
    - sensor.aqara_raamsensor_3_batterij
    - sensor.aqara_raamsensor_4_batterij
    - sensor.aqara_raamsensor_5_batterij
    - sensor.aqara_raamsensor_6_batterij
    below: 10
    trigger: numeric_state
  actions:
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Batterij status
      entity_id: ai_task.google_ai_task
      instructions: "Je bent Siri. Meld aan Bert (en Caroline als zij thuis is) welke
        specifieke batterijen bijna leeg zijn (< 10%). Noem de exacte naam van het
        apparaat en het percentage. Wees heel kort en bondig voor een iOS notificatie.
        Als er geen enkele batterij onder de 10% staat, zeg dan simpelweg dat alle
        batterijen oké zijn.\nStatus bewoners: Bert is {{ states('person.bert') }},
        Caroline is {{ states('person.caroline') }}.\nData batterijen (Apparaatnaam
        + status): - Schuifraam keuken: {{ states('sensor.aqara_raamsensor_1_batterij')
        }}% - Raam Trix: {{ states('sensor.aqara_raamsensor_2_batterij') }}% - Raam
        Elmo: {{ states('sensor.aqara_raamsensor_3_batterij') }}% - Raam Zolder: {{
        states('sensor.aqara_raamsensor_4_batterij') }}% - Hue Motion 1: {{ states('sensor.hue_motion_sensor_1_power')
        }}% - Hue Motion 2: {{ states('sensor.hue_motion_sensor_2_power') }}% - Hue
        Motion 3: {{ states('sensor.hue_motion_sensor_3_power') }}% - Hue Motion 4:
        {{ states('sensor.hue_motion_sensor_4_power') }}% - Hue Outdoor 1: {{ states('sensor.hue_outdoor_sensor_1_power')
        }}% - Hue Outdoor 2: {{ states('sensor.hue_outdoor_sensor_2_power') }}% -
        Hue Outdoor 3: {{ states('sensor.hue_outdoor_sensor_3_power') }}% - Ewelink
        Badkamer: {{ states('sensor.ewelink_ds01_01_battery') }}% - Ewelink 2: {{
        states('sensor.ewelink_ds01_02_battery') }}% - Ewelink 3: {{ states('sensor.ewelink_ds01_03_battery')
        }}% - Hue Dimmer 1: {{ states('sensor.hue_dimmer_switch_1_power') }}% - Hue
        Dimmer 2: {{ states('sensor.hue_dimmer_switch_2_power') }}%\nSTRIKTE FORMATTERING
        REGELS:\n1. Geef DIRECT de tekst van de melding. Typ GEEN introductie zoals
        \"Hier is de melding:\" of \"Oké, ik heb dit gemaakt:\".\n2. Gebruik NOOIT
        Markdown-opmaak. Gebruik GEEN sterretjes (**) voor vetgedrukte tekst. \n3.
        De output moet pure, schone platte tekst zijn die direct in een pushnotificatie
        past."
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Batterij Alert! \U0001F50B"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %} {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          Er zijn batterijen die aandacht vereisen (< 10%). Controleer het Home Assistant
          batterij-dashboard.\n{% endif %}"
        prioriteit: Bert Kritiek
        melding_tag: batterij-status
        melding_group: huis
    continue_on_error: true
  mode: queued
  max: 10
