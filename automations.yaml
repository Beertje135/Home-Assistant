  mode: single
- id: homeassistant_002
  alias: 'Systeem: HomeAssistant - Update Beschikbaar'
  description: Stuurt een notificatie als er een nieuwe versie van Home Assistant
    klaarstaat.
  triggers:
  - entity_id: binary_sensor.home_assistant_website_update_available
    to: 'on'
