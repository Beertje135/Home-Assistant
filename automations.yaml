    entity_id: climate.trix
    attribute: current_temperature
    above: 23
    id: te_warm
  - trigger: numeric_state
    entity_id: climate.trix
    attribute: current_temperature
    below: 15.5
    id: vorstbeveiliging
  conditions:
  - condition: state
    entity_id: binary_sensor.aqara_raamsensor_2
    state: 'off'
  - condition: state
    entity_id: climate.airco_trix
    state: 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.woning_status
      state: Slapen
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.woning_hvac_modus
        state: Verwarmen
      - condition: trigger
        id: vorstbeveiliging
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.airco_trix
        data:
          hvac_mode: heat
      - action: climate.set_temperature
        target:
          entity_id: climate.airco_trix
        data:
          temperature: 19
    - conditions:
      - condition: state
        entity_id: sensor.woning_hvac_modus
        state: Koelen
      - condition: or
        conditions:
        - condition: trigger
          id: te_warm
        - condition: numeric_state
          entity_id: climate.trix
          attribute: current_temperature
          above: 23
      - condition: state
        entity_id: switch.hue_smart_plug_5
        state: 'off'
      - condition: state
        entity_id: schedule.slapen_trix
        state: 'off'
      - condition: or
        conditions:
        - condition: template
          value_template: '{{ states(''input_select.woning_status'') in [''Thuis'',
            ''Thuis Werk'', ''Thuis Verlof'', ''Juist Thuis'', ''Juist Wakker''] }}'
        - condition: state
          entity_id: input_boolean.pre_heat
          state: 'on'
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.airco_trix
        data:
          hvac_mode: cool
      - action: climate.set_temperature
        target:
          entity_id: climate.airco_trix
        data:
          temperature: 19
  mode: single
