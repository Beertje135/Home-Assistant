- id: music_bathroom_001
  alias: 'Muziek: Badkamer - Automatisch Spelen'
  description: Zet de radio in de badkamer aan bij beweging, mits de HomePod niet
    al speelt en de woningstatus correct is.
  triggers:
  - entity_id: binary_sensor.hue_motion_sensor_1_motion
    from: 'off'
    to: 'on'
    trigger: state
  - trigger: state
    entity_id:
    - input_boolean.muziek_homepod_wit_2_hervat
    for:
      hours: 0
      minutes: 0
      seconds: 30
    from:
    - 'on'
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: media_player.apple_homepod_mini_wit_2
      state: playing
  - condition: state
    entity_id: input_boolean.muziek_homepod_wit_2_volgen
    state: 'on'
  - condition: state
    entity_id: binary_sensor.hue_motion_sensor_1_motion
    state: 'on'
  - condition: state
    entity_id: input_select.woning_status
    state:
    - Juist Wakker
    - Juist Thuis
    - Thuis
    - Thuis Werk
    - Thuis Verlof
  - condition: time
    after: 06:00:00
    before: '19:00:00'
  actions:
  - action: script.turn_on
    target:
      entity_id: script.radio_bathroom_on
  mode: single
  max_exceeded: silent
- id: music_bathroom_002
  alias: 'Muziek: Badkamer - Automatisch Stoppen'
  description: Stopt de muziek in de badkamer na 30 minuten inactiviteit, als de verlichting
    offline gaat of als we gaan slapen.
  mode: single
  max_exceeded: silent
  trigger:
  - platform: state
    entity_id: binary_sensor.hue_motion_sensor_1_motion
    to: 'off'
    for: 00:30:00
  - platform: state
    entity_id: light.lightstrip_badkamer
    to: unavailable
    for: 00:20:00
  - platform: state
    entity_id: input_select.woning_status
    to: Slapen
  condition:
  - condition: state
    entity_id: media_player.apple_homepod_mini_wit_2
    state: playing
  action:
  - action: script.turn_on
    target:
      entity_id: script.radio_bathroom_off
- id: music_kitchen_001
  alias: 'Muziek: Keuken - Automatisch Spelen'
  description: Zet de radio in de keuken aan bij beweging, mits de HomePod niet al
    speelt, de TV uit staat en de woningstatus correct is.
  triggers:
  - entity_id: binary_sensor.hue_motion_sensor_2_motion
    from: 'off'
    to: 'on'
    trigger: state
  - trigger: state
    entity_id:
    - input_boolean.muziek_homepod_wit_1_hervat
    for:
      hours: 0
      minutes: 0
      seconds: 30
    from:
    - 'on'
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: media_player.apple_homepod_mini_wit_1
      state: playing
  - condition: state
    entity_id: input_boolean.muziek_homepod_wit_1_volgen
    state: 'on'
  - condition: state
    entity_id: binary_sensor.hue_motion_sensor_2_motion
    state: 'on'
  - condition: state
    entity_id: input_select.woning_status
    state:
    - Juist Wakker
    - Juist Thuis
    - Thuis
    - Thuis Werk
    - Thuis Verlof
