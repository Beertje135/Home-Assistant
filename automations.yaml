- id: '1687683454617'
  alias: 'HVAC: Airco Trix - Uit'
  description: Schakelt de airco van Trix uit zodra ze naar bed gaat, ramen openen,
    of de maximale temperatuur is bereikt. Blijft aan tijdens zonne-overschot (gratis
    koelen óf verwarmen).
  triggers:
  - trigger: state
    entity_id: schedule.slapen_trix
    to: 'on'
    id: bedtijd
  - trigger: state
    entity_id: switch.hue_smart_plug_5
    to: 'on'
    id: bedtijd
  - trigger: state
    entity_id: binary_sensor.aqara_raamsensor_2
    to: 'on'
    id: raam_open
  - trigger: numeric_state
    entity_id: climate.trix
    attribute: current_temperature
    above: 19.5
    for: 00:05:00
    id: warm_genoeg
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.airco_trix
      state: 'off'
  actions:
  - delay: 00:00:20
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''raam_open'', ''bedtijd''] }}'
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.airco_trix
        data:
          hvac_mode: 'off'
      - if:
        - condition: state
          entity_id: sensor.woning_hvac_modus
          state: Verwarmen
        - condition: state
          entity_id: binary_sensor.aqara_raamsensor_2
          state: 'off'
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.trix
          data:
            hvac_mode: heat
    - conditions:
      - condition: trigger
        id: warm_genoeg
      - condition: not
        conditions:
        - condition: template
          value_template: '{{ is_state(''climate.airco_trix'', ''heat'') or is_state(''sensor.woning_hvac_modus'',
            ''Verwarmen'') }}'
      sequence:
      - stop: Het is warm boven, maar we zijn niet aan het verwarmen. Airco mag blijven
          draaien.
    - conditions:
      - condition: numeric_state
        entity_id: sensor.solarflow_2400_ac_electric_level
        above: 95
      - condition: numeric_state
        entity_id: sensor.solaredge_current_power
        above: 1300
      - condition: numeric_state
        entity_id: sensor.elektriciteit_meter_p1_vermogen
        below: -500
      - condition: or
        conditions:
        - condition: state
          entity_id: sensor.woning_hvac_modus
          state: Koelen
        - condition: state
          entity_id: sensor.woning_hvac_modus
          state: Verwarmen
      sequence:
      - stop: Airco Trix niet uitzetten, we gebruiken gratis zonne-energie!
    default:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.airco_trix
      data:
        hvac_mode: 'off'
    - if:
      - condition: state
        entity_id: sensor.woning_hvac_modus
        state: Verwarmen
      - condition: state
        entity_id: binary_sensor.aqara_raamsensor_2
        state: 'off'
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.trix
        data:
          hvac_mode: heat
  mode: queued
  max: 5
- id: '1687683785709'
  alias: 'HVAC: Airco Trix - Aan'
  description: Stuurt de airco van Trix aan voor comfort (koelen) of nood-vorstbeveiliging.
    Houdt rekening met het Pre-Condition Systeem bij afwezigheid/vakantie.
  triggers:
  - trigger: state
    entity_id: binary_sensor.aqara_raamsensor_2
    to: 'off'
