- id: printer_001
  alias: 'Computer: Printer - Inkt bijna op'
  description: Stuurt een notificatie-script aan wanneer het inktniveau van de zwarte
    of kleuren-cartridge onder de 10% zakt.
  triggers:
  - entity_id:
    - sensor.hp_deskjet_3700_series_black_ink
    - sensor.hp_deskjet_3700_series_tri_color_ink
    below: 10
    trigger: numeric_state
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Printer Status
        entity_id: ai_task.google_ai_task
        instructions: "{% from 'ai_formatting.jinja' import persona, regels %} {{
          persona() }}\nBreng Bert op een korte en duidelijke manier op de hoogte
          van de inktstatus van de printer. \nHUIDIGE INKTNIVEAUS:  - Zwarte inkt:
          {{ states('sensor.hp_deskjet_3700_series_black_ink') }}%  - Kleureninkt:
          {{ states('sensor.hp_deskjet_3700_series_tri_color_ink') }}%\nLOGICA:  -
          Als een van de twee (of beide) onder de 11% staat, herinner hem er dan dringend
          maar vriendelijk aan om nieuwe cartridges te bestellen.  - Als alles boven
          de 11% staat, geef dan gewoon een korte, geruststellende statusupdate.\n{{
          regels() }}"
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "{% set zwart = states('sensor.hp_deskjet_3700_series_black_ink')
          | float(100) %} {% set kleur = states('sensor.hp_deskjet_3700_series_tri_color_ink')
          | float(100) %} {{ '⚠️ INKT BIJNA OP' if zwart < 11 or kleur < 11 else '\U0001F5A8️
          Printer Status Update' }}"
        melding_tekst: '{% from ''ai_formatting.jinja'' import render_melding %} {%
          set zwart = states(''sensor.hp_deskjet_3700_series_black_ink'') | float(0)
          %} {% set kleur = states(''sensor.hp_deskjet_3700_series_tri_color_ink'')
          | float(0) %}

          {% set fallback = ''De printer zit bijna zonder inkt. Bestel zowel zwarte
          als kleureninkt!'' if zwart < 11 and kleur < 11 else (''De zwarte inkt is
          bijna op ('' ~ zwart ~ ''%). Tijd om een nieuwe te bestellen.'' if zwart
          < 11 else (''De kleureninkt is bijna op ('' ~ kleur ~ ''%). Tijd om een
          nieuwe te bestellen.'' if kleur < 11 else ''De printer heeft nog genoeg
          inkt (Zwart: '' ~ zwart ~ ''%, Kleur: '' ~ kleur ~ ''%).'')) %}

          {{ render_melding(ai_antwoord, fallback) }}'
        prioriteit: Bert
        melding_tag: huis-printer
        melding_group: huis
    continue_on_error: true
  mode: single
  max_exceeded: silent
