- id: home_owner_003
  alias: 'Personen: Zones (Thuis) - Bezoeker Afmelden'
  description: Vraagt Bert of Caroline om de bezoeker-modus uit te zetten zodra zij
    thuiskomen.
  triggers:
  - trigger: state
