      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.all_all_off
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Op Vakantie (Bezoek)
      sequence:
      - action: vacuum.return_to_base
        target:
          entity_id: vacuum.dusty
      - action: input_boolean.turn_on
        target:
          entity_id:
          - input_boolean.muziek_homepod_wit_1_volgen
          - input_boolean.muziek_homepod_wit_2_volgen
          - input_boolean.muziek_homepod_wit_3_volgen
          - input_boolean.muziek_homepod_zwart_1_volgen
          - input_boolean.light_downstairs
    default:
    - action: script.turn_on
      target:
        entity_id: script.empty
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.woning_status
      state: Weg
    - condition: state
      entity_id: input_select.woning_status
      state: Thuis
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Woning Status Boodschap
      entity_id: ai_task.google_ai_task
      instructions: "Je bent Siri, de slimme assistent van het huis. Geef een gepaste,
        vrolijke en motiverende boodschap aan de bewoners (Bert en Caroline). speek
        enkel de personen aan die in de zone Thuis/Home zijn.\n⚠️ CRUCIALE SITUATIE-INSTRUCTIES:
        \ - Als de woning_status 'Slapen' of 'Juist Wakker' is: Wees EXTREEM kort,
        rustig en functioneel (max 80 tekens). Geen uitgebreide grappen of lange verhalen,
        puur de essence. - Als de woning_status 'Juist Thuis' is: Welkom hen warm
        thuis.\n\U0001F6A8 RAMEN EN WEER CHECK (BIJ JUIST THUIS): Controleer de status
        van de ramen (on = open, off = dicht): - Raam Trix: {{ states('binary_sensor.aqara_raamsensor_2')
        }} - Raam Elmo: {{ states('binary_sensor.aqara_raamsensor_3') }} - Raam Zolder:
        {{ states('binary_sensor.aqara_raamsensor_4') }} - Raam Badkamer: {{ states('binary_sensor.ewelink_ds01_01_opening')
        }}\nAls de status 'Juist Thuis' is én er staat minstens één raam open (on),
        controleer dan het weer: - Huidige temperatuur: {{ state_attr('sensor.pirate_weather_hourly',
        'forecast')[0].temperature if state_attr('sensor.pirate_weather_hourly', 'forecast')
        else 20 }}°C - Weerbeeld/regen: {{ states('sensor.pirate_weather_hourly')
        }}\nREGELS VOOR WAARSCHUWING: Als de status 'Juist Thuis' is, er minstens
        één raam openstaat, en het regent OF de temperatuur is hoger dan 22°C: Voeg
        dan een dringende maar vriendelijke waarschuwing toe aan de welkomstboodschap.
        Noem specifiek welke ramen nog openstaan (bijv. Trix, Elmo, Zolder en/of Badkamer)
        op basis van de sensors die op 'on' staan. Leg uit waarom ze dicht moeten
        (bijvoorbeeld: 'Het gaat regenen!' of 'Het is buiten warmer dan 22 graden,
        hou de hitte buiten!'). Maak er een leuk, kort grapje van.\nSPECIALE CONTEXT
        (KINDEREN OPHALEN):  - Het is 'Juist Thuis' op Woensdag tussen 12u-13u? Vermeld
        dat Elmo en Trix gezellig meekomen naar huis. - Het is 'Juist Thuis' op andere
        weekdagen tussen 15u30-16u30? Vermeld dat Elmo en Trix gezellig meekomen naar
        huis.\nVERJAARDAGEN EN FELICITATIES: Als het iemands verjaardag is, feliciteer
        hen dan direct op een super leuke, persoonlijke manier!  - Is het vandaag
        Bert's verjaardag?: {{ 'JA' if now().strftime('%m-%d') == '06-24' else 'Nee'
        }} (Geboren in 1985)  - Is het vandaag Caroline's verjaardag?: {{ 'JA' if
        now().strftime('%m-%d') == '07-25' else 'Nee' }} (Geboren in 1985)  - Is het
        vandaag Elmo's verjaardag?: {{ 'JA' if now().strftime('%m-%d') == '08-23'
        else 'Nee' }} (Geboren in 2018)  - Is het vandaag Trix' verjaardag?: {{ 'JA'
        if now().strftime('%m-%d') == '03-29' else 'Nee' }} (Geboren in 2022)\nHUIDIGE
        CONTEXT & ANKERS:  - Tijd/Datum nu: {{ now().strftime('%A %d %B, %H:%M') }}
        \ - Woning status: {{ states('input_select.woning_status') }}  - Bert is:
        {{ states('person.bert') }}  - Caroline is: {{ states('person.caroline') }}
        \ - Bezoek-modus actief: {{ states('binary_sensor.bezoek') | default('off')
        }}\nALGEMENE LENGTE: Houd het kort voor iOS en HomePods (max 250 tekens als
        er ramen openstaan, anders max 200 tekens).\nSTRIKTE FORMATTERING REGELS:
        1. Geef DIRECT de tekst van de melding. Typ GEEN introductie zoals \"Hier
        is de melding:\". 2. Gebruik NOOIT Markdown-opmaak. Gebruik GEEN sterretjes
        (**) voor vetgedrukte tekst.  3. De output moet pure, schone platte tekst
        zijn die direct in een pushnotificatie past."
    response_variable: ai_antwoord
  - wait_template: '{{ (states(''device_tracker.router_iphone_caro'') == ''home''
      and state_attr(''device_tracker.router_iphone_caro'', ''ap_mac'') == ''60:22:32:e4:6c:99'')
      or (states(''device_tracker.router_iphone_bert'') == ''home'' and state_attr(''device_tracker.router_iphone_bert'',
      ''ap_mac'') == ''60:22:32:e4:6c:99'') }}

      '
    timeout: 00:05:00
    continue_on_timeout: true
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    continue_on_error: true
    data:
      variables:
        melding_titel: "{% set m_d = now().strftime('%m-%d') %}  {% if m_d == '06-24'
          %} \U0001F389 HIEPERDEPIEP BERT!  {% elif m_d == '07-25' %} \U0001F389 HIEPERDEPIEP
          CAROLINE!  {% elif m_d == '08-23' %} \U0001F389 HIEPERDEPIEP ELMO!  {% elif
          m_d == '03-29' %} \U0001F389 HIEPERDEPIEP TRIX!  {% else %}\n  {% set status
          = states('input_select.woning_status') %}\n  {% if status == 'Slapen' %}
          \U0001F319 Slaapwel...\n  {% elif status == 'Juist Wakker' %} ☕ Goedemorgen!\n
          \ {% elif status == 'Juist Thuis' %} \n    {% if is_state('binary_sensor.aqara_raamsensor_2',
          'on') or is_state('binary_sensor.aqara_raamsensor_3', 'on') or is_state('binary_sensor.aqara_raamsensor_4',
          'on') or is_state('binary_sensor.ewelink_ds01_01_opening', 'on') %}\n      ⚠️
          RAMEN NOG OPEN! \U0001FA9F\n    {% else %}\n      \U0001F3E1 Welkom thuis!\n
          \   {% endif %}\n  {% else %} \n    Woning Status \U0001F3E0\n  {% endif
          %}\n{% endif %}"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %}  {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  {% if states('input_select.woning_status')
          == 'Juist Thuis' and (is_state('binary_sensor.aqara_raamsensor_2', 'on')
          or is_state('binary_sensor.aqara_raamsensor_3', 'on') or is_state('binary_sensor.aqara_raamsensor_4',
          'on') or is_state('binary_sensor.ewelink_ds01_01_opening', 'on')) %}\n    ⚠️
          [Lokaal] Check de ramen aub!\n  {% else %}\n    ⚠️ [Lokaal] Woning status
          gewijzigd naar: {{ states('input_select.woning_status') }}.\n  {% endif
          %}\n{% endif %}"
        prioriteit: Geen
        melding_tag: huis-status
        melding_group: huis
  mode: single
  max_exceeded: silent
- id: house_003
  alias: 'Personen: Zones (Thuis) - Status Woning Aanpassen'
  description: Beheert de woningstatus op basis van bewoners en bezoek.
  triggers:
  - trigger: state
    entity_id:
    - group.bewoners
    - binary_sensor.bezoek
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.woning_status
    data:
      option: "{% set status = states('input_select.woning_status') %} {% set bewoners
        = states('group.bewoners') %} {% set bezoek = states('binary_sensor.bezoek')
        %} {% set workday = states('binary_sensor.workday_sensor') %} {% set werk_schema
        = states('schedule.werk') %}\n{# Hulpfunctie voor de definitieve Thuis-status
        #} {% macro get_thuis_status() %}\n  {% if workday == 'off' and werk_schema
        == 'on' %}Thuis Verlof\n  {% elif workday == 'on' and werk_schema == 'on'
        %}Thuis Werk\n  {% else %}Thuis{% endif %}\n{% endmacro %}\n{# Logicakaart
        #} {% if (status == 'Weg' and (bewoners == 'home' or bezoek == 'on')) or \n
        \     (status == 'Op Vakantie' and bewoners == 'home') %}\n  Juist Thuis\n{%
        elif (status == 'Op Vakantie' and bezoek == 'on') %}\n  Op Vakantie (Bezoek)\n{%
        elif (status == 'Op Vakantie (Bezoek)' and bezoek == 'off') %}\n  Op Vakantie\n{%
        elif status in ['Juist Thuis', 'Thuis', 'Thuis Werk', 'Thuis Verlof'] \n        and
        bewoners == 'not_home' and bezoek == 'off' %}\n  Juist Weg\n{% elif status
        == 'Juist Weg' and (bewoners == 'home' or bezoek == 'on') %}\n  {{ get_thuis_status()
        | trim }}\n{% else %}\n  {{ status }}\n{% endif %}\n"
  mode: restart
- id: house_004
  alias: 'Ons Huisje: Status Timer (Auto-Transitieverloop)'
  description: Automatische overgang van tijdelijke statussen naar definitieve woningstatussen.
  triggers:
  - trigger: state
    entity_id: input_select.woning_status
    to: Juist Thuis
    for: 00:10:00
  - trigger: state
    entity_id: input_select.woning_status
    to: Juist Wakker
    for: 00:10:00
  - trigger: state
    entity_id: input_select.woning_status
    to: Juist Weg
    for: 00:10:00
  - trigger: state
    entity_id: input_select.woning_status
    to: Weg
    for: '24:00:00'
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.woning_status
    data:
      option: "{% set status = trigger.to_state.state %} {% set workday = states('binary_sensor.workday_sensor')
        %} {% set werk_schema = states('schedule.werk') %}\n{% if status in ['Juist
        Thuis', 'Juist Wakker'] %}\n  {% if workday == 'off' and werk_schema == 'on'
        %} Thuis Verlof\n  {% elif workday == 'on' and werk_schema == 'on' %} Thuis
        Werk\n  {% else %} Thuis\n  {% endif %}\n{% elif status == 'Juist Weg' %}\n
        \ Weg\n{% elif status == 'Weg' %}\n  Op Vakantie\n{% else %}\n  {{ status
        }}\n{% endif %}\n"
  mode: restart
- id: house_005
  alias: 'Ons Huisje: Detectie Wakker Worden'
  description: Zet woningstatus naar 'Juist Wakker' bij de eerste ochtendbeweging,
    mits het huis langer dan een uur in 'Slapen' staat.
  triggers:
  - trigger: state
    entity_id: binary_sensor.hue_motion_sensor_1_motion
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_select.woning_status
    state: Slapen
    for: 01:00:00
  - condition: state
    entity_id: schedule.slapen
    state: 'off'
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.woning_status
    data:
      option: Juist Wakker
  mode: single
- id: house_006
  alias: 'Ons Huisje: Werk/Verlof Status AAN'
  description: Schakelt automatisch tussen 'Thuis Werk' en 'Thuis Verlof' op basis
    van agenda en vakantie-instellingen.
  triggers:
  - trigger: state
    entity_id: schedule.werk
    to: 'on'
  - trigger: state
    entity_id: input_select.woning_status
    to: Thuis
    for: 00:01:00
  - trigger: state
    entity_id: input_boolean.schoolvakantie
    to: 'on'
  conditions:
  - condition: state
    entity_id: schedule.werk
    state: 'on'
  - condition: state
    entity_id: input_select.woning_status
    state:
    - Thuis
    - Thuis Werk
    - Thuis Verlof
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.woning_status
    data:
      option: "{% if is_state('binary_sensor.workday_sensor', 'off') or is_state('input_boolean.schoolvakantie',
        'on') %}\n  Thuis Verlof\n{% else %}\n  Thuis Werk\n{% endif %}\n"
  mode: restart
- id: house_007
  alias: 'Ons Huisje: Werk/Verlof Status UIT'
  description: Schakelt terug naar 'Thuis' wanneer het werkschema of de schoolvakantie-instelling
    stopt.
  triggers:
  - trigger: state
    entity_id: schedule.werk
    to: 'off'
  - trigger: state
    entity_id: input_boolean.schoolvakantie
    to: 'off'
  conditions:
  - condition: state
    entity_id: input_select.woning_status
    state:
    - Thuis Werk
    - Thuis Verlof
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.woning_status
    data:
      option: Thuis
  mode: restart
- id: house_008
  alias: 'Ons Huisje: Automatisch op Vakantie'
  description: Zet de woningstatus automatisch op 'Op Vakantie' wanneer de kortste
    afstand van de bewoners tot het huis langer dan 1 minuut groter is dan 80 km.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.home_nearest_distance
    above: 80
    for: 00:01:00
  - trigger: state
    entity_id: sensor.home_nearest_distance
  conditions:
  - condition: state
    entity_id: input_select.woning_status
    state: Weg
  - condition: numeric_state
    entity_id: sensor.home_nearest_distance
    above: 80
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.woning_status
    data:
      option: Op Vakantie
  mode: single
- id: amplifier_livingroom_001
  alias: 'Media: Woonkamer - Harmony Uit bij Inactiviteit'
  description: Zet de Harmony Hub op PowerOff als de Apple TV standby staat, uit is,
    of al 30 minuten gepauzeerd staat.
  triggers:
  - trigger: state
    entity_id: media_player.apple_tv_4k_1
    to:
    - standby
    - 'off'
  - trigger: state
    entity_id: media_player.apple_tv_4k_1
    to:
    - paused
    - idle
    for: 00:30:00
  conditions:
  - condition: state
    entity_id: remote.harmony_hub
    attribute: current_activity
    state: Apple tv
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.harmony_hub
    data:
      option: PowerOff
  mode: restart
- id: amplifier_livingroom_005
  alias: 'Media: Woonkamer - Harmony Aan bij Apple TV Start'
  description: Schakelt de Harmony Hub naar 'Apple tv' zodra de Apple TV start en
    de Hub nog op een andere activiteit staat.
  triggers:
  - trigger: state
    entity_id: media_player.apple_tv_4k_1
    from:
    - standby
    - 'off'
    to: idle
  - trigger: state
    entity_id: media_player.apple_tv_4k_1
    to: playing
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: remote.harmony_hub
      attribute: current_activity
      state: Apple tv
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.harmony_hub
    data:
      option: Apple tv
  mode: restart
