      - action: script.turn_on
        target:
          entity_id:
          - script.empty
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Juist Weg
      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.all_light_off
          - script.all_music_off
      - action: input_select.select_option
        target:
          entity_id: input_select.harmony_hub
        data:
          option: PowerOff
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Slapen
      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.all_music_off
          - script.all_remote_off
      - action: light.turn_off
        target:
          area_id:
          - 5109ce4228e34c40905c412dead94412
          - 18b1754bbabb441e9daf1c473d9242f5
          - tuinhuis
          - tuin
        data:
          transition: 10
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Weg
      sequence:
      - action: script.turn_on
        target:
          entity_id:
          - script.all_all_off
      - action: switch.turn_off
        target:
          entity_id:
          - switch.hue_smart_plug_5
          - switch.hue_smart_plug_6
      - condition: state
        entity_id: schedule.dusty
        state: 'on'
      - condition: numeric_state
