- id: home_owner_zones
  alias: 'Personen: Zones (School, Checkpoints, …)'
  description: Houdt zones bij zoals school, opvang en checkpoints tijdens werkdagen
    en regelt slimme notificaties via het centrale script (AI + Fallback).
  triggers:
  - trigger: state
    entity_id:
    - person.caroline
    - person.bert
    to:
    - Nona & Pepe
    - Mimi & Fleri
    - Daycare
    - School De Wingerd
    - BKO Toverbos
  - trigger: state
    entity_id:
    - person.caroline
    - person.bert
    to:
    - Checkpoint 1
    - Checkpoint 2
    - Checkpoint 3
    - Checkpoint 4
    - Checkpoint 5
    - Mechelen Station
    - Willebroek Station
  conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: 'on'
  - condition: state
    entity_id: schedule.slapen
    state: 'off'
  actions:
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Zones Tracker Notificatie
      entity_id: ai_task.google_ai_task
      instructions: 'Je bent Siri en beheert de locatie-updates voor het gezin van
        Bert en Caroline. Een van de partners is zojuist aangekomen in een specifieke
        zone of checkpoint. Breng de andere partner hiervan op een vlot, spontaan
        en natuurlijk klinkend spraak- en tekstbericht op de hoogte.

        CONTEXT OVER DE ZONES VOOR JOUW BERICHT: - School/Opvang (Daycare, BKO Toverbos,
        School De Wingerd, Nona & Pepe, Mimi & Fleri): "[Naam] is aangekomen bij [Zone]."
        - Checkpoint 1: Autokeuring - Checkpoint 2: Op de brug / bijna thuis - Checkpoint
        3: Fort Breendonck - Checkpoint 4: Containerpark Willebroek - Checkpoint 5:
        Afrit Rumst E19 - Stations (Mechelen / Willebroek): Onderweg naar huis.

        HUIDIGE DATA: - Wie is getriggerd: {{ trigger.to_state.name }} - Welke zone/checkpoint:
        {{ trigger.to_state.state }} - Tijdstip: {{ now().strftime(''%H:%M'') }}

        Houd het kort, vlot en perfect geschikt voor een iOS notificatie (interruption-level:
        active) en een HomePod spraakbericht.

        STRIKTE FORMATTERING REGELS: 1. Geef DIRECT de tekst van de melding. Typ GEEN
        introductie. 2. Gebruik NOOIT Markdown-opmaak. Gebruik GEEN sterretjes (**)
        voor vetgedrukte tekst.  3. De output moet pure, schone platte tekst zijn
        die direct in een pushnotificatie en TTS past.'
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: '{% set p = ''BERT'' if trigger.entity_id == ''person.bert''
          else ''CARO'' %} {% set z = trigger.to_state.state %} {% if z in [''Daycare'',
          ''BKO Toverbos'', ''School De Wingerd'', ''Nona & Pepe'', ''Mimi & Fleri'']
          %} {{ p }} BIJ {{ z | upper }} {% elif z == ''Checkpoint 1'' %} {{ p }}
          AAN AUTOKEURING {% elif z == ''Checkpoint 2'' %} {{ p }} OP BRUG {% elif
          z == ''Checkpoint 3'' %} {{ p }} AAN FORT BREENDONCK {% elif z == ''Checkpoint
          4'' %} {{ p }} AAN CONTAINERPARK WILLEBROEK {% elif z == ''Checkpoint 5''
          %} {{ p }} AAN AFRIT RUMST E19 {% elif z in [''Willebroek Station'', ''Mechelen
          Station''] %} {{ p }} IN HET {{ z | upper }} {% else %} Locatie update {{
          trigger.to_state.name }}: {{ z }} {% endif %}'
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %}  {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          {% set p = trigger.to_state.name %} {% set z = trigger.to_state.state %}\n
          \ {% if z in ['Daycare', 'BKO Toverbos', 'School De Wingerd', 'Nona & Pepe',
          'Mimi & Fleri'] %}{{ p }} is aangekomen bij {{ z }}.\n  {% elif z in ['Checkpoint
          1', 'Checkpoint 4'] %}{{ p }} is onderweg naar huis (nabij {{ z }}).\n  {%
          elif z in ['Checkpoint 2', 'Checkpoint 3', 'Checkpoint 5'] %}{{ p }} is
          bijna thuis.\n  {% elif z in ['Willebroek Station', 'Mechelen Station']
          %}{{ p }} is onderweg naar huis en aangekomen in het {{ z }}.\n  {% else
          %}{{ p }} is nu in {{ z }}.{% endif %}\n{% endif %}"
        prioriteit: Geen
        melding_tag: '{{ ''bert-status'' if trigger.entity_id == ''person.bert'' else
          ''caro-status'' }}'
        melding_group: bewoner
    continue_on_error: true
  mode: parallel
  max: 10
- id: home_owner_006
  alias: 'Personen: Zones (Ziekenhuis)'
  description: Monitort de aankomst van Bert of Caroline bij ziekenhuizen en stuurt
    direct een  slimme AI of lokale notificatie via het centrale script.
  triggers:
  - trigger: state
    entity_id:
    - person.caroline
    - person.bert
    to:
    - Ziekenhuis St-Augustinus
    - Ziekenhuis Edegem
    - Ziekenhuis Reet
    - Ziekenhuis Middelheim
    for: 00:03:00
  conditions: []
  actions:
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Ziekenhuis Tracker Notificatie
      entity_id: ai_task.google_ai_task
      instructions: 'Je bent Siri en beheert de veiligheidsmeldingen voor het gezin
        van Bert en Caroline.

        SITUATIE: Een van de partners is zojuist aangekomen bij een ziekenhuislocatie.  Je
        moet de ANDERE partner hiervan op de hoogte stellen. Stel ze gerust zodat
        ze  niet direct in paniek raken, maar breng het vlot en helder over.

        HUIDIGE DATA: - Wie is getriggerd: {{ trigger.to_state.name }} - Welke locatie/zone:
        {{ trigger.to_state.state }} - Tijdstip: {{ now().strftime(''%H:%M'') }}

        Houd het kort, vlot en perfect geschikt voor een iOS notificatie en een HomePod
        spraakbericht.

        STRIKTE FORMATTERING REGELS: 1. Geef DIRECT de tekst van de melding. Typ GEEN
        introductie zoals "Hier is de melding:" of "Oké, ik heb dit gemaakt:". 2.
        Gebruik NOOIT Markdown-opmaak. Gebruik GEEN sterretjes (**) voor vetgedrukte
        tekst.  3. De output moet pure, schone platte tekst zijn die direct in een
        pushnotificatie past.'
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "{% if trigger.entity_id == 'person.bert' %}\n  ⚠️ ALERT!!
          BERT NABIJ {{ trigger.to_state.state | upper }}\n{% else %}\n  ⚠️ ALERT!!
          CARO NABIJ {{ trigger.to_state.state | upper }}\n{% endif %}"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %}  {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          Geen paniek, maar {{ trigger.to_state.name }} is nabij {{ trigger.to_state.state
          }}.\n{% endif %}"
        prioriteit: Kritiek
        melding_tag: '{{ ''bert-status'' if trigger.entity_id == ''person.bert'' else
          ''caro-status'' }}'
        melding_group: bewoner
    continue_on_error: true
  mode: single
  max_exceeded: silent
- id: '1774942000239'
  alias: 'NMBS: Slimme Update Per Spitsuur'
  description: Update specifieke NMBS sensors tijdens de spits om iRail te ontlasten.
  triggers:
  - trigger: time_pattern
    minutes: /2
    id: spits_trigger
  - trigger: time_pattern
    minutes: /30
    id: dal_trigger
  - trigger: state
    entity_id:
    - person.bert
    from:
    - home
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: person.bert
      state:
      - home
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: spits_trigger
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
        after: 06:45:00
        before: 08:30:00
      sequence:
      - action: homeassistant.update_entity
        target:
          entity_id:
          - sensor.nmbs
          - sensor.nmbs_2
    - conditions:
      - condition: trigger
        id: spits_trigger
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
        after: '15:20:00'
        before: '17:38:00'
      sequence:
      - action: homeassistant.update_entity
        target:
          entity_id:
          - sensor.nmbs_3
          - sensor.nmbs_4
    - conditions:
      - condition: trigger
        id: dal_trigger
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
      sequence:
      - action: homeassistant.update_entity
        target:
          entity_id:
          - sensor.nmbs
          - sensor.nmbs_2
          - sensor.nmbs_3
          - sensor.nmbs_4
  mode: queued
- id: home_owner_bert_arrival
  alias: 'NMBS: Bert - Notificatie bij Aankomst Station'
  description: Stuurt treininfo via het centrale notificatiesysteem zodra Bert aankomt
    op een relevant station.
  triggers:
  - trigger: state
    entity_id: person.bert
    to:
    - Willebroek Station
    - Mechelen Station
    - Brussel Station
  conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: 'on'
  - condition: state
    entity_id: input_boolean.notify_bert
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: person.bert
        state: Willebroek Station
      - condition: time
        before: '12:00:00'
      sequence:
      - variables:
          gekozen_sensor: sensor.nmbs
          gekozen_route: WILL-MECH
    - conditions:
      - condition: state
        entity_id: person.bert
        state: Mechelen Station
      - condition: time
        before: '13:00:00'
      sequence:
      - variables:
          gekozen_sensor: sensor.nmbs_2
          gekozen_route: MECH-BRUS
    - conditions:
      - condition: state
        entity_id: person.bert
        state: Mechelen Station
      - condition: time
        after: '13:00:00'
      sequence:
      - variables:
          gekozen_sensor: sensor.nmbs_3
          gekozen_route: MECH-WILL
    - conditions:
      - condition: state
        entity_id: person.bert
        state: Brussel Station
      - condition: time
        after: '12:00:00'
      sequence:
      - variables:
          gekozen_sensor: sensor.nmbs_4
          gekozen_route: BRUS-MECH
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "\U0001F682 {{ state_attr(gekozen_sensor, 'departure') | default('00:00')
          }} Trein {{ gekozen_route }}"
        melding_tekst: '{% set s = gekozen_sensor %} {% set spoor_vertrek = state_attr(s,
          ''platform_departing'') | default(''?'', true) %} {% set richting = state_attr(s,
          ''direction'') | default(''Onbekend'') %} {% set spoor_aankomst = state_attr(s,
          ''platform_arriving'') | default(''?'', true) %}

          Spoor {{ spoor_vertrek }} richting {{ richting }}. Aankomst op spoor {{
          spoor_aankomst }}.'
        prioriteit: Bert Push
        melding_tag: trein-status
        melding_group: trein
        url: /lovelace/treinen
  mode: parallel
  max: 5
- id: home_owner_bert_data_change
  alias: 'NMBS: Bert - Update bij Wijziging Info'
  description: Update de info via het centrale notificatiesysteem als de treininfo
    wijzigt terwijl Bert op het station wacht.
  triggers:
  - trigger: state
    entity_id: sensor.nmbs_template
    id: trigger_will
  - trigger: state
    entity_id: sensor.nmbs_2_template
    id: trigger_mech_brus
  - trigger: state
    entity_id: sensor.nmbs_3_template
    id: trigger_mech_will
  - trigger: state
    entity_id: sensor.nmbs_4_template
    id: trigger_brus
  conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: 'on'
  - condition: state
    entity_id: input_boolean.notify_bert
    state: 'on'
  actions:
  - variables:
      berekende_route: "{% set t = trigger.id %} {% set p = states('person.bert')
        %} {% set h = now().hour %} {% if t == 'trigger_will' and p == 'Willebroek
        Station' and h < 12 %}\n  WILL-MECH\n{% elif t == 'trigger_mech_brus' and
        p == 'Mechelen Station' and h < 13 %}\n  MECH-BRUS\n{% elif t == 'trigger_mech_will'
        and p == 'Mechelen Station' and h >= 13 %}\n  MECH-WILL\n{% elif t == 'trigger_brus'
        and p == 'Brussel Station' and h >= 12 %}\n  BRUS-MECH\n{% else %}\n  GEEN_MATCH\n{%
        endif %}"
      gekozen_sensor: '{% if berekende_route == ''WILL-MECH'' %} sensor.nmbs {% elif
        berekende_route == ''MECH-BRUS'' %} sensor.nmbs_2 {% elif berekende_route
        == ''MECH-WILL'' %} sensor.nmbs_3 {% elif berekende_route == ''BRUS-MECH''
        %} sensor.nmbs_4 {% else %} none {% endif %}'
  - condition: template
    value_template: '{{ berekende_route != ''GEEN_MATCH'' and gekozen_sensor is not
      none }}'
    alias: Controleer of er een geldige route is bepaald
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: '⚠️ UPDATE: {{ state_attr(gekozen_sensor, ''departure'') |
          default(''00:00'', true) }} Trein {{ berekende_route }}'
        melding_tekst: '{% set s = gekozen_sensor %} {% set spoor_vertrek = state_attr(s,
          ''platform_departing'') | default(''?'', true) %} {% set richting = state_attr(s,
          ''direction'') | default(''Onbekend'') %} {% set spoor_aankomst = state_attr(s,
          ''platform_arriving'') | default(''?'', true) %}

          Spoor {{ spoor_vertrek }} richting {{ richting }}. Aankomst op spoor {{
          spoor_aankomst }}.'
        prioriteit: Bert Push
        melding_tag: trein-status
        melding_group: trein
        click_url: /lovelace/treinen
    continue_on_error: true
  mode: restart
- id: visitor_001
  alias: 'Personen: Bezoeker Aangekomen'
  description: Stuurt een melding naar Bert en Caroline via het centrale systeem als
