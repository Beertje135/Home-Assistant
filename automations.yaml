  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Verwarming Keuken \U0001F321️"
        melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}\n{#
          Bouw een zeer gedetailleerde lokale fallback op #} {% set schuifraam = is_state('binary_sensor.aqara_raamsensor_1',
          'on') %} {% set achterdeur = is_state('binary_sensor.aqara_raamsensor_5',
          'on') %} {% set bert = is_state('person.bert', 'home') %} {% set caroline
          = is_state('person.caroline', 'home') %} {% set bezoek = is_state('binary_sensor.bezoek',
          'on') %}\n{# Bepaal welke opening openstaat #} {% if schuifraam and achterdeur
          %}\n  {% set opening = 'het schuifraam en de achterdeur' %}\n{% elif schuifraam
          %}\n  {% set opening = 'het schuifraam' %}\n{% else %}\n  {% set opening
          = 'de achterdeur' %}\n{% endif %}\n{# Bepaal wie er aangesproken wordt #}
          {% if bert and caroline %}\n  {% set wie = 'Bert en Caroline' %}\n{% elif
          bert %}\n  {% set wie = 'Bert' %}\n{% elif caroline %}\n  {% set wie = 'Caroline'
          %}\n{% elif bezoek %}\n  {% set wie = 'Beste gasten' %}\n{% else %}\n  {%
          set wie = 'Iedereen' %}\n{% endif %}\n{% set fallback = '⚠️ [Lokaal] ' ~
          wie ~ ', ' ~ opening ~ ' in de keuken staat open. Ik zet de verwarming zo
          uit om energie te besparen.' %}\n{{ render_melding(ai_antwoord, fallback)
          }}"
        prioriteit: Geen
        melding_tag: hvac-status-keuken
        melding_group: huis
  - delay: 00:01:00
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: binary_sensor.aqara_raamsensor_1
        state: 'on'
      - condition: state
        entity_id: binary_sensor.aqara_raamsensor_5
        state: 'on'
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.keuken
      data:
        hvac_mode: 'off'
  mode: queued
  max: 10
  max_exceeded: silent
- id: '1757946580128'
  alias: 'HVAC: Verwarming Keuken - Deuren toe dus reset'
  description: Zet de keukenverwarming terug op het normale schema zodra alles dicht
    is.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.aqara_raamsensor_1
    - binary_sensor.aqara_raamsensor_5
    to: 'off'
  conditions:
  - condition: state
    entity_id: sensor.woning_hvac_modus
    state: Verwarmen
  - condition: state
    entity_id: binary_sensor.aqara_raamsensor_1
    state: 'off'
  - condition: state
    entity_id: binary_sensor.aqara_raamsensor_5
    state: 'off'
  - condition: template
    value_template: '{{ is_state(''climate.keuken'', ''off'') or state_attr(''climate.keuken'',
      ''preset_mode'') != ''none'' }}'
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Raam open keuken
        entity_id: ai_task.google_ai_task
        instructions: '{% from ''ai_formatting.jinja'' import persona, regels %} {{
          persona() }} Wees kort en krachtig (geschikt voor iOS en pushmeldingen).

          CRUCIALE OPDRACHT: Bedank de aanwezigen (Bert en/of Caroline indien ze thuis
          zijn, dan wel het bezoek specifiek) voor het sluiten van het raam of de
          deur die zojuist is dichtgedaan. Vermeld dat de verwarming nu weer lekker
          aan kan gaan.

          TRIGGER INFO (DIT IS NET GESLOTEN):  - Gesloten object: {{ trigger.to_state.name
          }}

          HUIDIGE STATUS VAN DE DEUREN/RAMEN (ALLES IS NU DICHT):  - Achterdeur: {{
          states(''binary_sensor.aqara_raamsensor_5'') }}  - Schuifraam keuken: {{
          states(''binary_sensor.aqara_raamsensor_1'') }}

          WIE IS ER THUIS:  - Bert is: {{ states(''person.bert'') }}  - Caroline is:
          {{ states(''person.caroline'') }}  - Bezoek-modus actief: {{ states(''binary_sensor.bezoek'')
          }}

          {{ regels() }}'
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Verwarming Keuken \U0001F321️"
        melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}\n{#
          Bouw een zeer gedetailleerde lokale fallback op #} {% set bert = is_state('person.bert',
          'home') %} {% set caroline = is_state('person.caroline', 'home') %} {% set
          bezoek = is_state('binary_sensor.bezoek', 'on') %} {% set object_naam =
          trigger.to_state.name | default('het raam of de deur') %}\n{# Bepaal wie
          er aangesproken wordt #} {% if bert and caroline %}\n  {% set wie = 'Bert
          en Caroline' %}\n{% elif bert %}\n  {% set wie = 'Bert' %}\n{% elif caroline
          %}\n  {% set wie = 'Caroline' %}\n{% elif bezoek %}\n  {% set wie = 'Beste
          gasten' %}\n{% else %}\n  {% set wie = 'Iedereen' %}\n{% endif %}\n{% set
          fallback = '⚠️ [Lokaal] Bedankt ' ~ wie ~ ' om ' ~ object_naam ~ ' te sluiten!
          Alle ramen zijn toe, de verwarming in de keuken wordt weer hervat.' %}\n{{
          render_melding(ai_antwoord, fallback) }}"
        prioriteit: Spreek Alleen
        melding_tag: hvac-status-keuken
        melding_group: huis
    continue_on_error: true
  - action: climate.set_hvac_mode
    target:
      entity_id: climate.keuken
    data:
      hvac_mode: heat
  - action: climate.set_preset_mode
    target:
      entity_id: climate.keuken
    data:
      preset_mode: none
  mode: single
  max_exceeded: silent
- id: '1759861914856'
  alias: Weerbericht - Kinderen Kledingadvies - Notificatie
  description: Genereert 's avonds kledingadvies voor morgen voor Trix en Elmo via
    AI en slaat de samenvatting op voor het display. Loopt via het centrale notificatiescript.
  triggers:
  - trigger: time
    at: '18:45:00'
  conditions: []
  actions:
  - variables:
      huidige_datum: '{{ now().strftime(''%d-%m-%Y'') }}'
      forecast_data: "{% set forecast = state_attr('sensor.pirate_weather_daily',
        'forecast') %} {% if forecast and forecast[1] is defined %}\n  {% set f =
        forecast[1] %}\n  Weerbeeld morgen: {{ f.condition }}, Max Temp: {{ f.temperature
        }} graden Celsius, Min Temp: {{ f.templow }} graden Celsius, Regenbuien kans:
        {{ f.precipitation_probability }}%\n{% else %}\n  GEEN_DATA\n{% endif %}\n"
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Kledingadvies kinderen
        entity_id: ai_task.google_ai_task
        instructions: '{% from ''ai_formatting.jinja'' import persona, regels %} {{
          persona() }} Je bent Homey, de vrolijke en behulpzame huismeester. Vat op
          een grappige manier samen welke kleding Elmo (jongen van 7 jaar) en Trix
          (meisje van 4 jaar) MORGEN het beste aandoen naar school. Datum vandaag:
          {{ huidige_datum }}.

          KINDEREN:  - Elmo (7 jaar): mag van zichzelf een korte broek aan tot het
          vriest (minder dan 0 graden Celsius). Speel hier op een grappige manier
          op in! - Trix (4 jaar).

          Wees kort, bondig en gevat in je advies. MAXIMAAL 250 tekens (UUTERST BELANGRIJK
          voor het display).

          WEERGEGEVENS VOOR MORGEN: {{ forecast_data }}

          Als hierboven ''GEEN_DATA'' staat, meld dan op een grappige manier dat de
          weergoden staken en ze zelf maar even moeten gokken welke jas er nodig is.

          {{ regels() }}

          '
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: input_text.set_value
    target:
      entity_id: input_text.weer_samenvatting
    data:
      value: '{% from ''ai_formatting.jinja'' import render_melding %} {% set fallback
        = ''[Lokaal] Geen weersvoorspelling beschikbaar voor morgen.'' %} {{ render_melding(ai_antwoord,
        fallback)[:250] }}

        '
    continue_on_error: true
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Kledingadvies voor morgen \U0001F455\U0001F457"
        melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}\n{#
          Uitgebreide lokale fallback met de weersvoorspelling voor morgen #} {% set
          forecast = state_attr('sensor.pirate_weather_daily', 'forecast') %} {% if
          forecast and forecast[1] is defined %}\n  {% set f = forecast[1] %}\n  {%
          set temp = f.temperature | float %}\n  {% set jas = 'Voorzie dikke jassen!'
          if temp < 12 else ('Dunne jassen zijn prima voor morgen.' if temp < 18 else
          'Geen jassen nodig!') %}\n  {% set broek = 'Elmo mag in zijn geliefde korte
          broek,' if temp > 0 else 'Brr, het vriest, lange broek voor Elmo!' %}\n
          \ {% set regen = ' en vergeet de paraplu niet!' if f.precipitation_probability
          | float > 40 else '' %}\n  {% set fallback = '⚠️ [Lokaal] Kledingadvies
          voor morgen: Het wordt ' ~ temp ~ ' graden. ' ~ jas ~ ' ' ~ broek ~ regen
          %}\n{% else %}\n  {% set fallback = '⚠️ [Lokaal] Morgen is het weer een
          verrassing! Kijk vanavond zelf nog even naar de sterren of de wolken.' %}\n{%
          endif %}\n{{ render_melding(ai_antwoord, fallback) }}\n"
        prioriteit: Geen
        melding_tag: weer-status
        melding_group: huis
        click_url: /lovelace/favorieten
    continue_on_error: true
  mode: single
- id: '1760007343796'
  alias: 'Muziek: Keuken - Boolean Volgen Aan'
  description: Herstelt de 'volgen' status voor de keuken HomePod op basis van status,
    tijd of hervat-verzoek.
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: time
    at: '19:15:00'
  - trigger: state
    entity_id: media_player.apple_homepod_mini_wit_1
    to: playing
    for:
      minutes: 3
  - trigger: state
    entity_id: input_select.woning_status
  - trigger: state
    entity_id: input_boolean.muziek_homepod_wit_1_volgen
    to: 'off'
    for:
      minutes: 4
  - trigger: state
    entity_id: input_boolean.muziek_homepod_wit_1_volgen
    to: 'off'
    for:
      minutes: 180
  - trigger: state
    entity_id: input_boolean.muziek_homepod_wit_1_hervat
    to: 'on'
    for:
      seconds: 10
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.muziek_homepod_wit_1_volgen
      state: 'off'
      for:
        minutes: 179
    - condition: state
      entity_id: input_boolean.muziek_homepod_wit_1_hervat
      state: 'on'
    - condition: time
      after: '19:10:00'
    - condition: state
      entity_id: media_player.apple_homepod_mini_wit_1
      state: playing
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.woning_status
      state: Thuis Werk
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.muziek_homepod_wit_1_volgen
