- id: homeassistant_004
  alias: 'Systeem: HomeAssistant - Hoge Belasting'
  description: Waarschuwt inclusief de naam van de sensor die boven de 90% komt.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.memory_use_percent
    - sensor.disk_use_percent_home
    - sensor.processor_use
    above: 90
    for:
      hours: 0
      minutes: 1
      seconds: 0
  actions:
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "{% if states('input_select.woning_status') in ['Slapen', 'Op
          Vakantie'] %}\n  ⚠️ SERVER ALERT (Stil)\n{% else %}\n  \U0001F6A8 SERVER
          CRITICAL\n{% endif %}\n"
        melding_tekst: "{% if states('input_select.woning_status') in ['Slapen', 'Op
          Vakantie'] %}\n  Systeembelasting hoog tijdens nacht: {{ trigger.to_state.attributes.friendly_name
          }} ({% if trigger.to_state.state is defined %}{{ trigger.to_state.state
          | replace('%', '') }}{% endif %} procent).\n{% else %}\n  Systeembelasting
          te hoog! Sensor: {{ trigger.to_state.attributes.friendly_name }} ({% if
          trigger.to_state.state is defined %}{{ trigger.to_state.state | replace('%',
          '') }}{% endif %} procent). Controleer de logs.\n{% endif %}\n"
        prioriteit: "{% if states('input_select.woning_status') in ['Slapen', 'Op
          Vakantie'] %}\n  Bert Push\n{% else %}\n  Bert Push\n{% endif %}\n"
        melding_tag: server-alert
  mode: parallel
  max: 3
- id: harmony_001
  alias: 'Harmony: Sync - Hub naar Input Select'
