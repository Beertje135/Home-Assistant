- id: '1779963472966'
  alias: 'Licht: Woonkamer - Status Synchronisatie'
  description: Houdt de fysieke Hue-filamentlamp en de Home Assistant helper-boolean  perfect
    in sync in beide richtingen, met uitsluiting van netwerkfouten (unavailable).
  triggers:
  - trigger: state
    entity_id: light.hue_white_filament_globe_g125_1
    id: sync_naar_boolean
  - trigger: state
    entity_id: input_boolean.light_livingroom
    id: sync_naar_lamp
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state in [''on'', ''off''] }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''sync_naar_boolean'' }}'
      - condition: template
        value_template: '{{ states(''input_boolean.light_livingroom'') != trigger.to_state.state
          }}'
      sequence:
      - action: input_boolean.turn_{{ trigger.to_state.state }}
        target:
          entity_id: input_boolean.light_livingroom
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''sync_naar_lamp'' }}'
      - condition: template
        value_template: '{{ states(''light.hue_white_filament_globe_g125_1'') != trigger.to_state.state
          }}'
      sequence:
      - action: light.turn_{{ trigger.to_state.state }}
        target:
          entity_id: light.hue_white_filament_globe_g125_1
  mode: single
