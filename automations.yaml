    attribute: current_activity
    state: PowerOff
  actions:
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.harmony_hub
    data:
      option: Apple tv
  mode: single
  max_exceeded: silent
- id: heating_state_house_001
  alias: 'HVAC: EvoHome - Weg (Eco Mode)'
  description: Zet de verwarming lager (AutoWithEco) als we langer weg zijn, op het
    werk zijn of ver weg zijn, mits het huis centraal in de modus Verwarmen staat.
  triggers:
  - trigger: state
    entity_id: input_select.woning_status
    to: Weg
    for: 01:30:00
  - trigger: state
    entity_id: person.caroline
    to: Werk (Caro)
  - trigger: state
    entity_id: person.bert
    to: Werk (Bert)
  - trigger: numeric_state
    entity_id: sensor.home_nearest_distance
    above: 100
  conditions:
  - condition: state
    entity_id: sensor.woning_hvac_modus
    state: Verwarmen
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.ons_huisje
      attribute: preset_mode
      state: eco
  - condition: or
    conditions:
    - condition: state
      entity_id: input_select.woning_status
      state: Weg
      for: 01:30:00
    - condition: and
      conditions:
      - condition: state
        entity_id: person.caroline
        state: Werk (Caro)
      - condition: state
        entity_id: person.bert
        state: Werk (Bert)
    - condition: and
      conditions:
      - condition: numeric_state
        entity_id: sensor.home_nearest_distance
        above: 100
      - condition: state
        entity_id: sensor.home_nearest_direction_of_travel
        state: away_from
  actions:
  - action: evohome.set_system_mode
    data:
      mode: AutoWithEco
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Verwarming Weg Eco
        entity_id: ai_task.google_ai_task
        instructions: '{% from ''ai_formatting.jinja'' import persona, regels %} {{
          persona() }}

          Iedereen is nu een tijdje weg van huis (of aan het werk / ver weg).  De
          verwarming is daarom automatisch naar de energiebesparende eco-modus geschakeld.  Meld
          dit op een slimme, efficiënte manier en bevestig dat we energie besparen.

          {{ regels() }}

          '
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "\U0001F343 Verwarming naar Eco-stand"
        melding_tekst: '{% from ''ai_formatting.jinja'' import render_melding %} {%
          set fallback = ''⚠️ [Lokaal] Iedereen is weg. De verwarming is naar de lagere
          eco-stand geschakeld om energie te besparen.'' %}

          {{ render_melding(ai_antwoord, fallback) }}'
        prioriteit: Geen
        melding_tag: hvac-weg-status
        melding_group: huis
    continue_on_error: true
  mode: single
  max_exceeded: silent
- id: heating_state_house_002
  alias: 'HVAC: EvoHome - Thuis (Auto Mode)'
  description: Zet het Evohome-systeem direct terug op Auto (schema) zodra we thuis
    zijn of opstaan, mits het huis centraal in de modus Verwarmen staat.
  triggers:
  - trigger: state
    entity_id: input_select.woning_status
    to: Thuis
  - trigger: state
    entity_id: input_select.woning_status
    to: Juist Thuis
  - trigger: state
    entity_id: input_select.woning_status
    to: Juist Wakker
  conditions:
  - condition: state
    entity_id: sensor.woning_hvac_modus
    state: Verwarmen
  actions:
  - action: evohome.set_system_mode
    data:
      mode: Auto
  mode: single
  max_exceeded: silent
- id: heating_state_house_003
  alias: 'HVAC: EvoHome - Slapen (Custom Mode)'
  description: Zet het Evohome-systeem direct op Custom zodra de woningstatus naar
    Slapen verandert, mits het huis in de modus Verwarmen staat.
  triggers:
  - trigger: state
    entity_id: input_select.woning_status
    to: Slapen
  conditions:
  - condition: state
    entity_id: sensor.woning_hvac_modus
    state: Verwarmen
  actions:
  - action: evohome.set_system_mode
    data:
      mode: Custom
  mode: single
  max_exceeded: silent
- id: heating_state_house_004
  alias: 'HVAC: EvoHome - Vakantie (Uit)'
  description: Schakelt de verwarming naar Eco (winter) of volledig Uit (andere seizoenen)
    bij vertrek op vakantie, mits het huis centraal in de modus Verwarmen staat.
  triggers:
  - trigger: state
    entity_id: input_select.woning_status
    to: Op Vakantie
  conditions:
  - condition: state
    entity_id: sensor.woning_hvac_modus
    state: Verwarmen
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.season
        state: winter
      sequence:
      - action: evohome.set_system_mode
        target:
          entity_id: climate.ons_huisje
        data:
          mode: AutoWithEco
      - if:
        - condition: state
          entity_id: input_boolean.lokale_notificaties
          state: 'off'
        then:
        - action: ai_task.generate_data
          continue_on_error: true
          data:
            task_name: Verwarming Vakantie Winter
            entity_id: ai_task.google_ai_task
            instructions: '{% from ''ai_formatting.jinja'' import persona, regels
              %} {{ persona() }}

              Bert en Caroline vertrekken zojuist op vakantie in de winter.  Meld
              hen dat de woningstatus op vakantie staat en dat de verwarming automatisch
              naar de energiebesparende eco-modus is geschakeld om het huis te beschermen
              tegen de kou. Wens hen een fijne vakantie.

              {{ regels() }}

              '
          response_variable: ai_antwoord
        else:
        - variables:
            ai_antwoord:
              response: ''
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: "\U0001F9F3 Vakantiemodus geactiveerd (Eco)"
            melding_tekst: '{% from ''ai_formatting.jinja'' import render_melding
              %} {% set fallback = ''⚠️ [Lokaal] Fijne vakantie! De woning staat op
              vakantiemodus en de verwarming is op de lagere eco-stand gezet om het
              huis te beschermen.'' %}

              {{ render_melding(ai_antwoord, fallback) }}'
            prioriteit: Geen
            melding_tag: hvac-vakantie-status
            melding_group: huis
        continue_on_error: true
    default:
    - action: evohome.set_system_mode
      target:
        entity_id: climate.ons_huisje
      data:
        mode: HeatingOff
    - if:
      - condition: state
        entity_id: input_boolean.lokale_notificaties
        state: 'off'
      then:
      - action: ai_task.generate_data
        continue_on_error: true
        data:
          task_name: Verwarming Vakantie Overig
          entity_id: ai_task.google_ai_task
          instructions: '{% from ''ai_formatting.jinja'' import persona, regels %}
            {{ persona() }}

            Bert en Caroline vertrekken zojuist op vakantie (buiten het winterseizoen).  Meld
            hen dat de woningstatus op vakantie staat en dat de verwarming volledig
            is uitgeschakeld om energie te besparen. Wens hen een fantastische en
            zorgeloze reis.

            {{ regels() }}

            '
        response_variable: ai_antwoord_default
      else:
      - variables:
          ai_antwoord_default:
            response: ''
    - action: script.turn_on
      target:
        entity_id: script.centraal_universele_notificatie_spraak
      data:
        variables:
          melding_titel: "\U0001F9F3 Vakantiemodus geactiveerd (Uit)"
          melding_tekst: '{% from ''ai_formatting.jinja'' import render_melding %}
            {% set fallback = ''⚠️ [Lokaal] Fijne vakantie! De woning staat op vakantiemodus
            en de verwarming is volledig uitgeschakeld.'' %}

            {{ render_melding(ai_antwoord_default, fallback) }}'
          prioriteit: Geen
          melding_tag: hvac-vakantie-status
          melding_group: huis
      continue_on_error: true
  mode: single
  max_exceeded: silent
- id: heating_timer_001
  alias: 'HVAC: EvoHome - Badkamer Timer Reset naar Auto'
  description: Zet de badkamer thermostaat automatisch terug naar het schema (preset_mode
    none) na 3 uur handmatige override.
  triggers:
  - trigger: state
    entity_id: climate.badkamer
    attribute: preset_mode
    to: temporary
    for: 03:00:00
