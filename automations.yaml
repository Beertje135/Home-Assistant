- id: '1759861914856'
  alias: Weerbericht - Kinderen Kledingadvies - Notificatie
  description: Genereert 's avonds kledingadvies voor morgen voor Trix en Elmo via
    AI en slaat de samenvatting op voor het display. Loopt via het centrale notificatiescript.
  triggers:
  - trigger: time
    at: '18:45:00'
  conditions: []
  actions:
  - variables:
      huidige_datum: '{{ now().strftime(''%d-%m-%Y'') }}'
      forecast_data: "{% set forecast = state_attr('sensor.pirate_weather_daily',
        'forecast') %} {% if forecast and forecast[1] is defined %}\n  {% set f =
        forecast[1] %}\n  Weerbeeld morgen: {{ f.condition }}, Max Temp: {{ f.temperature
        }} graden Celsius, Min Temp: {{ f.templow }} graden Celsius, Regenbuien kans:
        {{ f.precipitation_probability }}{{ '%' }}\n{% else %}\n  GEEN_DATA\n{% endif
        %}"
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Kledingadvies kinderen
      entity_id: ai_task.google_ai_task
      instructions: 'Je bent een behulpzame, vrolijke assistent. Vat samen welke kleding
        Elmo  en Trix MORGEN best aandoen naar school. Datum vandaag: {{ huidige_datum
        }}.

        KINDEREN: - Elmo (jongen, 2018): mag een korte broek aan tot het vriest (minder
        dan 0 graden Celsius). - Trix (meisje, 2022).

        Wees kort, bondig en grappig in je advies. MAXIMAAL 250 tekens (HEEL BELANGRIJK
        voor het display).

        WEERGEGEVENS VOOR MORGEN: {{ forecast_data }}

        Als hierboven ''GEEN_DATA'' staat, meld dan op een grappige manier dat de
        weergoden staken en ze zelf maar even moeten gokken welke jas er nodig is.

        STRIKTE FORMATTERING REGELS: 1. Geef DIRECT de tekst van het kledingadvies.
        Typ GEEN introductie. 2. Gebruik NOOIT Markdown-opmaak. Gebruik GEEN sterretjes
        (**) voor vetgedrukte tekst.  3. De output moet pure, schone platte tekst
        zijn die direct in een pushnotificatie en TTS past.'
    response_variable: ai_antwoord
  - action: input_text.set_value
    target:
      entity_id: input_text.weer_samenvatting
    data:
      value: "{% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
        is defined and ai_antwoord.data | trim != \"\" %} {% if ai_beschikbaar %}\n
        \ {{ ai_antwoord.data[:250] }}\n{% else %}\n  [Lokaal] Geen weersvoorspelling
        beschikbaar voor morgen.\n{% endif %}"
    continue_on_error: true
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Kledingadvies voor morgen \U0001F455\U0001F457"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %}  {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          {% set forecast = state_attr('sensor.pirate_weather_daily', 'forecast')
          %}\n  {% if forecast and forecast[1] is defined %}\n    {% set f = forecast[1]
          %}\n    Kledingadvies voor morgen: Het wordt {{ f.temperature }} graden.
          {% if f.temperature | float < 12 %}Voorzie dikke jassen!{% elif f.temperature
          | float < 18 %}Dunne jassen zijn prima voor morgen.{% else %}Geen jassen
          nodig!{% endif %} {% if f.temperature | float > 0 %}Elmo mag in zijn geliefde
          korte broek,{% else %}Brr, het vriest, lange broek voor Elmo!{% endif %}
          {% if f.precipitation_probability | float > 40 %}en vergeet de paraplu niet!{%
          endif %}\n  {% else %}\n    Morgen is het weer een verrassing! Kijk vanavond
          zelf nog even naar de sterren of de wolken.\n  {% endif %}\n{% endif %}"
        prioriteit: Geen
        melding_tag: weer-status
        melding_group: huis
        click_url: /lovelace/favorieten
    continue_on_error: true
  mode: single
