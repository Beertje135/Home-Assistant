- id: printer_001
  alias: 'Computer: Printer - Inkt bijna op'
  description: Stuurt een notificatie-script aan wanneer het inktniveau van de zwarte
    of kleuren-cartridge onder de 10% zakt.
  triggers:
  - entity_id:
    - sensor.hp_deskjet_3700_series_black_ink
    - sensor.hp_deskjet_3700_series_tri_color_ink
    below: 10
    trigger: numeric_state
  actions:
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Printer Status
      entity_id: ai_task.google_ai_task
      instructions: "Je bent Siri, de gevatte huisassistent. Breng Bert op een korte
        en duidelijke manier op de hoogte van de inktstatus van de printer. Wees to-the-point
        en geschikt voor een snelle iOS-notificatie.\nHUIDIGE INKTNIVEAUS: - Zwarte
        inkt: {{ states('sensor.hp_deskjet_3700_series_black_ink') }}% - Kleureninkt:
        {{ states('sensor.hp_deskjet_3700_series_tri_color_ink') }}%\nLOGICA: - Als
        een van de twee (of beide) onder de 11% staat, herinner hem er dan dringend
        maar vriendelijk aan om nieuwe cartridges te bestellen. - Als alles boven
        de 11% staat, geef dan gewoon een korte, geruststellende statusupdate.\nSTRIKTE
        FORMATTERING REGELS:\n1. Geef DIRECT de tekst van de melding. Typ GEEN introductie
        zoals \"Hier is de melding:\" of \"Oké, ik heb dit gemaakt:\".\n2. Gebruik
        NOOIT Markdown-opmaak. Gebruik GEEN sterretjes (**) voor vetgedrukte tekst.
        \n3. De output moet pure, schone platte tekst zijn die direct in een pushnotificatie
        past."
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "\U0001F5A8️ Printer Status Update"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %} {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  {% set zwart
          = states('sensor.hp_deskjet_3700_series_black_ink') | float(0) %}\n  {%
          set kleur = states('sensor.hp_deskjet_3700_series_tri_color_ink') | float(0)
          %}\n  ⚠️ [Lokaal] {% if zwart < 11 and kleur < 11 %}De printer zit bijna
          zonder inkt. Bestel zowel zwarte als kleureninkt!{% elif zwart < 11 %}De
          zwarte inkt is bijna op ({{ zwart }}%). Tijd om een nieuwe te bestellen.{%
          elif kleur < 11 %}De kleureninkt is bijna op ({{ kleur }}%). Tijd om een
          nieuwe te bestellen.{% else %}De printer heeft nog genoeg inkt (Zwart: {{
          zwart }}%, Kleur: {{ kleur }}%).{% endif %}\n{% endif %}"
        prioriteit: Bert
        melding_tag: huis-printer
    continue_on_error: true
  mode: single
  max_exceeded: silent
- id: house_001
  alias: 'Ons Huisje: Status Acties'
