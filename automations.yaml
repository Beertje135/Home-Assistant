          - light.hue_lily_outdoor_spot_light_rgbcct_3
          - light.hue_lily_outdoor_spot_light_rgbcct_4
          - light.hue_lily_outdoor_spot_light_rgbcct_5
          - light.hue_lily_outdoor_spot_light_rgbcct_6
          - light.hue_lily_outdoor_spot_light_rgbcct_7
          - light.hue_lily_outdoor_spot_light_rgbcct_8
        data:
          effect: sparkle
    - conditions:
      - condition: state
        entity_id: sensor.season
        state: autumn
      sequence:
      - service: scene.turn_on
        target:
          entity_id: scene.tuin_2_alles_herfst
        data:
          transition: 5
    - conditions:
      - condition: state
        entity_id: sensor.season
        state: winter
      sequence:
      - service: scene.turn_on
        target:
          entity_id: scene.tuin_alles_winter
        data:
          transition: 5
    - conditions:
      - condition: state
        entity_id: sensor.season
        state: spring
      sequence:
      - service: scene.turn_on
        target:
          entity_id: scene.tuin_alles_lente
        data:
          transition: 5
    - conditions:
      - condition: state
        entity_id: sensor.season
        state: summer
      sequence:
      - service: scene.turn_on
        target:
          entity_id: scene.tuin_alles_zomer
        data:
          transition: 5
    default:
    - service: scene.turn_on
      target:
        entity_id: scene.tuin2_normaal
      data:
        transition: 5
