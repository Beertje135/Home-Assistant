    state: 'off'
  - condition: state
    entity_id: input_select.woning_status
    state:
    - Thuis
    - Thuis Werk
    - Thuis Verlof
  - condition: state
    entity_id: schedule.tv_auto_aan
    state: 'on'
  - condition: state
