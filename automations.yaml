  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Bedtijd voor Elmo \U0001F319"
        melding_tekst: Het is tijd voor Elmo om te gaan slapen. Het ritueel is gestart.
        spraak_boodschap: '{% from ''ai_formatting.jinja'' import render_melding %}

          {# Lokale fallback string voor de HomePod #} {% set fallback = ''⚠️ [Lokaal]
          Attentie Elmo! Het is tijd om je klaar te maken voor bed. Tijd voor een
          boekje en je papje!'' %}

          {{ render_melding(ai_antwoord, fallback) }}

          '
        prioriteit: Geen
        melding_tag: kids-status
        melding_group: huis
    continue_on_error: true
  mode: single
  max_exceeded: silent
- id: '1764674501249'
  alias: 'Personen: Zones (Thuis) - Laatste persoon vertrekt'
  description: Activeert het AI-notificatiescript met specifieke prioriteit voor de
    laatste bewoner die het huis verlaat.
  triggers:
  - trigger: zone
    entity_id: device_tracker.iphone_van_bert
    zone: zone.home
    event: leave
    id: bert_vertrekt
  - trigger: zone
    entity_id: device_tracker.iphone_van_caroline
    zone: zone.home
    event: leave
    id: caroline_vertrekt
  conditions:
  - condition: state
    entity_id: group.bewoners_tracker
    state: not_home
  actions:
  - variables:
      vertrekkende_persoon: '{% if trigger.id == ''bert_vertrekt'' %}Bert{% else %}Caroline{%
        endif %}

        '
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Vertrek Woning Check
        entity_id: ai_task.google_ai_task
        instructions: "{% from 'ai_formatting.jinja' import persona, regels %} {{
          persona() }} Iedereen heeft zojuist de woning verlaten. **{{ vertrekkende_persoon
          }}** is als allerlaatste vertrokken en heeft de deur achter zich dichtgetrokken.
          Spreek {{ vertrekkende_persoon }} persoonlijk en rechtstreeks aan in je
          bericht.\nGeef een kort, vlot en ietwat grappig overzicht van de status
          van het huis op basis van de meegegeven data. Als er ramen/deuren open staan,
          waarschuw {{ vertrekkende_persoon }} dan specifiek (en al zeker als het
          gaat regenen in de komende uren of heel warm gaat worden). Als alles perfect
          in orde is, wens hen dan een fijne reis of een fijne dag!\nHUIDIGE STATUS
          VAN HET HUIS:  - Woning status: {{ states('input_select.woning_status')
          }}  - Schuifraam keuken: {{ states('binary_sensor.aqara_raamsensor_1') }}
          \ - Raam Trix: {{ states('binary_sensor.aqara_raamsensor_2') }}  - Raam
          Elmo: {{ states('binary_sensor.aqara_raamsensor_3') }}  - Raam Zolder: {{
          states('binary_sensor.aqara_raamsensor_4') }}  - Achterdeur: {{ states('binary_sensor.aqara_raamsensor_5')
          }}  - Voordeur: {{ states('binary_sensor.aqara_raamsensor_6') }}  - Raam
          Badkamer: {{ states('binary_sensor.ewelink_ds01_01_opening') }}\nAFSTANDEN
          & CONTEXT: - Afstand Bert: {{ states('sensor.home_bert_afstand') }} km -
          Afstand Caroline: {{ states('sensor.home_caroline_afstand') }} km - Bezoekers-modus:
          {{ states('binary_sensor.bezoek') }} \nWEERGEGEVENS:  - Huidig weerbeeld:
          {{ states('sensor.pirate_weather_hourly') }}  - Verwachting komend uur:
          {{ state_attr('sensor.pirate_weather_hourly', 'forecast')[1].condition |
          default('Onbekend') }}  - Temperatuur komend uur: {{ state_attr('sensor.pirate_weather_hourly',
          'forecast')[1].temperature | default('Onbekend') }}°C  - Kans op neerslag
          komend uur: {{ state_attr('sensor.pirate_weather_hourly', 'forecast')[1].precipitation_probability
          | default('0') }}%\n{{ regels() }}\n"
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "\U0001F697 Tot snel! - Status Check"
        melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}\n{#
          Dynamische lokale fallback die de juiste persoon aanspreekt #} {% set open_items
          = [] %} {% if is_state('binary_sensor.aqara_raamsensor_1', 'on') %}{% set
          open_items = open_items + ['Schuifraam keuken'] %}{% endif %} {% if is_state('binary_sensor.aqara_raamsensor_2',
          'on') %}{% set open_items = open_items + ['Raam Trix'] %}{% endif %} {%
          if is_state('binary_sensor.aqara_raamsensor_3', 'on') %}{% set open_items
          = open_items + ['Raam Elmo'] %}{% endif %} {% if is_state('binary_sensor.aqara_raamsensor_4',
          'on') %}{% set open_items = open_items + ['Raam Zolder'] %}{% endif %} {%
          if is_state('binary_sensor.aqara_raamsensor_5', 'on') %}{% set open_items
          = open_items + ['Achterdeur'] %}{% endif %} {% if is_state('binary_sensor.aqara_raamsensor_6',
          'on') %}{% set open_items = open_items + ['Voordeur'] %}{% endif %} {% if
          is_state('binary_sensor.ewelink_ds01_01_opening', 'on') %}{% set open_items
          = open_items + ['Raam Badkamer'] %}{% endif %}\n{% if open_items | length
          > 0 %}\n  {% set fallback = '⚠️ [Lokaal] ' ~ vertrekkende_persoon ~ ', je
          bent als laatste weg! Let op, dit staat nog open: ' ~ open_items | join(',
          ') ~ '.' %}\n{% else %}\n  {% set fallback = '⚠️ [Lokaal] Goede reis ' ~
          vertrekkende_persoon ~ '! Alles is netjes afgesloten.' %}\n{% endif %}\n{{
          render_melding(ai_antwoord, fallback) }}\n"
        prioriteit: "{% if trigger.id == 'bert_vertrekt' %}\n  Bert Kritiek\n{% else
          %}\n  Caroline Kritiek\n{% endif %}\n"
        melding_tag: vertrek-woning-check
        melding_group: huis
    continue_on_error: true
  mode: queued
  max: 5
  max_exceeded: silent
- id: climate_solar_preheat_bedrooms_v2
  alias: 'HVAC: Zonne-energie: Airco''s Centraal AAN'
  description: Stuurt de airco's van de zolder en de kinderkamers (Elmo en Trix) individueel
    aan bij zonne-overschot zodra de Zendure batterij vol is, op basis van hun eigen
    kamertemperatuur en ingestelde doeltemperatuur.
  triggers:
  - trigger: time_pattern
    minutes: /15
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: sensor.woning_hvac_modus
      state: Verwarmen
    - condition: state
      entity_id: sensor.woning_hvac_modus
      state: Koelen
  - condition: numeric_state
    entity_id: sensor.solarflow_2400_ac_electric_level
    above: 95
  - condition: numeric_state
    entity_id: sensor.solaredge_current_power
    above: 1300
  - condition: numeric_state
    entity_id: sensor.elektriciteit_meter_p1_vermogen
    below: -1000
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.woning_status
      state: Slapen
    alias: Check Woning Status
  - condition: template
    value_template: "{% set modus = states('sensor.woning_hvac_modus') %}\n{# Check
      Slaapkamer Zolder #} {% set zolder_set = state_attr('climate.airco_slaapkamer',
      'temperature') | float(0) %} {% set zolder_nodig = is_state('binary_sensor.aqara_raamsensor_4',
      'off') and \n                      ((modus == 'Verwarmen' and zolder_set !=
      21) or \n                       (modus == 'Koelen' and zolder_set != 18)) %}\n\n{#
      Check Elmo #} {% set elmo_set = state_attr('climate.airco_elmo', 'temperature')
      | float(0) %} {% set elmo_nodig = is_state('binary_sensor.aqara_raamsensor_3',
      'off') and is_state('schedule.slapen_elmo', 'off') and \n                    ((modus
      == 'Verwarmen' and elmo_set != 21) or \n                     (modus == 'Koelen'
      and elmo_set != 18)) %}\n\n{# Check Trix #} {% set trix_set = state_attr('climate.airco_trix',
      'temperature') | float(0) %} {% set trix_nodig = is_state('binary_sensor.aqara_raamsensor_2',
      'off') and is_state('schedule.slapen_trix', 'off') and \n                    ((modus
      == 'Verwarmen' and trix_set != 21) or \n                     (modus == 'Koelen'
      and trix_set != 18)) %}\n\n{# Laat de automatisering alleen door als minstens
      één kamer de juiste setpoint nog NIET heeft #} {{ zolder_nodig or elmo_nodig
      or trix_nodig }}"
  actions:
  - if:
    - condition: state
      entity_id: binary_sensor.aqara_raamsensor_4
      state: 'off'
    - condition: template
      value_template: '{% set modus = states(''sensor.woning_hvac_modus'') %} {% set
        zolder_set = state_attr(''climate.airco_slaapkamer'', ''temperature'') | float(0)
        %} {{ (modus == ''Verwarmen'' and zolder_set != 21) or (modus == ''Koelen''
        and zolder_set != 18) }}'
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.airco_slaapkamer
      data:
        hvac_mode: '{{ ''heat'' if is_state(''sensor.woning_hvac_modus'', ''Verwarmen'')
          else ''cool'' }}'
    - action: climate.set_temperature
      target:
        entity_id: climate.airco_slaapkamer
      data:
        temperature: '{{ 21 if is_state(''sensor.woning_hvac_modus'', ''Verwarmen'')
          else ''18'' }}'
    - variables:
        zolder_gestart: true
  - if:
    - condition: state
      entity_id: binary_sensor.aqara_raamsensor_3
      state: 'off'
    - condition: state
      entity_id: schedule.slapen_elmo
      state: 'off'
    - condition: template
      value_template: '{% set modus = states(''sensor.woning_hvac_modus'') %} {% set
        elmo_set = state_attr(''climate.airco_elmo'', ''temperature'') | float(0)
        %} {{ (modus == ''Verwarmen'' and elmo_set != 21) or (modus == ''Koelen''
        and elmo_set != 18) }}'
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.airco_elmo
      data:
        hvac_mode: '{{ ''heat'' if is_state(''sensor.woning_hvac_modus'', ''Verwarmen'')
          else ''cool'' }}'
    - action: climate.set_temperature
      target:
        entity_id: climate.airco_elmo
      data:
        temperature: '{{ 21 if is_state(''sensor.woning_hvac_modus'', ''Verwarmen'')
          else ''18'' }}'
    - if:
      - condition: state
        entity_id: sensor.woning_hvac_modus
        state: Verwarmen
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.elmo
        data:
          hvac_mode: 'off'
    - variables:
        elmo_gestart: true
  - if:
    - condition: state
      entity_id: binary_sensor.aqara_raamsensor_2
      state: 'off'
    - condition: state
      entity_id: schedule.slapen_trix
      state: 'off'
    - condition: template
      value_template: '{% set modus = states(''sensor.woning_hvac_modus'') %} {% set
        trix_set = state_attr(''climate.airco_trix'', ''temperature'') | float(0)
        %} {{ (modus == ''Verwarmen'' and trix_set != 21) or (modus == ''Koelen''
        and trix_set != 18) }}'
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.airco_trix
      data:
        hvac_mode: '{{ ''heat'' if is_state(''sensor.woning_hvac_modus'', ''Verwarmen'')
          else ''cool'' }}'
    - action: climate.set_temperature
      target:
        entity_id: climate.airco_trix
      data:
        temperature: '{{ 21 if is_state(''sensor.woning_hvac_modus'', ''Verwarmen'')
          else ''18'' }}'
    - if:
      - condition: state
        entity_id: sensor.woning_hvac_modus
        state: Verwarmen
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.trix
        data:
          hvac_mode: 'off'
    - variables:
        trix_gestart: true
  - if:
    - condition: template
      value_template: '{{ zolder_gestart is defined or elmo_gestart is defined or
        trix_gestart is defined }}'
    then:
    - if:
      - condition: state
        entity_id: input_boolean.lokale_notificaties
        state: 'off'
      then:
      - action: ai_task.generate_data
        continue_on_error: true
        data:
          task_name: Universele Notificatie Klimaat Alle Kamers
          entity_id: ai_task.google_ai_task
          instructions: '{% from ''ai_formatting.jinja'' import persona, regels %}
            {{ persona() }} Meld dat we wegens zonne-overschot (opbrengst: {{ states(''sensor.solaredge_current_power'')
            }}W) en een volle thuisbatterij, de volgende kamers GRATIS aan het {{
            ''voorverwarmen'' if is_state(''sensor.woning_hvac_modus'', ''Verwarmen'')
            else ''voorkoelen'' }} zijn met de airco: {% if zolder_gestart is defined
            %}- De Slaapkamer op Zolder{% endif %} {% if elmo_gestart is defined %}-
            De kamer van Elmo{% endif %} {% if trix_gestart is defined %}- De kamer
            van Trix{% endif %}

            Houd het bericht kort, vlot en compact (maximaal 2 zinnen, perfect voor
            iPhone en HomePod).

            {{ regels() }}

            '
        response_variable: ai_antwoord
      else:
      - variables:
          ai_antwoord:
            response: ''
    - action: script.turn_on
      target:
        entity_id: script.centraal_universele_notificatie_spraak
      data:
        variables:
          melding_titel: ☀️ Zonne-klimaat Update
          melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}\n{#
            Dynamische lokale fallback op basis van de actieve kamers #} {% set actie
            = 'voorverwarmen' if is_state('sensor.woning_hvac_modus', 'Verwarmen')
            else 'voorkoelen' %} {% set kamers = [] %} {% if zolder_gestart is defined
            %}{% set kamers = kamers + ['de zolder'] %}{% endif %} {% if elmo_gestart
            is defined %}{% set kamers = kamers + ['Elmo'] %}{% endif %} {% if trix_gestart
            is defined %}{% set kamers = kamers + ['Trix'] %}{% endif %}\n{% if kamers
            | length > 0 %}\n  {% set fallback = '⚠️ [Lokaal] Zonne-overschot ontdekt!
            We zijn gratis aan het ' ~ actie ~ ' in: ' ~ kamers | join(', ') ~ '.'
            %}\n{% else %}\n  {% set fallback = '⚠️ [Lokaal] Airco’s boven worden
            slim aangestuurd op basis van gratis zonne-energie.' %}\n{% endif %}\n{{
            render_melding(ai_antwoord, fallback) }}\n"
          prioriteit: Geen
          melding_tag: solar-heating-status
      continue_on_error: true
  mode: single
- id: '1777019809055'
  alias: 'HVAC: Zonne-energie: Airco''s Centraal UIT'
  description: Schakelt de zonne-sturing van ALLE airco's (Elmo, Trix en Slaapkamer
    Zolder) uit  zodra de omstandigheden wijzigen of er stroomtekort is, en herstelt
    de Evohome voor de kinderen indien nodig.
  triggers:
  - trigger: state
    entity_id: input_select.woning_status
    to: Slapen
  - trigger: state
    entity_id: input_select.woning_status
    to: Op Vakantie
  - trigger: state
    entity_id: sensor.woning_hvac_modus
    to: Verluchten
  - trigger: numeric_state
    entity_id:
    - sensor.elektriciteit_meter_p1_vermogen
    for:
      minutes: 10
    above: 2000
  conditions:
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_elmo
        state: 'off'
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_trix
        state: 'off'
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_slaapkamer
        state: 'off'
  actions:
  - action: climate.set_hvac_mode
    target:
      entity_id:
      - climate.airco_trix
      - climate.airco_elmo
      - climate.airco_slaapkamer
    data:
      hvac_mode: 'off'
  - if:
    - condition: state
      entity_id: sensor.woning_hvac_modus
      state: Verwarmen
    then:
    - if:
      - condition: template
        value_template: '{{ states(''binary_sensor.aqara_raamsensor_3'') in [''off'',
          ''unavailable''] }}'
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.elmo
        data:
          hvac_mode: heat
    - if:
      - condition: template
        value_template: '{{ states(''binary_sensor.aqara_raamsensor_2'') in [''off'',
          ''unavailable''] }}'
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.trix
        data:
          hvac_mode: heat
  mode: single
- id: energy_high_baseload_warning
  alias: 'Energie: Hoog Sluimerverbruik Melding'
  description: Waarschuwt als het verbruik tijdens het slapen te hoog blijft.
  triggers:
  - entity_id:
    - sensor.huis_verbruik_actueel
    above: 500
    for:
      minutes: 30
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: input_select.woning_status
    state: Slapen
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Universele Notificatie
        entity_id: ai_task.google_ai_task
        instructions: '{% from ''ai_formatting.jinja'' import persona, regels %} {{
          persona() }}

          De woning staat op ''Slapen'', maar het stroomverbruik is al 30 minuten
          boven de 500 Watt (huidig verbruik: {{ states(''sensor.huis_verbruik_actueel'')
          }}W).  Vraag Bert of Caroline subtiel of ze vergeten zijn iets uit te zetten,
          zoals de oven, een tv of een zwaar apparaat. Houd het kort en alert.

          {{ regels() }}'
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: ⚠️ Hoog Sluimerverbruik
        melding_tekst: '{% from ''ai_formatting.jinja'' import render_melding %} {%
          set verbruik = states(''sensor.huis_verbruik_actueel'') %} {% set fallback
          = ''Het verbruik is al 30 minuten te hoog tijdens de nacht ('' ~ verbruik
          ~ ''W)! Kijk even of er nog een zwaar apparaat, de tv of de oven aanstaat.''
          %}

          {{ render_melding(ai_antwoord, fallback) }}'
        prioriteit: Push Alleen
        melding_tag: high-baseload-warning
        melding_group: energy
    continue_on_error: true
  mode: single
- id: alert_water_leakage_detected
  alias: 'Security: Waterlek Waarschuwing'
  description: Stuurt een melding als het waterverbruik 1 uur lang actief is. Voorkomt
    valse meldingen bij het vullen van een bad of douchen.
  triggers:
  - trigger: state
    entity_id: sensor.water_meter
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.water_meter'') | float(0) > 0 }}'
  - alias: Is er momenteel actief verbruik?
    condition: template
    value_template: "{% set log = states.sensor.water_meter %} {% if log is not none
      and log.last_changed is not none %}\n  {{ (as_timestamp(now()) - as_timestamp(log.last_changed))
      < 900 }}\n{% else %}\n  false\n{% endif %}\n"
  - alias: Is het langer dan 55 minuten geleden dat deze melding voor het laatst mocht
      lopen?
    condition: template
    value_template: "{% if this.attributes.last_triggered is not none %}\n  {{ (as_timestamp(now())
      - as_timestamp(this.attributes.last_triggered)) > 3300 }}\n{% else %}\n  true\n{%
      endif %}\n"
  actions:
  - variables:
      huidig_dagverbruik: '{{ states(''sensor.water_meter'') }}'
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Waterlek Alarmsignaal
        entity_id: ai_task.google_ai_task
        instructions: '{% from ''ai_formatting.jinja'' import persona, regels %} {{
          persona() }} Er is een mogelijk waterlek gedetecteerd! De watermeter registreert
          al een uur lang non-stop waterverbruik zonder rustmoment. Het totale verbruik
          voor vandaag staat inmiddels al op {{ huidig_dagverbruik }} kubieke meter.
          Waarschuw Bert en Caroline dringend dat er waarschijnlijk een lek is of
          een toilet blijft lopen. Maximaal 2 zinnen.

          {{ regels() }}

          '
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "\U0001F4A7 Mogelijk waterlek gedetecteerd!"
        melding_tekst: '{% from ''ai_formatting.jinja'' import render_melding %}

          {# Lokale fallback string voor directe notificatie zonder cloud #} {% set
          fallback = ''⚠️ [Lokaal Dringend] Het waterverbruik is al een uur lang onafgebroken
          actief (Dagstand: '' ~ huidig_dagverbruik ~ '' m³). Controleer direct op
          lekken of openstaande kranen!'' %}

          {{ render_melding(ai_antwoord, fallback) }}

          '
        prioriteit: Kritiek
        melding_tag: water-leak-alarm
        melding_group: beveiliging
    continue_on_error: true
  mode: single
  max_exceeded: silent
- id: alert_gas_leak_smart_check
  alias: 'Security: Gas Alarm (Check via Stilstand)'
  description: Kritiek alarm als de gasmeter oploopt terwijl de verwarmingzones en
    de watermeter (warm water) stilstaan. Loopt via het centrale script.
  triggers:
  - trigger: state
    entity_id: sensor.gas_meter
  conditions:
  - alias: Gasmeter is onlangs nog gewijzigd
    condition: template
    value_template: '{{ (as_timestamp(now()) - as_timestamp(trigger.entity_id.last_updated
      | default(now()))) < 900 }}

      '
  - alias: Alle Evohome zones staan uit en zijn online
    condition: template
    value_template: "{% set zones = [\n  states.climate.keuken, states.climate.woonkamer,
      states.climate.badkamer,\n  states.climate.dressing, states.climate.elmo, states.climate.trix,
      states.climate.slaapkamer\n] %} {% set aan_het_verwarmen = zones | selectattr('state',
      'eq', 'heat') | list | count %} {% set onbereikbaar = zones | selectattr('state',
      'eq', 'unavailable') | list | count %} {{ aan_het_verwarmen == 0 and onbereikbaar
      == 0 }}\n"
  - alias: Watermeter staat stil (geen warm water vraag)
    condition: template
    value_template: '{{ (as_timestamp(now()) - as_timestamp(states.sensor.water_meter.last_changed
      | default(0))) > 600 }}

      '
  actions:
  - variables:
      actuele_gasstand: '{{ states(''sensor.gas_meter'') }}'
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Gaslek Alarmsignaal
        entity_id: ai_task.google_ai_task
        instructions: '{% from ''ai_formatting.jinja'' import persona, regels %} {{
          persona() }} Er is een ONVERWACHT en potentieel gevaarlijk gasverbruik gedetecteerd!
          De centrale verwarming en het warme water staan volledig uit, maar de gasmeter
          loopt toch op. Actuele stand: {{ actuele_gasstand }}. Waarschuw Bert en
          Caroline onmiddellijk om te controleren op een gaslucht of een gasfornuis
          dat per ongeluk open is blijven staan.

          Richtlijn: Houd de boodschap kort, uiterst urgent, serieus en dwingend.
          Maximaal 2 zinnen.

          {{ regels() }}

          '
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "\U0001F6A8 GAS ALARM: ONVERWACHT VERBRUIK"
        melding_tekst: '{% from ''ai_formatting.jinja'' import render_melding %}

          {# Lokale fallback string voor directe notificatie zonder cloud #} {% set
          fallback = ''⚠️ [Lokaal Dringend] Gevaar! Onverwacht gasverbruik gedetecteerd
          (Meterstand: '' ~ actuele_gasstand ~ ''). De verwarming en het warme water
          staan uit. Controleer direct op gaslucht of het fornuis!'' %}

          {{ render_melding(ai_antwoord, fallback) }}

          '
        prioriteit: Kritiek
        melding_tag: gas-leak-urgent
        melding_group: beveiliging
    continue_on_error: true
  mode: single
  max_exceeded: silent
- id: '1777657887100'
  alias: 'HVAC: Verwarming - Bepaal Zon-blokkade (Pirate Weather + Solar)'
  description: Zet de zon-blokkade aan op basis van middagtemperatuur en zonne-opbrengst
    en stuurt direct de verwarming aan.
  triggers:
  - trigger: time
    at: 03:00:00
  - trigger: time
    at: 07:00:00
  - trigger: time
    at: '10:00:00'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{% set zon = states('sensor.energy_production_today') | float(0)
          %}\n{# 1. Max temperatuur van vandaag ophalen uit de DAILY sensor #} {%
          set temp_max = state_attr('sensor.pirate_weather_daily', 'forecast')[0].temperature
          | float(0) if state_attr('sensor.pirate_weather_daily', 'forecast') else
          0 %}\n{# 2. De temperatuur van exact 11:00 uur zoeken in de HOURLY sensor
          #} {% set ns = namespace(temp_11u=0) %} {% if state_attr('sensor.pirate_weather_hourly',
          'forecast') is not none %}\n  {% for uur in state_attr('sensor.pirate_weather_hourly',
          'forecast') %}\n    {% if uur.datetime.startswith(now().strftime('%Y-%m-%d')
          ~ 'T11:') %}\n      {% set ns.temp_11u = uur.temperature | float(0) %}\n
          \   {% endif %}\n  {% endfor %}\n{% endif %}\n{# Check of aan de voorwaarden
          wordt voldaan #} {{ zon > 15 and temp_max >= 20 and ns.temp_11u >= 15 }}"
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.zon_verwarming_blokkade
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heating
    default:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.zon_verwarming_blokkade
  mode: single
- id: '1778955303858'
  alias: 'Zendure: Capaciteitstarief - Activeer Piek Shaving'
  description: Verlaag de batterijreserve naar 5% bij een hoge piek om het net te
    ontlasten.
  triggers:
  - entity_id: sensor.elektriciteit_meter_p1_vermogen
    above: 2400
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: input_boolean.piek_verbruik_alert
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.piek_verbruik_alert
  - action: number.set_value
    target:
      entity_id: number.solarflow_2400_ac_min_soc
    data:
      value: 5
  mode: single
- id: '1778955417727'
  alias: 'Zendure: Capaciteitstarief - Herstel Reserve'
  description: Zet de batterijreserve terug naar 15% als de piek stabiel voorbij is.
  triggers:
  - entity_id: sensor.elektriciteit_meter_p1_vermogen
    below: 1500
    for:
      minutes: 3
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: input_boolean.piek_verbruik_alert
    state: 'on'
  actions:
  - action: number.set_value
    target:
      entity_id: number.solarflow_2400_ac_min_soc
    data:
      value: 15
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.piek_verbruik_alert
  mode: single
- id: '1779259588768'
  alias: 'Herinneringen: Vuilbakken - Centraal Afvalritueel'
  description: Combineert ochtendcheck (ontwaken), avondritueel en de thuiskomst van
    Bert in één slimme automatisering.
  triggers:
  - trigger: state
    entity_id: input_select.woning_status
    from: Juist Wakker
    id: ochtend
  - trigger: time
    at: '20:30:00'
    id: avond_of_thuiskomst
  - trigger: state
    entity_id: input_select.woning_status
    from: Juist Thuis
    to:
    - Thuis
    - Thuis Werk
    - Thuis Verlof
    id: avond_of_thuiskomst
  - trigger: state
    entity_id: person.bert
    to: home
    id: bert_thuis
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id: ochtend
    - condition: trigger
      id: bert_thuis
    - condition: state
      entity_id: input_select.woning_status
      state:
      - Juist Thuis
      - Thuis
      - Thuis Werk
      - Thuis Verlof
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: ochtend
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.recycleapp_glas
          attribute: Days_until
          below: 1
        - condition: numeric_state
          entity_id: sensor.recycleapp_papier
          attribute: Days_until
          below: 1
        - condition: numeric_state
          entity_id: sensor.recycleapp_pmd
          attribute: Days_until
          below: 1
        - condition: numeric_state
          entity_id: sensor.recycleapp_restafval
          attribute: Days_until
          below: 1
    - condition: and
      conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: avond_of_thuiskomst
        - condition: trigger
          id: bert_thuis
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.recycleapp_glas
          attribute: Days_until
          above: 0
          below: 2
        - condition: numeric_state
          entity_id: sensor.recycleapp_papier
          attribute: Days_until
          above: 0
          below: 2
        - condition: numeric_state
          entity_id: sensor.recycleapp_pmd
          attribute: Days_until
          above: 0
          below: 2
        - condition: numeric_state
          entity_id: sensor.recycleapp_restafval
          attribute: Days_until
          above: 0
          below: 2
  actions:
  - if:
    - condition: trigger
      id: bert_thuis
    then:
    - wait_for_trigger:
      - trigger: state
        entity_id: device_tracker.router_iphone_bert
        to: home
      continue_on_timeout: false
      timeout: 00:05:00
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Afval Status Master
        entity_id: ai_task.google_ai_task
        instructions: '{% from ''ai_formatting.jinja'' import persona, regels %} {{
          persona() }}

          Vertel de bewoners of het bezoek welk afval vandaag of morgen buiten moet.

          MOMENT VAN DE MELDING:  De automatisering is getriggerd in de context van:
          "{{ trigger.id }}".  - Als de context "ochtend" is: wens Bert een goedemorgen
          en herinner hem er specifiek aan dat de vuilbak VANDAAG nog buiten moet.  -
          Als de context "bert_thuis" is: heet Bert specifiek welkom thuis en herinner
          hem er direct aan dat hij (vóór hij in de zetel ploft) nog afval moet buitenzetten.  -
          Als de context "avond_of_thuiskomst" is: breng hen (Bert, Caroline en eventueel
          bezoek) gezellig op de hoogte voor vanavond/morgen.

          DATA RECYCLEAPP (Aantal dagen tot ophaling):  - Papier: {{ state_attr(''sensor.recycleapp_papier'',
          ''Days_until'') }} dagen  - Glas: {{ state_attr(''sensor.recycleapp_glas'',
          ''Days_until'') }} dagen  - PMD: {{ state_attr(''sensor.recycleapp_pmd'',
          ''Days_until'') }} dagen  - Restafval: {{ state_attr(''sensor.recycleapp_restafval'',
          ''Days_until'') }} dagen

          REGELS:  - Een afvalsoort moet pas buiten als het "0 dagen" (vandaag) of
          "1 dag" (morgen) is.  - Noem alleen het afval dat effectief vandaag of morgen
          wordt opgehaald.  - Maak het grappig (bijvoorbeeld over stinkende zakken
          of dat Bert moet sjouwen).  - Houd het kort voor een iOS notificatie.

          CONTEXT:  - Status thuis: Bert ({{ states(''person.bert'') }}), Caroline
          ({{ states(''person.caroline'') }}), Bezoek actief: {{ states(''binary_sensor.bezoek'')
          }}.  - Het is nu {{ now().strftime(''%A %d %B %H:%M'') }}.

          {{ regels() }}'
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Afvalkalender \U0001F5D1️"
        melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}\n{%
          set p = state_attr('sensor.recycleapp_papier', 'Days_until') | int(99) %}
          {% set g = state_attr('sensor.recycleapp_glas', 'Days_until') | int(99)
          %} {% set pmd = state_attr('sensor.recycleapp_pmd', 'Days_until') | int(99)
          %} {% set r = state_attr('sensor.recycleapp_restafval', 'Days_until') |
          int(99) %}\n{% set ns = namespace(intro='', lijst='') %}\n{% if trigger.id
          == 'ochtend' %}\n  {% set ns.intro = 'Goedemorgen Bert! ' %}\n{% elif trigger.id
          == 'bert_thuis' %}\n  {% set ns.intro = 'Welkom thuis Bert! ' %}\n{% else
          %}\n  {% set ns.intro = 'Afvalstatus voor vanavond/morgen: ' %}\n{% endif
          %}\n{% if p in [0, 1] or g in [0, 1] or pmd in [0, 1] or r in [0, 1] %}\n
          \ {% set ns.lijst = 'Buiten zetten: ' %}\n  {% if p == 0 %}{% set ns.lijst
          = ns.lijst ~ 'Papier (vandaag). ' %}{% elif p == 1 %}{% set ns.lijst = ns.lijst
          ~ 'Papier (morgen). ' %}{% endif %}\n  {% if g == 0 %}{% set ns.lijst =
          ns.lijst ~ 'Glas (vandaag). ' %}{% elif g == 1 %}{% set ns.lijst = ns.lijst
          ~ 'Glas (morgen). ' %}{% endif %}\n  {% if pmd == 0 %}{% set ns.lijst =
          ns.lijst ~ 'PMD (vandaag). ' %}{% elif pmd == 1 %}{% set ns.lijst = ns.lijst
          ~ 'PMD (morgen). ' %}{% endif %}\n  {% if r == 0 %}{% set ns.lijst = ns.lijst
          ~ 'Restafval (vandaag). ' %}{% elif r == 1 %}{% set ns.lijst = ns.lijst
          ~ 'Restafval (morgen). ' %}{% endif %}\n{% else %}\n  {% set ns.lijst =
          'Geen afval vandaag of morgen. Lekker relaxen!' %}\n{% endif %}\n{% set
          fallback = ns.intro ~ ns.lijst %}\n{{ render_melding(ai_antwoord, fallback)
          }}"
        prioriteit: '{{ ''Bert'' if trigger.id in [''ochtend'', ''bert_thuis''] else
          ''Geen'' }}'
        melding_tag: afval-status
        melding_group: huis
    continue_on_error: true
  mode: single
- id: '1779260538569'
  alias: 'HVAC: Centraal - Airco''s Beschikbaarheid Check'
  description: Samenvoeging van alle airco-foutmeldingen naar Bert via het centraal
    notificatiescript.
  triggers:
  - trigger: state
    entity_id:
    - climate.airco_elmo
    - climate.airco_trix
    - climate.airco_slaapkamer
    to: unavailable
    id: airco_uitval
  - trigger: state
    entity_id: input_select.woning_status
    to: Juist Thuis
    id: thuiskomst
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: trigger
            id: airco_uitval
          - condition: template
            value_template: '{{ trigger.entity_id == ''climate.airco_elmo'' }}'
        - condition: and
          conditions:
          - condition: trigger
            id: thuiskomst
          - condition: state
            entity_id: climate.airco_elmo
            state: unavailable
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: ⚠️ Airco Status
            melding_tekst: Airco bij Elmo is momenteel niet beschikbaar!
            prioriteit: Bert
            melding_tag: airco-elmo-status
            melding_group: huis
        continue_on_error: true
    - conditions:
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: trigger
            id: airco_uitval
          - condition: template
            value_template: '{{ trigger.entity_id == ''climate.airco_trix'' }}'
        - condition: and
          conditions:
          - condition: trigger
            id: thuiskomst
          - condition: state
            entity_id: climate.airco_trix
            state: unavailable
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: ⚠️ Airco Status
            melding_tekst: Airco 'Trix' is momenteel niet beschikbaar!
            prioriteit: Bert
            melding_tag: airco-trix-status
            melding_group: huis
        continue_on_error: true
    - conditions:
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: trigger
            id: airco_uitval
          - condition: template
            value_template: '{{ trigger.entity_id == ''climate.airco_slaapkamer''
              }}'
        - condition: and
          conditions:
          - condition: trigger
            id: thuiskomst
          - condition: state
            entity_id: climate.airco_slaapkamer
            state: unavailable
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: ⚠️ Airco Status
            melding_tekst: Airco 'Slaapkamer' is momenteel niet beschikbaar!
            prioriteit: Bert
            melding_tag: airco-slaapkamer-status
            melding_group: huis
        continue_on_error: true
  mode: parallel
  max: 10
- id: '1779262620652'
  alias: 'HVAC: Centraal - Noodrem bij Stroompiek'
  description: Zet ALLE airco's direct uit bij een stroompiek boven de 2500W op de
    P1-meter, ongeacht of ze aan het koelen of verwarmen zijn.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.elektriciteit_meter_p1_vermogen
    for:
      minutes: 2
    above: 2500
  conditions:
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_elmo
        state: 'off'
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_trix
        state: 'off'
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_slaapkamer
        state: 'off'
  actions:
  - delay: 00:00:20
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_elmo
        state: 'off'
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.airco_elmo
      data:
        hvac_mode: 'off'
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_trix
        state: 'off'
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.airco_trix
      data:
        hvac_mode: 'off'
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_slaapkamer
        state: 'off'
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.airco_slaapkamer
      data:
        hvac_mode: 'off'
  mode: single
  max_exceeded: silent
- id: '1779263425630'
  alias: 'HVAC: Airco Slaapkamer - Uit'
  description: Schakelt de airco uit bij geopende ramen, statuswijzigingen of bereikte
    temperaturen. Blijft aan tijdens zonne-overschot.
  triggers:
  - trigger: state
    entity_id: binary_sensor.aqara_raamsensor_4
    to: 'on'
    id: raam_open
  - trigger: state
    entity_id: schedule.heating_attic
    to: 'off'
    id: schema_uit
  - trigger: numeric_state
    entity_id: climate.slaapkamer
    attribute: current_temperature
    above: 21.5
    for: 00:02:00
    id: warm_genoeg
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.airco_slaapkamer
      state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: raam_open
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.airco_slaapkamer
        data:
          hvac_mode: 'off'
      - if:
        - condition: state
          entity_id: input_boolean.lokale_notificaties
          state: 'off'
        - condition: numeric_state
          entity_id: sensor.solarflow_2400_ac_electric_level
          above: 80
        then:
        - action: ai_task.generate_data
          continue_on_error: true
          data:
            task_name: Airco Raam Open Slaapkamer
            entity_id: ai_task.google_ai_task
            instructions: '{% from ''ai_formatting.jinja'' import persona, regels
              %} {{ persona() }} Je bent Homey. Er was gratis zonne-energie beschikbaar,
              maar iemand heeft het raam van de slaapkamer opengezet. Meld op een
              plagende manier dat de airco is uitgezet omdat we de buitenlucht niet
              gaan koelen of verwarmen. {{ regels() }}

              '
          response_variable: ai_antwoord
        else:
        - variables:
            ai_antwoord:
              response: ''
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: "\U0001F32C️ Slaapkamer raam geopend"
            melding_tekst: '{% from ''ai_formatting.jinja'' import render_melding
              %} {% set fallback = ''Het raam in de slaapkamer staat open, dus ik
              heb de airco voor je uitgezet.'' %} {{ render_melding(ai_antwoord, fallback)
              }}

              '
            melding_tag: hvac-status-slaapkamer
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Juist Weg
      - condition: numeric_state
        entity_id: climate.slaapkamer
        attribute: current_temperature
        below: 16
      sequence:
      - stop: Airco blijft aan als vorstbeveiliging.
    - conditions:
      - condition: trigger
        id: warm_genoeg
      - condition: state
        entity_id: schedule.heating_attic
        state: 'on'
      sequence:
      - stop: Schema is nog actief, dus niet uitschakelen op temperatuur.
    - conditions:
      - condition: numeric_state
        entity_id: sensor.solarflow_2400_ac_electric_level
        above: 95
      - condition: numeric_state
        entity_id: sensor.solaredge_current_power
        above: 1300
      - condition: numeric_state
        entity_id: sensor.elektriciteit_meter_p1_vermogen
        below: -500
      - condition: or
        conditions:
        - condition: state
          entity_id: sensor.woning_hvac_modus
          state: Koelen
        - condition: state
          entity_id: sensor.woning_hvac_modus
          state: Verwarmen
      sequence:
      - stop: Airco niet uitzetten, we gebruiken gratis zonne-energie!
    default:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.airco_slaapkamer
      data:
        hvac_mode: 'off'
  mode: queued
  max: 5
- id: '1779286173845'
  alias: 'Notificatie: Regenverwachting (Slim)'
  description: Waarschuwt 1x per regenbui als er regen wordt verwacht.
  triggers:
  - trigger: time_pattern
    minutes: /15
  actions:
  - variables:
      forecast: '{{ state_attr(''sensor.pirate_weather_hourly'', ''forecast'') }}'
      f: '{{ forecast[0] if forecast is defined and forecast else {} }}'
      kans: '{{ f.precipitation_probability | int(0) }}'
      hoeveelheid: '{{ f.precipitation | float(0) }}'
      is_regen: '{{ kans > 60 and hoeveelheid >= 0.4 }}'
      slotje: '{{ is_state(''input_boolean.reeds_gewaarschuwd_voor_regen'', ''on'')
        }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_regen and not slotje }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.reeds_gewaarschuwd_voor_regen
      - action: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: "\U0001F327️ Regen op komst"
            melding_tekst: Er wordt voor het komende uur {{ kans }}% kans op regen
              verwacht ({{ hoeveelheid }}mm).
            prioriteit: Push
            melding_tag: weer-waarschuwing
    - conditions:
      - condition: template
        value_template: '{{ not is_regen and slotje }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.reeds_gewaarschuwd_voor_regen
  mode: single
- id: '1779709809010'
  alias: 'HVAC: Centraal - Modus Manager'
  description: Bepaalt ALTIJD de hoofdmodus van de woning (Koelen, Verwarmen of Verluchten)
    op basis van temperatuurverschillen. Schakelt de booleans om; de template-sensor  volgt
    automatisch.
  triggers:
  - trigger: time
    at: 06:00:00
  - trigger: time
    at: '10:00:00'
  - trigger: time
    at: '16:00:00'
  - trigger: state
    entity_id: sensor.hue_sensor_buiten_temperature
  - trigger: state
    entity_id: input_boolean.zon_verwarming_blokkade
  conditions: []
  actions:
  - variables:
      t_buiten: '{{ states(''sensor.hue_sensor_buiten_temperature'') | float(20) }}'
      t_binnen: '{{ state_attr(''climate.ons_huisje'', ''current_temperature'') |
        float(21) }}'
      huidige_modus: '{{ states(''sensor.woning_hvac_modus'') }}'
      berekende_modus: "{% if t_binnen > 20.0 and (t_buiten >= t_binnen or (t_binnen
        - t_buiten) < 3.0) %}\n  Koelen\n{% elif is_state('input_boolean.zon_verwarming_blokkade',
        'off') and not is_state('sensor.season', 'summer') and t_buiten < (t_binnen
        - 1.0) and t_binnen < 21.5 %}\n  Verwarmen\n{% else %}\n  Verluchten\n{% endif
        %}"
  - condition: template
    value_template: '{{ berekende_modus != huidige_modus }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ berekende_modus == ''Koelen'' }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heating
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hvac_koeling_aan_uit
    - conditions:
      - condition: template
        value_template: '{{ berekende_modus == ''Verwarmen'' }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_koeling_aan_uit
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.heating
    default:
    - action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.hvac_koeling_aan_uit
        - input_boolean.heating
- id: '1779712395054'
  alias: 'HVAC: Centraal - Pre-Condition Systeem Manager'
  description: Regelt het klimaat (Evohome bij verwarmen, Airco's bij koelen) wanneer
    het huis wordt voorbereid op de aankomst van de bewoners.
  triggers:
  - trigger: state
    entity_id: input_boolean.pre_heat
    from: 'off'
    to: 'on'
    id: pre_condition_start
  - trigger: state
    entity_id: input_boolean.pre_heat
    from: 'on'
    to: 'off'
    id: pre_condition_stop
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: pre_condition_start
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: sensor.woning_hvac_modus
            state: Verwarmen
          - condition: or
            conditions:
            - condition: state
              entity_id: climate.ons_huisje
              attribute: preset_mode
              state: eco
            - condition: state
              entity_id: climate.ons_huisje
              attribute: preset_mode
              state: away
          sequence:
          - action: evohome.set_system_mode
            data:
              mode: Auto
    - conditions:
      - condition: trigger
        id: pre_condition_stop
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: sensor.woning_hvac_modus
            state: Verwarmen
          - condition: state
            entity_id: input_select.woning_status
            state: Weg
          sequence:
          - action: evohome.set_system_mode
            data:
              mode: AutoWithEco
  mode: single
  max_exceeded: silent
- id: '1779712652338'
  alias: 'HVAC: Centraal - Pre-Condition Trigger Manager'
  description: Activeert de pre-conditioning (verwarmen of koelen) op basis van de
    locatie van Bert en Caroline, en past de notificaties dynamisch aan op het seizoen.
  triggers:
  - trigger: state
    entity_id: person.bert
    to: Mechelen Station
    id: onderweg_normaal
  - trigger: state
    entity_id: person.bert
    to: Willebroek Station
    id: onderweg_normaal
  - trigger: state
    entity_id: person.caroline
    to: Checkpoint 2
    id: onderweg_normaal
  - trigger: state
    entity_id: person.caroline
    to: Checkpoint 4
    id: onderweg_normaal
  - trigger: numeric_state
    entity_id: sensor.home_nearest_distance
    below: 80
    id: onderweg_normaal
  - trigger: numeric_state
    entity_id: sensor.home_nearest_distance
    below: 100
    for: 00:01:00
    id: terug_van_vakantie
  - trigger: state
    entity_id: input_select.woning_status
    to:
    - Thuis
    - Thuis Werk
    - Thuis Verlof
    - Juist Thuis
    - Juist Wakker
    for: 00:01:00
    id: thuis_opruimen
  conditions:
  - condition: state
    entity_id: input_select.woning_status
    state:
    - Op Vakantie
    - Weg
    - Op Vakantie (Bezoek)
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: onderweg_normaal
      - condition: state
        entity_id: input_boolean.pre_heat
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.pre_heat
      - if:
        - condition: state
          entity_id: input_boolean.lokale_notificaties
          state: 'off'
        then:
        - action: ai_task.generate_data
          continue_on_error: true
          data:
            task_name: Pre-Condition Geactiveerd
            entity_id: ai_task.google_ai_task
            instructions: '{% from ''ai_formatting.jinja'' import persona, regels
              %} {{ persona() }}

              De pre-conditioning is zojuist automatisch ingeschakeld omdat er iemand
              onderweg is naar huis.  HUIDIGE MODUS VAN HET HUIS: {{ states(''sensor.woning_hvac_modus'')
              }} (Verwarmen of Koelen).  Als de modus Verwarmen is, vertel ze gezellig
              dat het huis lekker warm zal zijn. Als de modus Koelen is, meld dan
              fris dat de airco''s het huis heerlijk koel maken tegen aankomst.

              {{ regels() }}'
          response_variable: ai_antwoord
        else:
        - variables:
            ai_antwoord:
              response: ''
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: "{{ '❄️ Pre-cooling Geactiveerd!' if is_state('sensor.woning_hvac_modus',
              'Koelen') else '\U0001F525 Pre-heat Geactiveerd!' }}"
            melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}
              {% set modus = states('sensor.woning_hvac_modus') | lower %} {% if 'koelen'
              in modus %}\n  {% set fallback = 'Pre-cooling is ingeschakeld! De airco’s
              zijn gestart om het huis heerlijk koel te maken voor jullie aankomst.'
              %}\n{% elif 'verwarmen' in modus %}\n  {% set fallback = 'Pre-heat is
              ingeschakeld! De verwarming is gestart om te zorgen voor een heerlijk
              warm nest bij aankomst.' %}\n{% else %}\n  {% set fallback = 'Pre-conditioning
              is ingeschakeld. Het huis wordt klaargemaakt voor jullie aankomst!'
              %}\n{% endif %}\n{{ render_melding(ai_antwoord, fallback) }}"
            prioriteit: Geen
            melding_tag: hvac-preheat-status
            melding_group: huis
        continue_on_error: true
    - conditions:
      - condition: trigger
        id: terug_van_vakantie
      - condition: state
        entity_id: input_select.woning_status
        state: Op Vakantie
      - condition: state
        entity_id: input_boolean.pre_heat
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.pre_heat
      - if:
        - condition: state
          entity_id: input_boolean.lokale_notificaties
          state: 'off'
        then:
        - action: ai_task.generate_data
          continue_on_error: true
          data:
            task_name: Pre-Condition Vakantie Geactiveerd
            entity_id: ai_task.google_ai_task
            instructions: '{% from ''ai_formatting.jinja'' import persona, regels
              %} {{ persona() }}

              Bert en Caroline komen terug van vakantie en zijn de 100km grens gepasseerd.  HUIDIGE
              MODUS VAN HET HUIS: {{ states(''sensor.woning_hvac_modus'') }}.  Heet
              ze van harte welkom terug. Als het huis op ''Verwarmen'' staat, beloof
              ze een warm nest. Als het op ''Koelen'' staat, beloof ze een heerlijk
              frisse oase na de warme reis.

              {{ regels() }}'
          response_variable: ai_antwoord_vakantie
        else:
        - variables:
            ai_antwoord_vakantie:
              response: ''
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: "\U0001F9F3 Welkom thuis! (Pre-Condition)"
            melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}
              {% set modus = states('sensor.woning_hvac_modus') | lower %} {% if 'koelen'
              in modus %}\n  {% set fallback = 'Welkom terug! De pre-cooling is gestart.
              Na die lange reis wacht er straks een heerlijk frisse oase op jullie.'
              %}\n{% elif 'verwarmen' in modus %}\n  {% set fallback = 'Welkom terug!
              De pre-heat is gestart. Jullie huisje wordt omgetoverd tot een lekker
              warm nest tegen dat jullie aankomen.' %}\n{% else %}\n  {% set fallback
              = 'Welkom terug! De klimaatregeling is gestart om het huis perfect comfortabel
              te maken voor jullie thuiskomst.' %}\n{% endif %}\n{{ render_melding(ai_antwoord_vakantie,
              fallback) }}"
            prioriteit: Geen
            melding_tag: hvac-preheat-status
            melding_group: huis
        continue_on_error: true
    - conditions:
      - condition: trigger
        id: thuis_opruimen
      - condition: state
        entity_id: input_boolean.pre_heat
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.pre_heat
  mode: single
  max_exceeded: silent
- id: '1779781816149'
  alias: 'HVAC: Centraal - Verwarming Winter Assistant'
  description: Beheert de Evohome verwarming voor Elmo en Trix. Schakelt direct uit
    bij open raam, evalueert escalaties bij langdurige open ramen/kou, en herstelt
    de modus bij sluiting.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.aqara_raamsensor_3
    - binary_sensor.aqara_raamsensor_2
    id: raam_wijziging
  - trigger: state
    entity_id:
    - climate.elmo
    - climate.trix
    to: heat
    for: 00:02:00
    id: verwarming_aangezet
  - trigger: state
    entity_id:
    - binary_sensor.aqara_raamsensor_3
    - binary_sensor.aqara_raamsensor_2
    to: 'on'
    for: 02:00:00
    id: escalatie_waarschuwing
  - trigger: numeric_state
    entity_id:
    - climate.elmo
    - climate.trix
    attribute: current_temperature
    below: 15.5
    id: escalatie_waarschuwing
  conditions:
  - condition: state
    entity_id: sensor.woning_hvac_modus
    state: Verwarmen
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''raam_wijziging'', ''verwarming_aangezet'']
          }}'
      - condition: template
        value_template: "{{ (is_state('binary_sensor.aqara_raamsensor_3', 'on') and
          is_state('climate.elmo', 'heat')) or\n   (is_state('binary_sensor.aqara_raamsensor_2',
          'on') and is_state('climate.trix', 'heat')) }}"
      sequence:
      - if:
        - condition: state
          entity_id: binary_sensor.aqara_raamsensor_3
          state: 'on'
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.elmo
          data:
            hvac_mode: 'off'
      - if:
        - condition: state
          entity_id: binary_sensor.aqara_raamsensor_2
          state: 'on'
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.trix
          data:
            hvac_mode: 'off'
      - if:
        - condition: state
          entity_id: input_boolean.lokale_notificaties
          state: 'off'
        then:
        - action: ai_task.generate_data
          continue_on_error: true
          data:
            task_name: Verwarming Uit Raam Open
            entity_id: ai_task.google_ai_task
            instructions: '{% from ''ai_formatting.jinja'' import persona, regels
              %} {{ persona() }}

              Meld aan Bert en Caroline dat de verwarming boven zojuist automatisch
              is UITGEZET in de kamer(s) waar een raam openstaat.  Status van de ramen:
              (Elmo open: {{ states(''binary_sensor.aqara_raamsensor_3'') }}, Trix
              open: {{ states(''binary_sensor.aqara_raamsensor_2'') }}).  Houd het
              kort, vlot en alert.

              {{ regels() }}'
          response_variable: ai_antwoord_uit
        else:
        - variables:
            ai_antwoord_uit:
              response: ''
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: ⚠️ Verwarming Uit (Raam Open)
            melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}\n{#
              Dynamische lokale fallback die kijkt welke ramen effectief openstaan
              #} {% set elmo_open = is_state('binary_sensor.aqara_raamsensor_3', 'on')
              %} {% set trix_open = is_state('binary_sensor.aqara_raamsensor_2', 'on')
              %} {% if elmo_open and trix_open %}\n  {% set fallback = 'De verwarming
              in de kamers van Elmo en Trix is uitgezet omdat beide ramen openstaan.'
              %}\n{% elif elmo_open %}\n  {% set fallback = 'De verwarming in de kamer
              van Elmo is uitgezet omdat zijn raam openstaat.' %}\n{% elif trix_open
              %}\n  {% set fallback = 'De verwarming in de kamer van Trix is uitgezet
              omdat haar raam openstaat.' %}\n{% else %}\n  {% set fallback = 'Verwarming
              boven uitgezet wegens open raam.' %}\n{% endif %}\n{{ render_melding(ai_antwoord_uit,
              fallback) }}"
            prioriteit: Push Alleen
            melding_tag: hvac-status-kamers
            melding_group: huis
        continue_on_error: true
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''escalatie_waarschuwing'' }}'
      - condition: template
        value_template: '{{ is_state(''binary_sensor.aqara_raamsensor_2'', ''on'')
          or is_state(''binary_sensor.aqara_raamsensor_3'', ''on'') }}'
      - condition: template
        value_template: '{{ states(''input_select.woning_status'') in [''Thuis'',
          ''Thuis Werk'', ''Thuis Verlof''] }}'
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.lokale_notificaties
          state: 'off'
        then:
        - action: ai_task.generate_data
          continue_on_error: true
          data:
            task_name: Escalatie Kou Kinderkamers
            entity_id: ai_task.google_ai_task
            instructions: '{% from ''ai_formatting.jinja'' import persona, regels
              %} {{ persona() }}

              Er staat al heel lang een raam open boven (of het is kouder dan 15.5
              graden).  Herinner de bewoners eraan dat de kamers nu wel erg koud worden
              en dat de verwarming pas weer start als de ramen toe zijn.  Maak het
              direct en gevat.

              {{ regels() }}'
          response_variable: ai_antwoord_escalatie
        else:
        - variables:
            ai_antwoord_escalatie:
              response: ''
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: "Koude Kinderkamers \U0001F321️"
            melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}\n{#
              Dynamische lokale fallback die toont welke kamer te koud wordt #} {%
              set elmo_open = is_state('binary_sensor.aqara_raamsensor_3', 'on') %}
              {% set trix_open = is_state('binary_sensor.aqara_raamsensor_2', 'on')
              %} {% if elmo_open and trix_open %}\n  {% set fallback = 'De kamers
              van Elmo en Trix worden nu wel erg koud. Sluit de ramen om de verwarming
              weer te activeren.' %}\n{% elif elmo_open %}\n  {% set fallback = 'De
              kamer van Elmo koelt hard af. Sluit zijn raam zodat de verwarming weer
              kan starten.' %}\n{% elif trix_open %}\n  {% set fallback = 'De kamer
              van Trix koelt hard af. Sluit haar raam zodat de verwarming weer kan
              starten.' %}\n{% else %}\n  {% set fallback = 'De kamers boven worden
              te koud. Sluit de ramen om te kunnen verwarmen.' %}\n{% endif %}\n{{
              render_melding(ai_antwoord_escalatie, fallback) }}"
            prioriteit: Geen
            melding_tag: hvac-status-kamers
            melding_group: huis
        continue_on_error: true
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''raam_wijziging'' }}'
      - condition: template
        value_template: "{{ (is_state('binary_sensor.aqara_raamsensor_3', 'off') and
          is_state('climate.elmo', 'off')) or\n   (is_state('binary_sensor.aqara_raamsensor_2',
          'off') and is_state('climate.trix', 'off')) }}"
      sequence:
      - if:
        - condition: state
          entity_id: binary_sensor.aqara_raamsensor_3
          state: 'off'
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.elmo
          data:
            hvac_mode: heat
      - if:
        - condition: state
          entity_id: binary_sensor.aqara_raamsensor_2
          state: 'off'
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.trix
          data:
            hvac_mode: heat
      - if:
        - condition: state
          entity_id: input_boolean.lokale_notificaties
          state: 'off'
        then:
        - action: ai_task.generate_data
          continue_on_error: true
          data:
            task_name: Raam Dicht Verwarming Aan
            entity_id: ai_task.google_ai_task
            instructions: '{% from ''ai_formatting.jinja'' import persona, regels
              %} {{ persona() }}

              Er is zojuist een raam gesloten boven. Bevestig dat de Evohome verwarming
              voor die specifieke kamer(s) weer actief is en bedank ze vlot.

              {{ regels() }}'
          response_variable: ai_antwoord_aan
        else:
        - variables:
            ai_antwoord_aan:
              response: ''
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: "Verwarming Slaapkamers \U0001F321️"
            melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}\n{#
              Dynamische lokale fallback voor het sluiten van de ramen #} {% set elmo_toe
              = is_state('binary_sensor.aqara_raamsensor_3', 'off') %} {% set trix_toe
              = is_state('binary_sensor.aqara_raamsensor_2', 'off') %} {% if elmo_toe
              and trix_toe %}\n  {% set fallback = 'De ramen zijn dicht. De verwarming
              voor zowel Elmo als Trix volgt weer het normale schema.' %}\n{% elif
              elmo_toe %}\n  {% set fallback = 'Het raam van Elmo is gesloten. Zijn
              kamer wordt weer netjes verwarmd volgens schema.' %}\n{% elif trix_toe
              %}\n  {% set fallback = 'Het raam van Trix is gesloten. Haar kamer wordt
              weer netjes verwarmd volgens schema.' %}\n{% else %}\n  {% set fallback
              = 'Ramen gesloten. Verwarming boven volgt weer het normale schema.'
              %}\n{% endif %}\n{{ render_melding(ai_antwoord_aan, fallback) }}"
            prioriteit: Push Alleen
            melding_tag: hvac-status-kamers
            melding_group: huis
        continue_on_error: true
  mode: single
- id: '1779943993776'
  alias: 'Licht: Kinderen - Wekker Ochtend Centraal'
  description: Wekt Elmo en/of Trix op basis van hun schema's en bundelt de notificaties  Refereert
    naar de ouders om overlap te voorkomen.
  triggers:
  - trigger: state
    entity_id: schedule.slapen_elmo
    from: 'on'
    to: 'off'
    id: elmo_trigger
  - trigger: state
    entity_id: schedule.slapen_trix
    from: 'on'
    to: 'off'
    id: trix_trigger
  conditions:
  - condition: state
    entity_id: input_boolean.kids_wekker
    state: 'on'
  - condition: state
    entity_id: input_select.woning_status
    state:
    - Thuis
    - Juist Thuis
    - Thuis Werk
    - Thuis Verlof
  - condition: time
    before: '10:00:00'
  actions:
  - delay: 00:00:05
  - variables:
      elmo_actief: '{{ is_state(''schedule.slapen_elmo'', ''off'') and is_state(''switch.hue_smart_plug_6'',
        ''on'') }}'
      trix_actief: '{{ is_state(''schedule.slapen_trix'', ''off'') and is_state(''switch.hue_smart_plug_5'',
        ''on'') }}'
  - condition: template
    value_template: '{{ elmo_actief or trix_actief }}'
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Wekker Ochtend Kinderen Notificatie
        entity_id: ai_task.google_ai_task
        instructions: "{% from 'ai_formatting.jinja' import persona, regels %} {{
          persona() }} Stuur een kort, vlot bericht naar de ouders om te melden dat
          de automatische wekroutine start. \nSITUATIE:  {% if elmo_actief and trix_actief
          %}\n  Zowel hun kleine jongen (Elmo) als hun kleine meid (Trix) moeten nu
          gewekt worden.\n{% elif elmo_actief %}\n  Hun kleine jongen (Elmo) moet
          nu gewekt worden.\n{% else %}\n  Hun kleine meid (Trix) moet nu gewekt worden.\n{%
          endif %}\nMaak het een tikkeltje ludiek of herkenbaar voor de vroege ochtend
          (max 1 à 2 zinnen).\n{{ regels() }}\n"
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: ⏰ Tijd om op te staan!
        melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}\n{#
          Lokale fallback op basis van actieve wekkers #} {% if elmo_actief and trix_actief
          %}\n  {% set wie = 'Elmo en Trix' %}\n{% elif elmo_actief %}\n  {% set wie
          = 'Elmo' %}\n{% else %}\n  {% set wie = 'Trix' %}\n{% endif %}\n{% set fallback
          = '⚠️ [Lokaal] Het schema is afgelopen. Tijd om ' ~ wie ~ ' te gaan wekken!'
          %}\n{{ render_melding(ai_antwoord, fallback) }}\n"
        prioriteit: Geen
        melding_tag: kids-status
        melding_group: huis
    continue_on_error: true
  - parallel:
    - if:
      - condition: template
        value_template: '{{ elmo_actief }}'
      then:
      - delay: 00:01:02
      - if:
        - condition: state
          entity_id: input_boolean.kids_wekker
          state: 'on'
        - condition: state
          entity_id: light.hue_white_and_color_ambiance_a19_gen2_1
          state: 'off'
        then:
        - action: script.turn_on
          target:
            entity_id: script.light_elmo
      - delay: 00:10:00
      - action: switch.turn_off
        target:
          entity_id: switch.hue_smart_plug_6
    - if:
      - condition: template
        value_template: '{{ trix_actief }}'
      then:
      - delay: 00:01:02
      - if:
        - condition: state
          entity_id: input_boolean.kids_wekker
          state: 'on'
        - condition: state
          entity_id: light.hue_white_and_color_ambiance_a19_gen2_2
          state: 'off'
        then:
        - action: script.turn_on
          target:
            entity_id: script.light_trix
      - delay: 00:10:00
      - action: switch.turn_off
        target:
          entity_id: switch.hue_smart_plug_5
  mode: queued
  max: 10
- id: '1779944162001'
  alias: 'Licht: Kinderen - Alarm Wekker Handmatig Centraal'
  description: Regelt het handmatig wekken van Elmo en/of Trix via hun input_buttons
    en  bundelt de pushnotificaties naar de ouders om overlap te voorkomen.
  triggers:
  - trigger: state
    entity_id: input_button.elmo_alarm
    id: elmo_knop
  - trigger: state
    entity_id: input_button.trix_alarm
    id: trix_knop
  conditions: []
  actions:
  - delay: 00:00:02
  - variables:
      elmo_actief: '{{ has_been_triggered if trigger.id == ''elmo_knop'' else (as_timestamp(now())
        - as_timestamp(states.input_button.elmo_alarm.last_changed) < 5) }}'
      trix_actief: '{{ has_been_triggered if trigger.id == ''trix_knop'' else (as_timestamp(now())
        - as_timestamp(states.input_button.trix_alarm.last_changed) < 5) }}'
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Handmatige Wekker Kinderen Notificatie
        entity_id: ai_task.google_ai_task
        instructions: "{% from 'ai_formatting.jinja' import persona, regels %} {{
          persona() }} Stuur een kort, alert bericht naar de ouders om te bevestigen
          dat ze zojuist handmatig de wekroutine hebben gestart.\nSITUATIE:  {% if
          elmo_actief and trix_actief %}\n  De wekkers voor zowel hun kleine jongen
          (Elmo) als hun kleine meid (Trix) zijn handmatig geactiveerd.\n{% elif elmo_actief
          %}\n  De wekker voor hun kleine jongen (Elmo) is handmatig geactiveerd.\n{%
          else %}\n  De wekker voor hun kleine meid (Trix) is handmatig geactiveerd.\n{%
          endif %}\nMaak het vlot en direct (maximaal 1 à 2 zinnen).\n{{ regels()
          }}\n"
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: ⚡ Handmatige wekker gestart
        melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}\n{#
          Lokale fallback string die de variabelen hergebruikt #} {% if elmo_actief
          and trix_actief %}\n  {% set wie = 'Elmo en Trix' %}\n{% elif elmo_actief
          %}\n  {% set wie = 'Elmo' %}\n{% else %}\n  {% set wie = 'Trix' %}\n{% endif
          %}\n{% set fallback = '⚠️ [Lokaal] Handmatige wekroutine gestart voor '
          ~ wie ~ '.' %}\n{{ render_melding(ai_antwoord, fallback) }}\n"
        prioriteit: Geen
        melding_tag: kids-status
        melding_group: huis
    continue_on_error: true
  - parallel:
    - if:
      - condition: template
        value_template: '{{ elmo_actief }}'
      then:
      - if:
        - condition: state
          entity_id: light.hue_white_and_color_ambiance_a19_gen2_1
          state: 'off'
        then:
        - action: scene.turn_on
          target:
            entity_id: scene.elmo_ochtend
          data:
            transition: 120
      - delay: 00:05:00
      - action: switch.turn_off
        target:
          entity_id: switch.hue_smart_plug_6
    - if:
      - condition: template
        value_template: '{{ trix_actief }}'
      then:
      - if:
        - condition: state
          entity_id: light.hue_white_and_color_ambiance_a19_gen2_2
          state: 'off'
        then:
        - action: scene.turn_on
          target:
            entity_id: scene.trix_ochtend
          data:
            transition: 60
      - delay: 00:05:00
      - action: switch.turn_off
        target:
          entity_id: switch.hue_smart_plug_5
  mode: queued
  max: 10
- id: '1779958423869'
  alias: 'Computer: Plex Integration Aan/Uit'
  description: Zet de Plex integratie aan of uit via Spook op basis van de computerstatus.
