          below: 8
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Slapen
    - condition: template
      value_template: '{% set b_home = is_state(''person.bert'', ''home'') and (now()
        - states.person.bert.last_changed).total_seconds() < 600 %} {% set c_home
        = is_state(''person.caroline'', ''home'') and (now() - states.person.caroline.last_changed).total_seconds()
