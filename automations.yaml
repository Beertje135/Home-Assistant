- id: '1760420793193'
  alias: Weerbericht - Kinderen - Notificatie
  description: Stuurt 's ochtends kledingadvies voor Trix en Elmo via AI en slaat
    de samenvatting op voor het display. Loopt via het centrale notificatiescript.
  triggers:
  - trigger: time
    at: 07:50:00
    id: werkdag
  - trigger: time
    at: 08:30:00
    id: weekend
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: werkdag
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
    - condition: and
      conditions:
      - condition: trigger
        id: weekend
      - condition: time
        weekday:
        - sat
        - sun
  actions:
  - variables:
      huidige_datum: '{{ now().strftime(''%d-%m-%Y'') }}'
      forecast_data: "{% set forecast = state_attr('sensor.pirate_weather_daily',
        'forecast') %} {% if forecast and forecast[0] is defined %}\n  {% set f =
        forecast[0] %}\n  Weerbeeld: {{ f.condition }}, Max Temp: {{ f.temperature
        }} graden Celsius, Min Temp: {{ f.templow }} graden Celsius, Regenbuien kans:
        {{ f.precipitation_probability }}%\n{% else %}\n  GEEN_DATA\n{% endif %}\n"
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Weerbericht kindjes
        entity_id: ai_task.google_ai_task
        instructions: '{% from ''ai_formatting.jinja'' import persona, regels %} {{
          persona() }} Je bent Homey, een vrolijke weerslezer speciaal voor kinderen.
          Vertel kort en enthousiast wat voor weer het VANDAAG wordt voor Elmo (jongen
          van 7 jaar) and Trix (meisje van 4 jaar). Datum: {{ huidige_datum }}.

          Geef een specifiek advies over of ze een dikke jas, dunne jas of geen jas
          aan moeten, en of een paraplu nodig is. Onthoud: Elmo wil het liefst altijd
          een korte broek aan boven de 0 graden, maar herinner hem er op een grappige
          manier aan dat dat niet altijd een goed idee is!

          MAXIMAAL 250 tekens (UUTERST BELANGRIJK voor het display).

          WEERGEGEVENS VOOR VANDAAG: {{ forecast_data }}

          Als er hierboven ''GEEN_DATA'' staat, maak er dan zelf een vrolijke verrassing
          van maar meld op een grappige manier dat het weerstation gek doet (bijvoorbeeld
          dat het gehaktballen regent)!

          {{ regels() }}

          '
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: input_text.set_value
    target:
      entity_id: input_text.weer_samenvatting
    data:
      value: '{% from ''ai_formatting.jinja'' import render_melding %} {% set fallback
        = ''[Lokaal] Geen live weerbericht beschikbaar. Kijk even naar buiten!'' %}
        {{ render_melding(ai_antwoord, fallback)[:250] }}

        '
    continue_on_error: true
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Weerbericht voor de kids \U0001F324️"
        melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}\n{#
          Uitgebreide lokale fallback met volledige weerslogica #} {% set forecast
          = state_attr('sensor.pirate_weather_daily', 'forecast') %} {% if forecast
          and forecast[0] is defined %}\n  {% set f = forecast[0] %}\n  {% set temp
          = f.temperature | float %}\n  {% set jas = 'Doe maar een dikke jas aan!'
          if temp < 12 else ('Een dunne jas is perfect vandaag.' if temp < 18 else
          'Geen jas nodig!') %}\n  {% set regen = ' En neem voor de zekerheid een
          paraplu mee!' if f.precipitation_probability | float > 40 else '' %}\n  {%
          set fallback = '⚠️ [Lokaal] Goedemorgen Elmo en Trix! Vandaag wordt het
          ' ~ temp ~ ' graden. ' ~ jas ~ regen ~ ' En Elmo: geen korte broek vandaag!'
          %}\n{% else %}\n  {% set fallback = '⚠️ [Lokaal] Goedemorgen! Het weerstation
          doet een beetje gek vandaag. Kijk goed naar buiten om te zien welke jas
          je nodig hebt!' %}\n{% endif %}\n{{ render_melding(ai_antwoord, fallback)
          }}\n"
        prioriteit: Geen
        melding_tag: weer-status
        melding_group: huis
        click_url: /lovelace/favorieten
    continue_on_error: true
  mode: single
  max_exceeded: silent
- id: '1760632735300'
  alias: 'Personen: Slaaptijd Elmo - Notificatie'
  description: 'Start de ochtend/avondroutine voor Elmo''s slaapritueel (boekje &
    papje): AI weetje via HomePod en pushnotificatie naar ouders via het centrale
    script.'
  triggers:
  - trigger: state
    entity_id: schedule.slapen_elmo
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Slaaptijd Elmo
        entity_id: ai_task.google_ai_task
        instructions: '{% from ''ai_formatting.jinja'' import persona, regels %} {{
          persona() }} Je bent een enthousiaste omroeper genaamd Homey. Spreek Elmo
          (7 jaar) direct toe. Hij is al erg volwassen voor zijn leeftijd, dus noem
          hem absoluut GEEN kleine jongen of soortgelijke verkleinwoorden. Vertel
          hem dat het tijd is om zich klaar te maken voor bed (tijd voor zijn boekje
          en papje). Geef hem elke dag een ander, superinteressant weetje mee over
          de natuur, wetenschap of Pokémon! Maak het vrolijk, een beetje grappig en
