  - condition: state
    entity_id: sensor.woning_hvac_modus
    state: Verwarmen
  - condition: state
    entity_id: climate.keuken
    state: heat
  - condition: numeric_state
    entity_id: climate.keuken
    attribute: temperature
    above: 15
  - condition: template
    value_template: '{{ state_attr(''climate.keuken'', ''temperature'') | float(0)
      > states(''sensor.hue_outdoor_sensor_2_temperature'') | float(0) }}'
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.aqara_raamsensor_1
      state: 'on'
    - condition: state
      entity_id: binary_sensor.aqara_raamsensor_5
      state: 'on'
  actions:
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Raam open keuken
      entity_id: ai_task.google_ai_task
      instructions: 'Je bent een home assistant genaamd Siri. Je bent een beetje geërgerd  want
        er staat weer een deur of raam open in de keuken. Hierdoor moet je  die verwarming
        lager zetten. Zeg tegen Bert en Caroline (indien thuis)  of tegen het bezoek
        dat je de verwarming lager zet. Wees kort (geschikt voor iOS).

        HUIDIGE SENSORSTATUS: - Achterdeur: {{ states(''binary_sensor.aqara_raamsensor_5'')
        }} (on = open, off = dicht) - Schuifraam: {{ states(''binary_sensor.aqara_raamsensor_1'')
        }} (on = open, off = dicht) - Bert: {{ states(''person.bert'') }} - Caroline:
        {{ states(''person.caroline'') }} - Bezoek: {{ states(''binary_sensor.bezoek'')
        }}

        STRIKTE FORMATTERING REGELS: 1. Geef DIRECT de tekst van de melding. Typ GEEN
        introductie. 2. Gebruik NOOIT Markdown-opmaak. Gebruik GEEN sterretjes (**).  3.
        De output moet pure, schone platte tekst zijn die direct in een pushnotificatie
        past.'
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Verwarming Keuken \U0001F321️"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %} {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %} {% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          Er staat een raam of deur open in de keuken. Ik zet de verwarming uit om
          energie te besparen.\n{% endif %}"
        prioriteit: Geen
        melding_tag: hvac-status-keuken
        melding_group: huis
  - delay: 00:01:00
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: binary_sensor.aqara_raamsensor_1
        state: 'on'
      - condition: state
        entity_id: binary_sensor.aqara_raamsensor_5
        state: 'on'
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.keuken
      data:
        hvac_mode: 'off'
