- id: light_sun_001
  alias: 'Licht: Zon - Onder/Op Sync'
  description: Update de sun_up_down boolean met een offset van 1 uur
  mode: restart
  trigger:
  - platform: sun
    event: sunset
    offset: -01:00:00
  - platform: sun
    event: sunrise
    offset: 01:00:00
  - platform: homeassistant
    event: start
  action:
  - if:
    - condition: sun
      after: sunrise
      after_offset: 01:00:00
