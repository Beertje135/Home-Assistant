- id: heating_state_house_001
  alias: 'HVAC: EvoHome - Weg (Eco Mode)'
  description: Zet de verwarming lager (AutoWithEco) als we langer weg zijn, op het
    werk zijn of ver weg zijn, mits het huis centraal in de modus Verwarmen staat.
  triggers:
  - trigger: state
    entity_id: input_select.woning_status
    to: Weg
    for: 01:30:00
  - trigger: state
    entity_id: person.caroline
    to: Werk (Caro)
  - trigger: state
    entity_id: person.bert
    to: Werk (Bert)
  - trigger: numeric_state
    entity_id: sensor.home_nearest_distance
    above: 100
  conditions:
  - condition: state
    entity_id: sensor.woning_hvac_modus
    state: Verwarmen
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.ons_huisje
      attribute: preset_mode
      state: eco
  - condition: or
    conditions:
    - condition: state
      entity_id: input_select.woning_status
      state: Weg
      for: 01:30:00
    - condition: and
      conditions:
      - condition: state
        entity_id: person.caroline
        state: Werk (Caro)
      - condition: state
        entity_id: person.bert
        state: Werk (Bert)
    - condition: and
      conditions:
      - condition: numeric_state
        entity_id: sensor.home_nearest_distance
        above: 100
      - condition: state
        entity_id: sensor.home_nearest_direction_of_travel
        state: away_from
  actions:
  - action: evohome.set_system_mode
    data:
      mode: AutoWithEco
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Verwarming Weg Eco
      entity_id: ai_task.google_ai_task
      instructions: 'Je bent Siri en beheert het klimaat in het huis van Bert en Caroline.
        Iedereen is nu een tijdje weg van huis (of aan het werk / ver weg). De verwarming
        is daarom automatisch naar de energiebesparende eco-modus geschakeld. Meld
        dit op een slimme, efficiënte manier en bevestig dat we energie besparen.

        STRIKTE FORMATTERING REGELS:  1. Geef DIRECT de tekst van de melding. Typ
        GEEN introductie.  2. Gebruik NOOIT Markdown-opmaak (geen sterretjes).   3.
        De output moet pure, schone platte tekst zijn.

        '
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "\U0001F343 Verwarming naar Eco-stand"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %}  {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          Iedereen is weg. De verwarming is naar de lagere eco-stand geschakeld om
          energie te besparen.\n{% endif %}"
        prioriteit: Geen
        melding_tag: hvac-weg-status
        melding_group: huis
    continue_on_error: true
  mode: single
  max_exceeded: silent
- id: heating_state_house_002
  alias: 'HVAC: EvoHome - Thuis (Auto Mode)'
  description: Zet het Evohome-systeem direct terug op Auto (schema) zodra we thuis
    zijn of opstaan, mits het huis centraal in de modus Verwarmen staat.
  triggers:
  - trigger: state
    entity_id: input_select.woning_status
    to: Thuis
  - trigger: state
    entity_id: input_select.woning_status
    to: Juist Thuis
  - trigger: state
    entity_id: input_select.woning_status
    to: Juist Wakker
  conditions:
  - condition: state
    entity_id: sensor.woning_hvac_modus
    state: Verwarmen
  actions:
  - action: evohome.set_system_mode
    data:
      mode: Auto
  mode: single
  max_exceeded: silent
- id: heating_state_house_003
  alias: 'HVAC: EvoHome - Slapen (Custom Mode)'
  description: Zet het Evohome-systeem direct op Custom zodra de woningstatus naar
    Slapen verandert, mits het huis in de modus Verwarmen staat.
  triggers:
  - trigger: state
    entity_id: input_select.woning_status
    to: Slapen
  conditions:
  - condition: state
    entity_id: sensor.woning_hvac_modus
    state: Verwarmen
  actions:
  - action: evohome.set_system_mode
    data:
      mode: Custom
  mode: single
  max_exceeded: silent
- id: heating_state_house_004
  alias: 'HVAC: EvoHome - Vakantie (Uit)'
  description: Schakelt de verwarming naar Eco (winter) of volledig Uit (andere seizoenen)
    bij vertrek op vakantie, mits het huis centraal in de modus Verwarmen staat.
  triggers:
  - trigger: state
    entity_id: input_select.woning_status
    to: Op Vakantie
  conditions:
  - condition: state
    entity_id: sensor.woning_hvac_modus
    state: Verwarmen
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.season
        state: winter
      sequence:
      - action: evohome.set_system_mode
        target:
          entity_id: climate.ons_huisje
        data:
          mode: AutoWithEco
      - action: ai_task.generate_data
        continue_on_error: true
        data:
          task_name: Verwarming Vakantie Winter
          entity_id: ai_task.google_ai_task
          instructions: 'Je bent Siri. Bert en Caroline vertrekken zojuist op vakantie
            in de winter. Meld hen dat de woningstatus op vakantie staat en dat de
            verwarming automatisch naar de energiebesparende eco-modus is geschakeld
            om het huis te beschermen tegen de kou. Wens hen een fijne vakantie.

            STRIKTE FORMATTERING REGELS:  1. Geef DIRECT de tekst van de melding.
            Typ GEEN introductie.  2. Gebruik NOOIT Markdown-opmaak (geen sterretjes).   3.
            De output moet pure, schone platte tekst zijn.

            '
        response_variable: ai_antwoord
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: "\U0001F9F3 Vakantiemodus geactiveerd (Eco)"
            melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
              'on') %}  {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
              is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
              and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
              Fijne vakantie! De verwarming is op de lagere eco-stand gezet.\n{% endif
              %}"
            prioriteit: Geen
            melding_tag: hvac-vakantie-status
            melding_group: huis
        continue_on_error: true
    default:
    - action: evohome.set_system_mode
      target:
        entity_id: climate.ons_huisje
      data:
        mode: HeatingOff
  mode: single
  max_exceeded: silent
- id: heating_timer_001
  alias: 'HVAC: EvoHome - Badkamer Timer Reset naar Auto'
  description: Zet de badkamer thermostaat automatisch terug naar het schema (preset_mode
    none) na 3 uur handmatige override.
  triggers:
  - trigger: state
    entity_id: climate.badkamer
    attribute: preset_mode
    to: temporary
    for: 03:00:00
  - trigger: state
    entity_id: climate.badkamer
    attribute: preset_mode
    to: permanent
    for: 03:00:00
  conditions:
  - condition: template
    value_template: '{{ state_attr(''climate.badkamer'', ''preset_mode'') in [''temporary'',
      ''permanent''] }}'
  actions:
  - action: climate.set_preset_mode
    target:
      entity_id: climate.badkamer
    data:
      preset_mode: none
  mode: single
  max_exceeded: silent
- id: heating_boolean_001
  alias: 'HVAC: Centraal - Modus Uitvoeren en EvoHome Status Aanpassen'
  description: Zet Evohome op Auto of HeatingOff en stuurt een slimme AI-notificatie
    op basis van de kinderkamerramen boven als de modus verandert.
  triggers:
  - trigger: state
    entity_id: sensor.woning_hvac_modus
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.woning_hvac_modus
        state: Verwarmen
      sequence:
      - action: evohome.set_system_mode
        data:
          mode: Auto
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.woning_hvac_modus'') in [''Koelen'', ''Verluchten'']
          }}'
      sequence:
      - action: evohome.set_system_mode
        data:
          mode: HeatingOff
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Verwarming Melding op Maat
      entity_id: ai_task.google_ai_task
      instructions: 'Je bent Siri en beheert het klimaat in het huis van Bert und
        Caroline. De centrale verwarmingsmodus is zojuist aangepast en je moet een
        statusmelding maken.

        GEGEVENS VAN HET HUIS: - Centrale HVAC Modus (sensor.woning_hvac_modus): {{
        states(''sensor.woning_hvac_modus'') }} - Raam kinderkamer 2: {{ states(''binary_sensor.aqara_raamsensor_2'')
        }} (on = open, off = dicht) - Raam kinderkamer 3: {{ states(''binary_sensor.aqara_raamsensor_3'')
        }} (on = open, off = dicht)

        BEPALING VAN DE TEKST: SITUATIE A (Modus is Verwarmen en er staat minstens
        één raam van de kinderkamers OPEN): Meld dringend maar vriendelijk dat de
        ramen van de kinderkamers nog openstaan terwijl de  verwarming begint te draaien.
        Vraag om ze te sluiten.

        SITUATIE B (Modus is Verwarmen en alle ramen boven zijn DICHT): Meld enthousiast
        dat de verwarming is aangezet en het huis lekker comfortabel zal worden gemaakt.

        SITUATIE C (Modus is Koelen of Verluchten en minstens één raam boven is nog
        DICHT): Meld dat de verwarming is uitgeschakeld omdat het buiten warm genoeg
        is, en herinner hen eraan  dat dit het ideale moment is om de kinderkamers
        lekker te verluchten.

        SITUATIE D (Modus is Koelen of Verluchten en ramen zijn al open): Meld simpelweg
        dat de verwarming is uitgeschakeld om energie te besparen.

        STRIKTE FORMATTERING REGELS: 1. Geef DIRECT de tekst van de melding. Typ GEEN
        introductie. 2. Gebruik NOOIT Markdown-opmaak (geen sterretjes). 3. De output
        moet pure, schone platte tekst zijn. 4. Hou het voldoende kort voor een iOS
        notificatie en spraaknotificatie via HomePods.'
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "{{ '⚠️ KINDERKAMERS RAMEN TOE!' if (is_state('sensor.woning_hvac_modus',
          'Verwarmen') and (is_state('binary_sensor.aqara_raamsensor_2', 'on') or
          is_state('binary_sensor.aqara_raamsensor_3', 'on'))) else '\U0001F525 HVAC
          Status' }}"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %} {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          De centrale woning modus is nu: {{ states('sensor.woning_hvac_modus') }}.
          Evohome staat op {% if is_state('sensor.woning_hvac_modus', 'Verwarmen')
          %}Auto{% else %}HeatingOff{% endif %}.\n{% endif %}"
        prioriteit: Geen
        melding_tag: '{{ ''hvac-status-boven'' if (is_state(''binary_sensor.aqara_raamsensor_2'',
          ''on'') or is_state(''binary_sensor.aqara_raamsensor_3'', ''on'')) else
          ''hvac-status'' }}'
        melding_group: huis
    continue_on_error: true
  mode: single
  max_exceeded: silent
