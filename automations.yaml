- id: ventilation_downstairs_002
  alias: 'HVAC: Airco Keuken - Notificatie'
  description: Stuurt een slimme notificatie wanneer we moeten koelen (met ramen open)
    of wanneer we kunnen verluchten (met ramen nog dicht). Houdt rekening met de zon,
    de tijd en de specifieke gevels beneden.
  triggers:
  - trigger: state
    entity_id: sensor.woning_hvac_modus
    to: Koelen
    id: modus_koelen
  - trigger: state
    entity_id: sensor.woning_hvac_modus
    to: Verluchten
    id: modus_verluchten
  - trigger: state
    entity_id:
    - binary_sensor.aqara_raamsensor_1
    - binary_sensor.aqara_raamsensor_5
    id: raam_status_wijziging
    for:
      hours: 0
      minutes: 2
      seconds: 0
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.woning_status
      state: Slapen
  - condition: template
    value_template: '{{ states(''input_select.woning_status'') in [''Thuis'', ''Thuis
      Werk'', ''Thuis Verlof'', ''Juist Thuis'', ''Juist Wakker''] }}'
  - condition: state
    entity_id: input_boolean.pre_heat
    state: 'off'
  - condition: template
    value_template: "{% set modus = states('sensor.woning_hvac_modus') %} {% set ramen_open
      = is_state('binary_sensor.aqara_raamsensor_1', 'on') or is_state('binary_sensor.aqara_raamsensor_5',
      'on') %} {% if modus == 'Koelen' and ramen_open %}\n  true\n{% elif modus ==
      'Verluchten' and not ramen_open %}\n  true\n{% else %}\n  false\n{% endif %}"
  actions:
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Airco en Ramen Check Beneden
      entity_id: ai_task.google_ai_task
      instructions: "Je bent Siri und beheert het klimaat in het huis van Bert en
        Caroline.\nSITUATIE 1 (Huidige modus is 'Koelen'): De woning staat in koelmodus,
        \ maar er staan beneden nog ramen of deuren open (schuifraam of achterdeur).
        \ Vertel ze op een grappige, dringende manier dat de ramen beneden dicht moeten
        \ om te voorkomen dat we de vogels buiten aan het koelen zijn.\nSITUATIE 2
        (Huidige modus is 'Verluchten'): Het is buiten officieel  minstens 3 graden
        frisser dan binnen! De airco's zijn uit, maar de ramen  beneden zijn nog dicht.
        Moedig ze aan om te verluchten, maar pas de  volgende STRIKTE GEVEL-LOGICA
        toe op basis van het weer en de tijd:\n- Schijnt de zon? (Huidige status zon:
        {{ states('sensor.solaredge_current_power') | float(0) > 1000 }}). - Als de
        zon NIET schijnt (of het is nacht), adviseer dan om schuifraam en achterdeur
        heerlijk open te zetten. - Als de zon WEL schijnt, geef dan dit specifieke
        geveladvies op basis van de tijd (Het is nu {{ now().strftime('%H:%M') }}):\n
        \ 1. In de VOORMIDDAG (vóór 12:00u): Waarschuw dat de ochtendzon vol op de
        VOORGEVEL staat. Adviseer om ENKEL de achterzijde (schuifraam/achterdeur)
        open te zetten waar schaduw is.\n  2. In de NAMIDDAG/AVOND (vanaf 12:00u):
        Waarschuw dat de zon nu aan de achterkant staat én dat de voorgevel aan de
        straatkant een 'hitte-eiland' is door het warme asfalt. Adviseer om strategisch
        te verluchten waar nu schaduw is.\n\nHUIDIGE STATUS BENEDEN: - Centrale HVAC
        Modus: {{ states('sensor.woning_hvac_modus') }} - Achterdeur (sensor 5): {{
        states('binary_sensor.aqara_raamsensor_5') }} - Schuifraam (sensor 1): {{
        states('binary_sensor.aqara_raamsensor_1') }}\nSTRIKTE FORMATTERING REGELS:
        1. Geef DIRECT de tekst van de melding. Typ GEEN introductie. 2. Gebruik NOOIT
        Markdown-opmaak (geen sterretjes). 3. De output moet pure, schone platte tekst
        zijn die geschikt is voor een pushnotificatie en HomePod TTS. 4. Hou het voldoende
        kort voor een iOS notificatie en spraaknotificatie via HomePods."
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "{{ '⚠️ BENEDEN RAMEN TOE AUB' if is_state('sensor.woning_hvac_modus',
          'Koelen') else '\U0001F32C️ BENEDEN VERLUCHTEN AUB' }}"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %} {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          {% if is_state('sensor.woning_hvac_modus', 'Koelen') %}De koeling staat
          aan maar de ramen staan nog open! Doe de achterdeur en het schuifraam snel
          dicht.{% else %}Het is buiten frisser dan binnen! Zet de achterdeur en het
          schuifraam open om gratis te verluchten.{% endif %}\n{% endif %}"
        prioriteit: Geen
        melding_tag: hvac-status-beneden
        melding_group: huis
    continue_on_error: true
  mode: single
  max_exceeded: silent
- id: media_keuken_001
  alias: 'Media: Keuken - Update Media Status'
  description: Zet de keuken media-boolean aan of uit op basis van de afspeelstatus
    van Plex op iPad, PC of Edge.
  triggers:
  - trigger: state
    entity_id:
    - media_player.plex_plex_for_ios_ipad
    - media_player.plex_plex_for_windows_pcbert
    - media_player.plex_plex_web_microsoft_edge_windows
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: state
