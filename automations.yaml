              is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
              and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
              Tot ziens Caroline.\n{% endif %}"
            prioriteit: Caroline Push
            melding_tag: caroline-status
        continue_on_error: true
  mode: queued
  max_exceeded: silent
  max: 10
- id: home_owner_003
  alias: 'Personen: Zones (Thuis) - Bezoeker Afmelden'
  description: Vraagt Bert of Caroline om de bezoeker-modus uit te zetten zodra zij
    thuiskomen.
  triggers:
