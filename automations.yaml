- id: heating_boolean_001
  alias: 'HVAC: Centraal - Modus Uitvoeren en EvoHome Status Aanpassen'
  description: Zet Evohome op Auto of HeatingOff en stuurt een slimme AI-notificatie
    op basis van de kinderkamerramen boven als de modus verandert.
  triggers:
  - trigger: state
    entity_id: sensor.woning_hvac_modus
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.woning_hvac_modus
        state: Verwarmen
      sequence:
      - action: evohome.set_system_mode
        data:
          mode: Auto
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.woning_hvac_modus'') in [''Koelen'', ''Verluchten'']
          }}'
      sequence:
      - action: evohome.set_system_mode
        data:
          mode: HeatingOff
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Verwarming Melding op Maat
        entity_id: ai_task.google_ai_task
        instructions: "{% from 'ai_formatting.jinja' import persona, regels %} {{
          persona() }}\nSITUATIE 1 (Huidige modus is 'Koelen'): De woning staat in
          koelmodus, check even of er nog ramen open staan want we gaan de airco's
          laten werken. Anders gaat de woning te hard opwarmen. Vertel ze op een grappige,
          dringende manier dat de ramen dicht moeten. Als alle ramen en deuren al
          toe zijn kan je gewoon melden dat we zijn overgestapt op koelmodus.\nSITUATIE
          2 (Huidige modus is 'verwarmen'): De woning staat in verwarmmodus, check
          even of er nog ramen open staan want we gaan de verwarming laten werken.
          Anders gaat de woning te hard afkoelen. Vertel ze op een grappige, dringende
          manier dat de ramen dicht moeten. Als alle ramen en deuren al toe zijn kan
          je gewoon melden dat we zijn overgestapt op verwarmodus.\nSITUATIE 3 (Huidige
          modus is 'Verluchten'): De airco's en de verwarming werden uitgezet en we
          gaan over op natuurlijke verluchting. Bepaal dynamisch het beste advies
          op basis van de temperaturen en de zon (Het is nu {{ now().strftime('%H:%M')
          }}):\n- Schijnt de zon? (Huidige status zon: {{ states('sensor.solaredge_current_power')
          | float(0) > 1000 }}). - Als de zon NIET schijnt (of het is nacht): Adviseer
          om ramen open te zetten voor frisse lucht. - Als de zon WEL schijnt, kijk
          je naar het doel (Koelen of Verwarmen):\n  A. SCENARIO WARM WEER (Buitentemperatuur
          is HOGER dan of GELIJK aan de binnentemperatuur): We willen de warmte buiten
          houden.\n     - Voormiddag (vóór 12:00u): Waarschuw dat de ochtendzon op
          de VOORGEVEL staat. Adviseer om ENKEL de achterzijde (schuifraam/achterdeur)
          open te zetten waar schaduw is.\n     - Namiddag/Avond (vanaf 12:00u): Waarschuw
          dat de zon aan de achterkant staat én de voorgevel een hitte-eiland is door
          het asfalt. Adviseer om strategisch in de schaduw te verluchten.\n   \n
          \ B. SCENARIO TUSSENSEIZOEN (Buitentemperatuur is LAGER dan de binnentemperatuur):
          We willen profiteren van gratis zonnewarmte (passieve verwarming).\n     -
          Voormiddag (vóór 12:00u): Meld dat de zon de VOORGEVEL heerlijk opwarmt.
          Adviseer om daar juist een raam open te zetten om gratis warme lucht binnen
          te laten.\n     - Namiddag/Avond (vanaf 12:00u): Meld dat de zon nu op de
          ACHTERGEVEL schijnt. Adviseer om het schuifraam/achterdeur open te zetten
          om de middagzon binnen te trekken.\n\n KLIMAAT GEGEVENS:\n - Buitentemperatuur
          (Gemiddeld): {{ states('sensor.hue_sensor_buiten_temperature') | float(20)
          }}°C\n - Binnentemperatuur: {{ state_attr('climate.ons_huisje', 'current_temperature')
          }}°C\n\nHUIDIGE STATUS BENEDEN:  - Centrale HVAC Modus: {{ states('sensor.woning_hvac_modus')
          }}  - Alle ramen overzicht: {{ states('group.windows')}} (on = een of meerdere
          ramen open, off = alles is dicht)  - Schuifraam keuken: {{ states('binary_sensor.aqara_raamsensor_1')
          }}  - Raam Trix: {{ states('binary_sensor.aqara_raamsensor_2') }}  - Raam
          Elmo: {{ states('binary_sensor.aqara_raamsensor_3') }}  - Raam Zolder: {{
          states('binary_sensor.aqara_raamsensor_4') }}  - Achterdeur: {{ states('binary_sensor.aqara_raamsensor_5')
          }}  - Voordeur: {{ states('binary_sensor.aqara_raamsensor_6') }}  - Raam
          Badkamer: {{ states('binary_sensor.ewelink_ds01_01_opening') }}\nWEERGEGEVENS:
          \ - Huidig weerbeeld: {{ states('sensor.pirate_weather_hourly') }}  - Algemene
          voorspelling vandaag: {{ states('sensor.pirate_weather_daily') }} \n{{ regels()
          }}"
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: '{{ ''⚠️ RAMEN TOE!'' if (is_state(''group.windows'', ''on'')
          and (is_state(''sensor.woning_hvac_modus'', ''Verwarmen'') or is_state(''sensor.woning_hvac_modus'',
          ''Koelen''))) else ''HVAC Status Update'' }}'
        melding_tekst: "{% from 'ai_formatting.jinja' import render_melding %}\n{#
          We bouwen een zeer intelligente lokale fallback op die exact de logica van
          de prompt volgt #}  {% set modus = states('sensor.woning_hvac_modus') %}
          \ {% set ramen_open = is_state('group.windows', 'on') %}  {% set t_binnen
          = state_attr('climate.ons_huisje', 'current_temperature') | float(20) %}
          \ {% set t_buiten = states('sensor.hue_sensor_buiten_temperature') | float(20)
          %} {% set zon = states('sensor.solaredge_current_power') | float(0) > 1000
          %} {% set is_voormiddag = now().hour < 12 %}\n{% if modus == 'Koelen' %}\n
          \ {% set fallback = 'De woning staat in koelmodus om de airco te starten!
          Doe snel alle ramen en deuren dicht om de hitte buiten te houden.' if ramen_open
          else 'Woning succesvol overgeschakeld naar koelmodus. Alle ramen zijn netjes
          gesloten.' %}\n{% elif modus == 'Verwarmen' %}\n  {% set fallback = 'De
          verwarming start op! Er staan nog ramen of deuren open. Doe ze snel dicht
          om de warmte binnen te houden.' if ramen_open else 'Woning succesvol overgeschakeld
          naar verwarmmodus. Alles is potdicht.' %}\n{% elif modus == 'Verluchten'
          %}\n  {% if not zon %}\n    {% set fallback = 'De airco en verwarming zijn
          uit. Het is bewolkt of nacht, dus zet gerust wat ramen open voor frisse
          lucht.' %}\n  {% else %}\n    {% if t_buiten >= t_binnen %}\n      {# WARM
          WEER #}\n      {% set fallback = 'Verluchten via schaduwzijde: de zon staat
          op de VOORGEVEL. Zet enkel het schuifraam of de achterdeur open.' if is_voormiddag
          else 'Warm weer: de zon staat achter en de voorgevel is een hitte-eiland.
          Verlucht strategisch in de schaduw.' %}\n    {% else %}\n      {# TUSSENSEIZOEN
          (Passieve zonnewarmte) #}\n      {% set fallback = 'Profiteer van gratis
          warmte! De zon warmt de VOORGEVEL op, zet daar een raam open.' if is_voormiddag
          else 'Profiteer van de zon! De middagzon schijnt op de ACHTERGEVEL, zet
          het schuifraam of de achterdeur open.' %}\n    {% endif %}\n  {% endif %}\n{%
          else %}\n  {% set fallback = 'De centrale woning modus is nu: ' ~ modus
          ~ '.' %}\n{% endif %}\n{{ render_melding(ai_antwoord, fallback) }}"
        prioriteit: Geen
        melding_tag: hvac-status
        melding_group: huis
    continue_on_error: true
  mode: single
  max_exceeded: silent
- id: light_bathroom_001
  alias: 'Licht: Badkamer - Aan (Smart Sync)'
  description: Zet de badkamerverlichting aan na beweging in de dressing, óf dimt
    het licht automatisch zodra de status 6 minuten op Slapen staat.
  triggers:
  - trigger: state
    entity_id: binary_sensor.hue_motion_sensor_1_motion
    to: 'on'
  - trigger: state
    entity_id: light.lightstrip_badkamer
    from: unavailable
  - trigger: state
    entity_id: input_select.woning_status
    to: Slapen
    for: 00:06:05
  conditions:
  - condition: not
    conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Juist Weg
      - condition: state
        entity_id: input_select.woning_status
        state: Weg
      - condition: state
        entity_id: input_select.woning_status
        state: Op Vakantie
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: light.lightstrip_badkamer
        state: unavailable
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: light.lightstrip_badkamer
          not_from: unavailable
        timeout: 00:00:30
        continue_on_timeout: false
      - delay: 00:00:01
      - action: script.turn_on
        target:
          entity_id: script.light_bathroom_on
    default:
    - action: script.turn_on
