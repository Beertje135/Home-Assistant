  - entity_id:
    - person.bert
    to: home
    id: Bert Thuis
    trigger: state
  - entity_id:
    - person.caroline
    from: home
    id: Caroline Weg
    trigger: state
  - entity_id:
    - person.bert
    from: home
    id: Bert Weg
