            state: 'on'
          sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.tuin1_kerstmis
            data:
              transition: 5
        - conditions:
          - condition: state
            entity_id: sensor.season
            state: autumn
          sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.tuin_2_deel_herfst
            data:
              transition: 5
        - conditions:
          - condition: state
            entity_id: sensor.season
            state: winter
          sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.tuin_deel_winter
            data:
              transition: 5
        - conditions:
          - condition: state
            entity_id: sensor.season
            state: spring
          sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.tuin_deel_lente
            data:
              transition: 5
        - conditions:
          - condition: state
            entity_id: sensor.season
            state: summer
          sequence:
          - action: scene.turn_on
            target:
