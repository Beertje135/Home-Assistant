  - condition: state
    entity_id: binary_sensor.aqara_raamsensor_3
    state: 'off'
  - condition: state
    entity_id: climate.airco_elmo
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.woning_hvac_modus
        state: Verwarmen
      - condition: trigger
        id: vorstbeveiliging
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.airco_elmo
        data:
          hvac_mode: heat
      - action: climate.set_temperature
        target:
          entity_id: climate.airco_elmo
        data:
          temperature: 19
    - conditions:
      - condition: state
        entity_id: sensor.woning_hvac_modus
        state: Koelen
      - condition: or
        conditions:
        - condition: trigger
          id: te_warm
        - condition: numeric_state
          entity_id: climate.elmo
          attribute: current_temperature
          above: 23
      - condition: state
        entity_id: switch.hue_smart_plug_6
        state: 'off'
      - condition: state
        entity_id: schedule.slapen_elmo
        state: 'off'
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: template
            value_template: '{{ states(''input_select.woning_status'') in [''Thuis'',
              ''Thuis Werk'', ''Thuis Verlof'', ''Juist Thuis'', ''Juist Wakker'']
              }}'
        - condition: state
          entity_id: input_boolean.pre_heat
          state: 'on'
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.airco_elmo
        data:
          hvac_mode: cool
      - action: climate.set_temperature
        target:
          entity_id: climate.airco_elmo
        data:
          temperature: 19
  mode: single
- id: '1695726976025'
  alias: 'HVAC: Airco Elmo - Uit'
  description: Schakelt de airco van Elmo uit zodra hij naar bed gaat, ramen openen,
    of de maximale temperatuur is bereikt. Blijft aan tijdens zonne-overschot (gratis
    koelen óf verwarmen).
  triggers:
  - trigger: state
    entity_id: schedule.slapen_elmo
    to: 'on'
    id: bedtijd
  - trigger: state
    entity_id: switch.hue_smart_plug_6
    to: 'on'
    id: bedtijd
  - trigger: state
    entity_id: binary_sensor.aqara_raamsensor_3
    to: 'on'
    id: raam_open
  - trigger: numeric_state
    entity_id: climate.elmo
    attribute: current_temperature
    above: 19.5
    for: 00:05:00
    id: warm_genoeg
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.airco_elmo
      state: 'off'
  actions:
  - delay: 00:00:20
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''raam_open'', ''bedtijd''] }}'
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.airco_elmo
        data:
          hvac_mode: 'off'
      - if:
        - condition: state
          entity_id: sensor.woning_hvac_modus
          state: Verwarmen
        - condition: state
          entity_id: binary_sensor.aqara_raamsensor_3
          state: 'off'
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.elmo
          data:
            hvac_mode: heat
    - conditions:
      - condition: trigger
        id: warm_genoeg
      - condition: not
        conditions:
        - condition: template
          value_template: '{{ is_state(''climate.airco_elmo'', ''heat'') or is_state(''sensor.woning_hvac_modus'',
            ''Verwarmen'') }}'
      sequence:
      - stop: Het is warm boven, maar we zijn niet aan het verwarmen. Airco mag blijven
          draaien.
    - conditions:
      - condition: numeric_state
        entity_id: sensor.solarflow_2400_ac_electric_level
        above: 95
      - condition: numeric_state
        entity_id: sensor.solaredge_current_power
        above: 1300
      - condition: numeric_state
        entity_id: sensor.elektriciteit_meter_p1_vermogen
        below: -500
      - condition: or
        conditions:
        - condition: state
          entity_id: sensor.woning_hvac_modus
          state: Koelen
        - condition: state
          entity_id: sensor.woning_hvac_modus
          state: Verwarmen
      sequence:
      - stop: Airco Elmo niet uitzetten, we gebruiken gratis zonne-energie!
    default:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.airco_elmo
      data:
        hvac_mode: 'off'
    - if:
      - condition: state
        entity_id: sensor.woning_hvac_modus
        state: Verwarmen
      - condition: state
        entity_id: binary_sensor.aqara_raamsensor_3
        state: 'off'
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.elmo
        data:
          hvac_mode: heat
  mode: queued
  max: 5
