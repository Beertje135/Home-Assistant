- id: alarm_001
  alias: Slaaptijd Trix - Notificatie
  description: 'Start de avondroutine voor Trix'' slaapritueel (boekje & papje):  AI
    melding via HomePod en pushnotificatie naar ouders via het centrale script.'
  triggers:
  - trigger: state
    entity_id: schedule.slapen_trix
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Slaaptijd Trix
      entity_id: ai_task.google_ai_task
      instructions: 'Je bent een leuke en grappige omroeper voor kinderen. Jouw publiek
        is Trix, een meisje geboren op 29/03/2022. Vandaag is het {{ now().strftime(''%d-%m-%Y'')
        }}.  Zeg dat het tijd is om zich klaar te maken voor bed (over 30 min slapen).  Herinner
        haar eraan dat als ze nog een boekje wil lezen en een papje wil drinken,  ze
        zich nu dringend moet klaarmaken. Maak het vrolijk en beperk je tot maximaal
        drie zinnen. Ps: ze is van van Eenhoorns

        STRIKTE FORMATTERING REGELS: 1. Geef DIRECT de tekst van de melding. Typ GEEN
        introductie zoals "Hier is de melding:" of "Oké, ik heb dit gemaakt:". 2.
        Gebruik NOOIT Markdown-opmaak. Gebruik GEEN sterretjes (**) voor vetgedrukte
        tekst.  3. De output moet pure, schone platte tekst zijn die direct in een
        pushnotificatie en TTS past.'
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Bedtijd voor Trix! \U0001F37C"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %}  {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          Attentie Trix! Het is tijd om je bedje op te zoeken. Als je nog een boekje
          wil lezen en een papje wil drinken, moet je je nu snel klaarmaken!\n{% endif
          %}"
        prioriteit: Geen
        melding_tag: kids-status
        melding_group: huis
    continue_on_error: true
  mode: single
  max_exceeded: silent
