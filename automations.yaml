    id: trigger_stayon_reset
  - trigger: state
    entity_id:
    - binary_sensor.hue_outdoor_sensor_1_motion
    - binary_sensor.hue_outdoor_sensor_2_motion
    - binary_sensor.hue_outdoor_sensor_3_motion
    - binary_sensor.aqara_raamsensor_5
    to: 'on'
    id: trigger_alles_aan
  - trigger: state
    entity_id: input_boolean.light_garden_stay_on
    to: 'on'
    id: trigger_alles_aan
  - trigger: state
    entity_id: input_select.woning_status
    to: Slapen
    for: 00:05:00
    id: trigger_alles_uit
  - trigger: numeric_state
    entity_id: sensor.hue_outdoor_sensor_3_light_level
    above: 10
    id: trigger_alles_uit
  - trigger: state
    entity_id:
    - binary_sensor.hue_outdoor_sensor_1_motion
    - binary_sensor.hue_outdoor_sensor_3_motion
    to: 'off'
    for: 00:06:00
    id: trigger_alles_uit
  - trigger: state
    entity_id: binary_sensor.hue_outdoor_sensor_2_motion
    to: 'off'
    for: 00:16:00
    id: trigger_alles_uit
  - trigger: state
    entity_id: input_select.woning_status
    to:
    - Thuis
    - Thuis Werk
    - Thuis Verlof
    id: trigger_deel_aan
  - trigger: state
    entity_id:
    - binary_sensor.hue_outdoor_sensor_1_motion
    - binary_sensor.hue_outdoor_sensor_3_motion
    - binary_sensor.hue_motion_sensor_2_motion
    to: 'on'
    id: trigger_deel_aan
  - trigger: state
    entity_id: input_boolean.light_garden_stay_on
    to: 'on'
    id: trigger_deel_aan
  - trigger: numeric_state
    entity_id: sensor.hue_outdoor_sensor_2_light_level
    below: 11
    id: trigger_deel_aan
  - trigger: state
    entity_id: input_boolean.light_garden_stay_on
    to: 'off'
    id: trigger_deel_uit
