    entity_id: input_select.woning_status
    to: Juist Wakker
    for: 00:10:00
  - trigger: state
    entity_id: input_select.woning_status
    to: Juist Weg
    for: 00:10:00
  - trigger: state
    entity_id: input_select.woning_status
    to: Weg
    for: '24:00:00'
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.woning_status
    data:
      option: "{% set status = trigger.to_state.state %} {% set workday = states('binary_sensor.workday_sensor')
        %} {% set werk_schema = states('schedule.werk') %}\n{% if status in ['Juist
        Thuis', 'Juist Wakker'] %}\n  {% if workday == 'off' and werk_schema == 'on'
        %} Thuis Verlof\n  {% elif workday == 'on' and werk_schema == 'on' %} Thuis
        Werk\n  {% else %} Thuis\n  {% endif %}\n{% elif status == 'Juist Weg' %}\n
        \ Weg\n{% elif status == 'Weg' %}\n  Op Vakantie\n{% else %}\n  {{ status
        }}\n{% endif %}\n"
  mode: restart
- id: house_005
  alias: 'Ons Huisje: Detectie Wakker Worden'
  description: Zet woningstatus naar 'Juist Wakker' bij de eerste ochtendbeweging,
    mits het huis langer dan een uur in 'Slapen' staat.
  triggers:
  - trigger: state
    entity_id: binary_sensor.hue_motion_sensor_1_motion
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_select.woning_status
    state: Slapen
    for: 01:00:00
  - condition: state
    entity_id: schedule.slapen
    state: 'off'
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.woning_status
    data:
      option: Juist Wakker
  mode: single
- id: house_006
  alias: 'Ons Huisje: Werk/Verlof Status AAN'
  description: Schakelt automatisch tussen 'Thuis Werk' en 'Thuis Verlof' op basis
    van agenda en vakantie-instellingen.
  triggers:
  - trigger: state
    entity_id: schedule.werk
    to: 'on'
  - trigger: state
    entity_id: input_select.woning_status
    to: Thuis
    for: 00:01:00
  - trigger: state
    entity_id: input_boolean.schoolvakantie
    to: 'on'
  conditions:
  - condition: state
    entity_id: schedule.werk
    state: 'on'
  - condition: state
    entity_id: input_select.woning_status
    state:
    - Thuis
    - Thuis Werk
    - Thuis Verlof
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.woning_status
    data:
      option: "{% if is_state('binary_sensor.workday_sensor', 'off') or is_state('input_boolean.schoolvakantie',
        'on') %}\n  Thuis Verlof\n{% else %}\n  Thuis Werk\n{% endif %}\n"
  mode: restart
- id: house_007
  alias: 'Ons Huisje: Werk/Verlof Status UIT'
  description: Schakelt terug naar 'Thuis' wanneer het werkschema of de schoolvakantie-instelling
    stopt.
  triggers:
  - trigger: state
    entity_id: schedule.werk
    to: 'off'
  - trigger: state
    entity_id: input_boolean.schoolvakantie
    to: 'off'
  conditions:
  - condition: state
    entity_id: input_select.woning_status
    state:
    - Thuis Werk
    - Thuis Verlof
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.woning_status
    data:
      option: Thuis
  mode: restart
- id: house_008
  alias: 'Ons Huisje: Automatisch op Vakantie'
  description: Zet de woningstatus automatisch op 'Op Vakantie' wanneer de kortste
    afstand van de bewoners tot het huis langer dan 1 minuut groter is dan 80 km.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.home_nearest_distance
    above: 80
    for: 00:01:00
  - trigger: state
    entity_id: sensor.home_nearest_distance
  conditions:
  - condition: state
    entity_id: input_select.woning_status
    state: Weg
  - condition: numeric_state
    entity_id: sensor.home_nearest_distance
    above: 80
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.woning_status
    data:
      option: Op Vakantie
  mode: single
- id: amplifier_livingroom_001
  alias: 'Media: Woonkamer - Harmony Uit bij Inactiviteit'
  description: Zet de Harmony Hub op PowerOff als de Apple TV standby staat, uit is,
    of al 30 minuten gepauzeerd staat.
  triggers:
  - trigger: state
    entity_id: media_player.apple_tv_4k_1
    to:
    - standby
    - 'off'
  - trigger: state
    entity_id: media_player.apple_tv_4k_1
    to:
    - paused
    - idle
    for: 00:30:00
  conditions:
  - condition: state
    entity_id: remote.harmony_hub
    attribute: current_activity
    state: Apple tv
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.harmony_hub
    data:
      option: PowerOff
  mode: restart
- id: amplifier_livingroom_005
  alias: 'Media: Woonkamer - Harmony Aan bij Apple TV Start'
  description: Schakelt de Harmony Hub naar 'Apple tv' zodra de Apple TV start en
    de Hub nog op een andere activiteit staat.
  triggers:
  - trigger: state
    entity_id: media_player.apple_tv_4k_1
    from:
    - standby
    - 'off'
    to: idle
  - trigger: state
    entity_id: media_player.apple_tv_4k_1
    to: playing
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: remote.harmony_hub
      attribute: current_activity
      state: Apple tv
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.harmony_hub
    data:
      option: Apple tv
  mode: restart
- id: home_owner_001
  alias: 'Personen: Zones (Thuis/Weg)'
  description: Stuurt notificaties wanneer Bert of Caroline de thuiszone betreden
    of verlaten.
  triggers:
  - entity_id:
    - person.caroline
    to: home
    id: Caroline Thuis
