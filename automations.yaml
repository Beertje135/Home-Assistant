- id: ventilation_downstairs_002
  alias: 'HVAC: Airco Keuken - Notificatie'
  description: Stuurt een slimme notificatie wanneer we moeten koelen (met ramen open)
    of wanneer we kunnen verluchten (met ramen nog dicht). Houdt rekening met de zon,
    de tijd en de specifieke gevels beneden.
  triggers:
  - trigger: state
    entity_id:
    - sensor.woning_hvac_modus
    id: modus_koelen
  - trigger: state
    entity_id:
    - binary_sensor.aqara_raamsensor_1
    - binary_sensor.aqara_raamsensor_5
    id: raam_status_wijziging
    for:
      hours: 0
      minutes: 2
      seconds: 0
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.woning_status
      state: Slapen
  - condition: template
    value_template: '{{ states(''input_select.woning_status'') in [''Thuis'', ''Thuis
      Werk'', ''Thuis Verlof'', ''Juist Thuis'', ''Juist Wakker''] }}'
  - condition: state
    entity_id: input_boolean.pre_heat
    state: 'off'
  - condition: template
    value_template: "{% set modus = states('sensor.woning_hvac_modus') %} {% set ramen_open
      = is_state('binary_sensor.aqara_raamsensor_1', 'on') or is_state('binary_sensor.aqara_raamsensor_5',
      'on') %}\n{% if modus in ['Koelen', 'Verwarmen'] and ramen_open %}\n  true\n{%
      elif modus == 'Verluchten' and not ramen_open %}\n  true\n{% else %}\n  false\n{%
      endif %}"
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Airco en Ramen Check Beneden
        entity_id: ai_task.google_ai_task
        instructions: '{% from ''ai_formatting.jinja'' import persona, regels %} {{
          persona() }}

          Je beheert het klimaat in de woning.

          SITUATIE 1 (Huidige modus is ''Koelen'' en er staat nog een raam open):
          De woning staat in koelmodus, maar er staan in de keuken nog ramen of deuren
          open (schuifraam of achterdeur). Vertel ze op een grappige, dringende manier
          dat de ramen in de keuken dicht moeten.

          SITUATIE 2 (Huidige modus is ''verwarmen'' en er staat nog een raam open):
          De woning staat in verwarmmodus, maar er staan in de keuken nog ramen of
          deuren open (schuifraam of achterdeur). Vertel ze op een grappige, dringende
          manier dat de ramen in de keuken dicht moeten.

          SITUATIE 3 (Huidige modus is ''Verluchten'' en de ramen zijn nog toe): Het
          is buiten officieel beter dan binnen! De airco''s en de verwarming zijn
          uit, maar de ramen in de keuken zijn nog potdicht. Moedig ze aan om te verluchten.

          HUIDIGE STATUS BENEDEN:  - Centrale HVAC Modus: {{ states(''sensor.woning_hvac_modus'')
          }}  - Achterdeur (sensor 5): {{ states(''binary_sensor.aqara_raamsensor_5'')
          }}  - Schuifraam (sensor 1): {{ states(''binary_sensor.aqara_raamsensor_1'')
          }}

          {{ regels() }}'
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "{% set m = states('sensor.woning_hvac_modus') %}  {{ '⚠️ BENEDEN
          RAMEN TOE AUB' if m in ['Koelen', 'Verwarmen'] else '\U0001F32C️ BENEDEN
          VERLUCHTEN AUB' }}"
        melding_tekst: '{% set m = states(''sensor.woning_hvac_modus'') %} {% from
          ''ai_formatting.jinja'' import render_melding %} {% set fallback = ''De
          koeling staat aan maar de keukenramen staan nog open! Doe het schuifraam
          en de achterdeur snel dicht.'' if m == ''Koelen'' else (''De verwarming
          staat aan maar de keukenramen staan nog open! Sluit het schuifraam en de
          achterdeur om de warmte binnen te houden.'' if m == ''Verwarmen'' else ''Het
          is buiten ideaal weer! Zet het schuifraam of de achterdeur in de keuken
          open om te verluchten.'') %}

          {{ render_melding(ai_antwoord, fallback) }}'
        prioriteit: Geen
        melding_tag: hvac-status-beneden
        melding_group: huis
    continue_on_error: true
  mode: single
  max_exceeded: silent
