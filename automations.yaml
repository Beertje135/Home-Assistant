- id: '1779959380879'
  alias: 'Energie: Thuisbatterij - Capaciteitstarief Waarschuwing'
  description: Stuurt een AI-notificatie naar de ouders wanneer de Zendure thuisbatterij
    onder de 5% zakt, om pieken in het capaciteitstarief te voorkomen.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.solarflow_2400_ac_electric_level
    below: 6
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.woning_status
      state: Slapen
  - condition: template
    value_template: '{{ states(''input_select.woning_status'') in [''Thuis'', ''Thuis
      Werk'', ''Thuis Verlof'', ''Juist Thuis'', ''Juist Wakker''] }}'
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Thuisbatterij Leeg Waarschuwing
        entity_id: ai_task.google_ai_task
        instructions: '{% from ''ai_formatting.jinja'' import persona, regels %} {{
          persona() }}

          SITUATIE: De Zendure thuisbatterij (SolarFlow 2400) is bijna volledig leeg
          en heeft het kritieke niveau van {{ states(''sensor.solarflow_2400_ac_electric_level'')
          }}% bereikt. Dit betekent dat de batterij vanaf nu GEEN stroompieken meer
          kan opvangen om het Vlaamse capaciteitstarief te beschermen.

          Breng ze hiervan op een alerte, vlotte manier op de hoogte. Waarschuw ze
          kort dat ze moeten opletten met zware verbruikers (zoals oven, airco''s,
          droger, etc.) om een dure piek te vermijden.

          {{ regels() }}'
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "\U0001FAAB Batterij leeg: Let op capaciteitstarief!"
        melding_tekst: '{% from ''ai_formatting.jinja'' import render_melding %} {%
          set niveau = states(''sensor.solarflow_2400_ac_electric_level'') %} {% set
          fallback = ''De thuisbatterij is gezakt naar '' ~ niveau ~ ''%. Let op met
          zware verbruikers (oven, airco, droger) om pieken in het capaciteitstarief
          te voorkomen!'' %}

          {{ render_melding(ai_antwoord, fallback) }}'
        prioriteit: Geen
        melding_tag: energie-batterij-leeg
        melding_group: energy
    continue_on_error: true
  mode: single
  max_exceeded: silent
- id: '1779962284052'
