- id: '1760420793193'
  alias: Weerbericht - Kinderen - Notificatie
  description: Stuurt 's ochtends kledingadvies voor Trix en Elmo via AI en slaat
    de samenvatting op voor het display. Loopt via het centrale notificatiescript.
  triggers:
  - trigger: time
    at: 07:50:00
    id: werkdag
  - trigger: time
    at: 08:30:00
    id: weekend
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: werkdag
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
    - condition: and
      conditions:
      - condition: trigger
        id: weekend
      - condition: time
        weekday:
        - sat
        - sun
  actions:
  - variables:
      huidige_datum: '{{ now().strftime(''%d-%m-%Y'') }}'
      forecast_data: "{% set forecast = state_attr('sensor.pirate_weather_daily',
        'forecast') %} {% if forecast and forecast[0] is defined %}\n  {% set f =
        forecast[0] %}\n  Weerbeeld: {{ f.condition }}, Max Temp: {{ f.temperature
        }} graden Celsius, Min Temp: {{ f.templow }} graden Celsius, Regenbuien kans:
        {{ f.precipitation_probability }}{{ '%' }}\n{% else %}\n  GEEN_DATA\n{% endif
        %}"
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Weerbericht kindjes
      entity_id: ai_task.google_ai_task
      instructions: 'Je bent een vrolijke weerslezer speciaal voor kinderen. Vertel
        kort en enthousiast wat voor weer het VANDAAG wordt voor Elmo (jongen, 2018)
        en Trix (meisje, 2022). Datum: {{ huidige_datum }}.

        Geef een specifiek advies over of ze een dikke jas, dunne jas of geen jas
        aan moeten, en of een paraplu nodig is. Onthoud: Elmo wil het liefst altijd
        een korte broek aan boven de 0 graden, maar herinner hem er op een grappige
        manier aan dat dat niet altijd een goed idee is!

        MAXIMAAL 250 tekens (HEEL BELANGRIJK voor het display).

        WEERGEGEVENS VOOR VANDAAG: {{ forecast_data }}

        Als er hierboven ''GEEN_DATA'' staat, maak er dan zelf een vrolijke verrassing
        van maar meld op een grappige manier dat het weerstation gek doet (bijvoorbeeld
        dat het gehaktballen regent)!

        STRIKTE FORMATTERING REGELS: 1. Geef DIRECT de tekst van de weersamenvatting.
        Typ GEEN introductie. 2. Gebruik NOOIT Markdown-opmaak. Gebruik GEEN sterretjes
        (**) voor vetgedrukte tekst.  3. De output moet pure, schone platte tekst
        zijn die direct in een pushnotificatie en TTS past.'
    response_variable: ai_antwoord
  - action: input_text.set_value
    target:
      entity_id: input_text.weer_samenvatting
    data:
      value: "{% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
        is defined and ai_antwoord.data | trim != \"\" %} {% if ai_beschikbaar %}\n
        \ {{ ai_antwoord.data[:250] }}\n{% else %}\n  [Lokaal] Geen live weerbericht
        beschikbaar. Kijk even naar buiten!\n{% endif %}"
    continue_on_error: true
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Weerbericht voor de kids \U0001F324️"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %}  {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          {% set forecast = state_attr('sensor.pirate_weather_daily', 'forecast')
          %}\n  {% if forecast and forecast[0] is defined %}\n    {% set f = forecast[0]
          %}\n    Goedemorgen Elmo en Trix! Vandaag wordt het {{ f.temperature }}
          graden. {% if f.temperature | float < 12 %}Doe maar een dikke jas aan!{%
          elif f.temperature | float < 18 %}Een dunne jas is perfect vandaag.{% else
          %}Geen jas nodig!{% endif %} {% if f.precipitation_probability | float >
          40 %}En neem voor de zekerheid een paraplu mee!{% endif %} En Elmo: geen
          korte broek vandaag!\n  {% else %}\n    Goedemorgen! Het weerstation doet
          een beetje gek vandaag. Kijk goed naar buiten om te zien welke jas je nodig
          hebt!\n  {% endif %}\n{% endif %}"
        prioriteit: Geen
        melding_tag: weer-status
        melding_group: huis
        click_url: /lovelace/favorieten
    continue_on_error: true
  mode: single
  max_exceeded: silent
- id: '1760632735300'
  alias: Slaaptijd Elmo - Notificatie
  description: 'Start de ochtend/avondroutine voor Elmo''s slaapritueel (boekje &
    papje):  AI weetje via HomePod en pushnotificatie naar ouders via het centrale
    script.'
  triggers:
  - trigger: state
    entity_id: schedule.slapen_elmo
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Slaaptijd Elmo
      entity_id: ai_task.google_ai_task
      instructions: 'Je bent een enthousiaste omroeper. Spreek Elmo (7 jaar) direct
        toe. Hij is al volwassen voor zijn leeftijd, dus zeg NOOIT kleine jongen aub.
        Vertel hem dat het tijd is om zich klaar te maken voor bed & Geef hem elke
        dag een ander, leuk weetje mee over natuur, wetenschap of pokemon! Maak het
        vrolijk, een beetje grappig en beperk je tot maximaal 3 zinnen.

        STRIKTE FORMATTERING REGELS: 1. Geef DIRECT de tekst van de melding. Typ GEEN
        introductie zoals "Hier is de melding:" of "Oké, ik heb dit gemaakt:". 2.
        Gebruik NOOIT Markdown-opmaak. Gebruik GEEN sterretjes (**) voor vetgedrukte
        tekst.  3. De output moet pure, schone platte tekst zijn die direct via TTS
        uitgesproken kan worden.'
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Bedtijd voor Elmo \U0001F319"
        melding_tekst: Het is tijd voor Elmo om te gaan slapen.
        spraak_boodschap: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %}  {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          Attentie Elmo! Het is tijd om je klaar te maken voor bed. Tijd voor een
          boekje en je papje!\n{% endif %}"
        prioriteit: Geen
        melding_tag: kids-status
        melding_group: huis
    continue_on_error: true
  mode: single
  max_exceeded: silent
- id: '1764674501249'
  alias: 'Personen: Zones (Thuis) - Laatste persoon vertrekt'
  description: Activeert het AI-notificatiescript met specifieke prioriteit voor de
    laatste bewoner die het huis verlaat.
  triggers:
  - trigger: zone
    entity_id: device_tracker.iphone_van_bert
    zone: zone.home
    event: leave
    id: bert_vertrekt
  - trigger: zone
    entity_id: device_tracker.iphone_van_caroline
    zone: zone.home
    event: leave
    id: caroline_vertrekt
  conditions:
  - condition: state
    entity_id: group.bewoners_tracker
    state: not_home
  actions:
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Vertrek Woning Check
      entity_id: ai_task.google_ai_task
      instructions: 'Je bent Siri, de slimme huismeester van Bert en Caroline. Ze
        hebben zojuist allemaal de woning verlaten. Geef een kort, vlot en ietwat
        grappig overzicht van de status van het huis op basis van de meegegeven data.
        Als er ramen/deuren open staan, vermeld dit dan specifiek en al zeker als
        het gaat regenen in de komende uren  of heel warm gaat worden (bijv. "Vergeet
        de achterdeur niet!"). Als alles perfect in orde is, wens ze dan een fijne
        reis!

        HUIDIGE STATUS VAN HET HUIS: - Woning status: {{ states(''input_select.woning_status'')
        }} - Schuifraam keuken: {{ states(''binary_sensor.aqara_raamsensor_1'') }}
        - Raam Trix: {{ states(''binary_sensor.aqara_raamsensor_2'') }} - Raam Elmo:
        {{ states(''binary_sensor.aqara_raamsensor_3'') }} - Raam Zolder: {{ states(''binary_sensor.aqara_raamsensor_4'')
        }} - Achterdeur: {{ states(''binary_sensor.aqara_raamsensor_5'') }} - Voordeur:
        {{ states(''binary_sensor.aqara_raamsensor_6'') }} - Raam Badkamer: {{ states(''binary_sensor.ewelink_ds01_01_opening'')
        }}

        AANWEZIGHEID & AFSTANDEN: - Status Bert: {{ states(''person.bert'') }} (Afstand:
        {{ states(''sensor.home_bert_afstand'') }} km) - Status Caroline: {{ states(''person.caroline'')
        }} (Afstand: {{ states(''sensor.home_caroline_afstand'') }} km) - Bezoekers-modus:
        {{ states(''binary_sensor.bezoek'') }} - Dichtstbijzijnde apparaat: {{ states(''sensor.home_nearest_device'')
        }}

        WEERGEGEVENS: - Huidig weerbeeld: {{ states(''sensor.pirate_weather_hourly'')
        }} - Algemene voorspelling vandaag: {{ states(''sensor.pirate_weather_daily'')
        }} - Verwachting komend uur: {{ state_attr(''sensor.pirate_weather_hourly'',
        ''forecast'')[1].condition | default(''Onbekend'') }} - Temperatuur komend
        uur: {{ state_attr(''sensor.pirate_weather_hourly'', ''forecast'')[1].temperature
        | default(''Onbekend'') }}°C - Kans op neerslag komend uur: {{ state_attr(''sensor.pirate_weather_hourly'',
        ''forecast'')[1].precipitation_probability | default(''0'') }}%

        STRIKTE FORMATTERING REGELS: 1. Geef DIRECT de tekst van de melding. Typ GEEN
        introductie. 2. Gebruik NOOIT Markdown-opmaak. Gebruik GEEN sterretjes (**).  3.
        De output moet pure, schone platte tekst zijn die direct in een pushnotificatie
        past.'
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "\U0001F697 Tot snel! - Status Check"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %} {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          Iedereen heeft het huis verlaten. Vergeet niet te controleren of alle ramen
          en deuren goed dicht zijn!\n{% endif %}"
        prioriteit: "{% if trigger.id == 'bert_vertrekt' %}\n  Bert Kritiek\n{% elif
          trigger.id == 'caroline_vertrekt' %}\n  Caroline Kritiek\n{% else %}\n  Kritiek\n{%
          endif %}"
        melding_tag: vertrek-woning-check
        melding_group: huis
    continue_on_error: true
  mode: queued
  max: 5
  max_exceeded: silent
- id: climate_solar_preheat_bedrooms_v2
  alias: 'HVAC: Zonne-energie: Airco''s Centraal AAN'
  description: Stuurt de airco's van de zolder en de kinderkamers (Elmo en Trix) individueel
    aan bij zonne-overschot zodra de Zendure batterij vol is, op basis van hun eigen
    kamertemperatuur en ingestelde doeltemperatuur.
  triggers:
  - trigger: time_pattern
    minutes: /15
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: sensor.woning_hvac_modus
      state: Verwarmen
    - condition: state
      entity_id: sensor.woning_hvac_modus
      state: Koelen
  - condition: numeric_state
    entity_id: sensor.solarflow_2400_ac_electric_level
    above: 95
  - condition: numeric_state
    entity_id: sensor.solaredge_current_power
    above: 1300
  - condition: numeric_state
    entity_id: sensor.elektriciteit_meter_p1_vermogen
    below: -1000
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.woning_status
      state: Slapen
    alias: Check Woning Status
  - condition: template
    value_template: "{% set modus = states('sensor.woning_hvac_modus') %}\n{# Check
      Slaapkamer Zolder #} {% set zolder_set = state_attr('climate.airco_slaapkamer',
      'temperature') | float(0) %} {% set zolder_nodig = is_state('binary_sensor.aqara_raamsensor_4',
      'off') and \n                      ((modus == 'Verwarmen' and zolder_set !=
      21) or \n                       (modus == 'Koelen' and zolder_set != 18)) %}\n\n{#
      Check Elmo #} {% set elmo_set = state_attr('climate.airco_elmo', 'temperature')
      | float(0) %} {% set elmo_nodig = is_state('binary_sensor.aqara_raamsensor_3',
      'off') and is_state('schedule.slapen_elmo', 'off') and \n                    ((modus
      == 'Verwarmen' and elmo_set != 21) or \n                     (modus == 'Koelen'
      and elmo_set != 18)) %}\n\n{# Check Trix #} {% set trix_set = state_attr('climate.airco_trix',
      'temperature') | float(0) %} {% set trix_nodig = is_state('binary_sensor.aqara_raamsensor_2',
      'off') and is_state('schedule.slapen_trix', 'off') and \n                    ((modus
      == 'Verwarmen' and trix_set != 21) or \n                     (modus == 'Koelen'
      and trix_set != 18)) %}\n\n{# Laat de automatisering alleen door als minstens
      één kamer de juiste setpoint nog NIET heeft #} {{ zolder_nodig or elmo_nodig
      or trix_nodig }}"
  actions:
  - if:
    - condition: state
      entity_id: binary_sensor.aqara_raamsensor_4
      state: 'off'
    - condition: template
      value_template: '{% set modus = states(''sensor.woning_hvac_modus'') %} {% set
        zolder_set = state_attr(''climate.airco_slaapkamer'', ''temperature'') | float(0)
        %} {{ (modus == ''Verwarmen'' and zolder_set != 21) or (modus == ''Koelen''
        and zolder_set != 18) }}'
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.airco_slaapkamer
      data:
        hvac_mode: '{{ ''heat'' if is_state(''sensor.woning_hvac_modus'', ''Verwarmen'')
          else ''cool'' }}'
    - action: climate.set_temperature
      target:
        entity_id: climate.airco_slaapkamer
      data:
        temperature: '{{ 21 if is_state(''sensor.woning_hvac_modus'', ''Verwarmen'')
          else ''18'' }}'
    - variables:
        zolder_gestart: true
  - if:
    - condition: state
      entity_id: binary_sensor.aqara_raamsensor_3
      state: 'off'
    - condition: state
      entity_id: schedule.slapen_elmo
      state: 'off'
    - condition: template
      value_template: '{% set modus = states(''sensor.woning_hvac_modus'') %} {% set
        elmo_set = state_attr(''climate.airco_elmo'', ''temperature'') | float(0)
        %} {{ (modus == ''Verwarmen'' and elmo_set != 21) or (modus == ''Koelen''
        and elmo_set != 18) }}'
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.airco_elmo
      data:
        hvac_mode: '{{ ''heat'' if is_state(''sensor.woning_hvac_modus'', ''Verwarmen'')
          else ''cool'' }}'
    - action: climate.set_temperature
      target:
        entity_id: climate.airco_elmo
      data:
        temperature: '{{ 21 if is_state(''sensor.woning_hvac_modus'', ''Verwarmen'')
          else ''18'' }}'
    - if:
      - condition: state
        entity_id: sensor.woning_hvac_modus
        state: Verwarmen
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.elmo
        data:
          hvac_mode: 'off'
    - variables:
        elmo_gestart: true
  - if:
    - condition: state
      entity_id: binary_sensor.aqara_raamsensor_2
      state: 'off'
    - condition: state
      entity_id: schedule.slapen_trix
      state: 'off'
    - condition: template
      value_template: '{% set modus = states(''sensor.woning_hvac_modus'') %} {% set
        trix_set = state_attr(''climate.airco_trix'', ''temperature'') | float(0)
        %} {{ (modus == ''Verwarmen'' and trix_set != 21) or (modus == ''Koelen''
        and trix_set != 18) }}'
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.airco_trix
      data:
        hvac_mode: '{{ ''heat'' if is_state(''sensor.woning_hvac_modus'', ''Verwarmen'')
          else ''cool'' }}'
    - action: climate.set_temperature
      target:
        entity_id: climate.airco_trix
      data:
        temperature: '{{ 21 if is_state(''sensor.woning_hvac_modus'', ''Verwarmen'')
          else ''18'' }}'
    - if:
      - condition: state
        entity_id: sensor.woning_hvac_modus
        state: Verwarmen
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.trix
        data:
          hvac_mode: 'off'
    - variables:
        trix_gestart: true
  - if:
    - condition: template
      value_template: '{{ zolder_gestart is defined or elmo_gestart is defined or
        trix_gestart is defined }}'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Universele Notificatie Klimaat Alle Kamers
        entity_id: ai_task.google_ai_task
        instructions: 'Je bent Siri, een gevatte en behulpzame huisassistent voor
          Bert en Caroline. Meld dat we wegens zonne-overschot (opbrengst: {{ states(''sensor.solaredge_current_power'')
          }}W) en een volle thuisbatterij, de volgende kamers GRATIS aan het {{ ''voorverwarmen''
          if is_state(''sensor.woning_hvac_modus'', ''Verwarmen'') else ''voorkoelen''
          }} zijn met de airco: {% if zolder_gestart is defined %}- De Slaapkamer
          op Zolder {% endif %} {% if elmo_gestart is defined %}- De kamer van Elmo
          {% endif %} {% if trix_gestart is defined %}- De kamer van Trix {% endif
          %} Houd het bericht kort, vlot en compact (maximaal 2 zinnen, perfect voor
          iPhone en HomePod). Nooit Markdown (geen sterretjes) gebruiken.'
      response_variable: ai_antwoord
    - action: script.turn_on
      target:
        entity_id: script.centraal_universele_notificatie_spraak
      data:
        variables:
          melding_titel: ☀️ Zonne-klimaat Update
          melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
            'on') %} {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
            is defined and ai_antwoord.data | trim != \"\" %} {% if not lokale_modus
            and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
            Airco's boven worden slim aangestuurd op basis van gratis zonne-energie.\n{%
            endif %}"
          prioriteit: Geen
          melding_tag: solar-heating-status
      continue_on_error: true
  mode: single
- id: '1777019809055'
  alias: 'HVAC: Zonne-energie: Airco''s Centraal UIT'
  description: Schakelt de zonne-sturing van ALLE airco's (Elmo, Trix en Slaapkamer
    Zolder) uit  zodra de omstandigheden wijzigen of er stroomtekort is, en herstelt
    de Evohome voor de kinderen indien nodig.
  triggers:
  - trigger: state
    entity_id: input_select.woning_status
    to: Slapen
  - trigger: state
    entity_id: input_select.woning_status
    to: Op Vakantie
  - trigger: state
    entity_id: sensor.woning_hvac_modus
    to: Verluchten
  - trigger: numeric_state
    entity_id:
    - sensor.elektriciteit_meter_p1_vermogen
    for:
      minutes: 10
    above: 2000
  conditions:
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_elmo
        state: 'off'
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_trix
        state: 'off'
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_slaapkamer
        state: 'off'
  actions:
  - action: climate.set_hvac_mode
    target:
      entity_id:
      - climate.airco_trix
      - climate.airco_elmo
      - climate.airco_slaapkamer
    data:
      hvac_mode: 'off'
  - if:
    - condition: state
      entity_id: sensor.woning_hvac_modus
      state: Verwarmen
    then:
    - if:
      - condition: template
        value_template: '{{ states(''binary_sensor.aqara_raamsensor_3'') in [''off'',
          ''unavailable''] }}'
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.elmo
        data:
          hvac_mode: heat
    - if:
      - condition: template
        value_template: '{{ states(''binary_sensor.aqara_raamsensor_2'') in [''off'',
          ''unavailable''] }}'
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.trix
        data:
          hvac_mode: heat
  mode: single
- id: energy_high_baseload_warning
  alias: 'Energie: Hoog Sluimerverbruik Melding'
  description: Waarschuwt als het verbruik tijdens het slapen te hoog blijft.
  triggers:
  - entity_id:
    - sensor.huis_verbruik_actueel
    above: 500
    for:
      minutes: 30
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: input_select.woning_status
    state: Slapen
  actions:
  - action: ai_task.generate_data
    data:
      task_name: Universele Notificatie
      entity_id: ai_task.google_ai_task
      instructions: "Je bent Siri, een gevatte huisassistent. De woning staat op 'Slapen',
        \ maar het stroomverbruik is al 30 minuten boven de 500 Watt  (huidig verbruik:
        {{ states('sensor.huis_verbruik_actueel') }}W).  Vraag Bert of Caroline subtiel
        of ze vergeten zijn iets uit te zetten,  zoals de oven, een tv of een zwaar
        apparaat.  Houd het kort en alert.\nSTRIKTE FORMATTERING REGELS:\n1. Geef
        DIRECT de tekst van de melding. Typ GEEN introductie zoals \"Hier is de melding:\"
        of \"Oké, ik heb dit gemaakt:\".\n2. Gebruik NOOIT Markdown-opmaak. Gebruik
        GEEN sterretjes (**) voor vetgedrukte tekst. \n3. De output moet pure, schone
        platte tekst zijn die direct in een pushnotificatie past."
    response_variable: ai_antwoord
    continue_on_error: true
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: ⚠️ Hoog Sluimerverbruik
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %} {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n  \n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          Het verbruik is te hoog tijdens de nacht!!\n{% endif %}"
        prioriteit: Push Alleen
        melding_tag: high-baseload-warning
        melding_group: energy
  mode: single
- id: alert_water_leakage_detected
  alias: 'Security: Waterlek Waarschuwing'
  description: Stuurt een melding als het waterverbruik 1 uur lang actief is. Voorkomt
    valse meldingen bij het vullen van een bad of douchen.
  triggers:
  - trigger: state
    entity_id: sensor.water_meter
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.water_meter'') | float(0) > 0 }}'
  - condition: template
    value_template: "{% set log = states.sensor.water_meter %} {% if log is not none
      and log.last_changed is not none %}\n  {{ (as_timestamp(now()) - as_timestamp(log.last_changed))
      < 900 }}\n{% else %}\n  false\n{% endif %}"
    alias: Is er momenteel actief verbruik?
  - condition: template
    value_template: "{% if this.attributes.last_triggered is not none %}\n  {{ (as_timestamp(now())
      - as_timestamp(this.attributes.last_triggered)) > 3300 }}\n{% else %}\n  true\n{%
      endif %}"
    alias: Is het langer dan 55 minutes geleden dat deze melding voor het laatst mocht
      lopen?
  actions:
  - variables:
      huidig_dagverbruik: '{{ states(''sensor.water_meter'') }}'
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Waterlek Alarmsignaal
      entity_id: ai_task.google_ai_task
      instructions: Je bent Siri. Er is een mogelijk waterlek gedetecteerd! De watermeter
        registreert al een uur lang non-stop waterverbruik zonder rustmoment. Het
        totale verbruik voor vandaag staat inmiddels al op {{ huidig_dagverbruik }}
        kubieke meter. Waarschuw Bert en Caroline dringend dat er waarschijnlijk een
        lek is of een toilet blijft lopen. Maximaal 2 zinnen.
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "\U0001F4A7 Mogelijk waterlek gedetecteerd!"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %}  {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %} {% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal
          Dringend] Het waterverbruik is al een uur lang onafgebroken actief (Dagstand:
          {{ huidig_dagverbruik }} m³). Controleer direct op lekken of openstaande
          kranen!\n{% endif %}"
        prioriteit: Kritiek
        melding_tag: water-leak-alarm
        melding_group: beveiliging
    continue_on_error: true
  mode: single
  max_exceeded: silent
- id: alert_gas_leak_smart_check
  alias: 'Security: Gas Alarm (Check via Stilstand)'
  description: Kritiek alarm als de gasmeter oploopt terwijl de verwarmingzones  en
    de watermeter (warm water) stilstaan. Loopt via het centrale script.
  triggers:
  - trigger: state
    entity_id: sensor.gas_meter
  conditions:
  - alias: Gasmeter is onlangs nog gewijzigd
    condition: template
    value_template: '{{ (as_timestamp(now()) - as_timestamp(trigger.entity_id.last_updated
      | default(now()))) < 900 }}'
  - alias: Alle Evohome zones staan uit en zijn online
    condition: template
    value_template: "{% set zones = [\n  states.climate.keuken, states.climate.woonkamer,
      states.climate.badkamer,\n  states.climate.dressing, states.climate.elmo, states.climate.trix,
      states.climate.slaapkamer\n] %} {% set aan_het_verwarmen = zones | selectattr('state',
      'eq', 'heat') | list | count %} {% set onbereikbaar = zones | selectattr('state',
      'eq', 'unavailable') | list | count %} {{ aan_het_verwarmen == 0 and onbereikbaar
      == 0 }}"
  - alias: Watermeter staat stil (geen warm water vraag)
    condition: template
    value_template: '{{ (as_timestamp(now()) - as_timestamp(states.sensor.water_meter.last_changed
      | default(0))) > 600 }}'
  actions:
  - variables:
      actuele_gasstand: '{{ states(''sensor.gas_meter'') }}'
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Gaslek Alarmsignaal
      entity_id: ai_task.google_ai_task
      instructions: 'Je bent Siri. Er is een ONVERWACHT en potentieel gevaarlijk gasverbruik
        gedetecteerd!  De centrale verwarming en het warme water staan volledig uit,
        maar de gasmeter loopt toch op. Aktuele stand: {{ actuele_gasstand }}. Waarschuw
        Bert en Caroline onmiddellijk om te controleren op een gaslucht of een gasfornuis
        dat per ongeluk open is blijven staan.

        Richtlijn: Houd de boodschap kort, uiterst urgent, serieus en dwingend. Maximaal
        2 zinnen.

        STRIKTE FORMATTERING REGELS: 1. Geef DIRECT de tekst van de melding. Typ GEEN
        introductie. 2. Gebruik NOOIT Markdown-opmaak. Gebruik GEEN sterretjes (**)
        voor vetgedrukte tekst.  3. De output moet pure, schone platte tekst zijn
        die direct in een pushnotificatie en TTS past.'
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "\U0001F6A8 GAS ALARM: ONVERWACHT VERBRUIK"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %}  {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal
          Dringend] Gevaar! Onverwacht gasverbruik gedetecteerd (Meterstand: {{ actuele_gasstand
          }}). De verwarming en het warme water staan uit. Controleer direct op gaslucht
          of het fornuis!\n{% endif %}"
        prioriteit: Kritiek
        melding_tag: gas-leak-urgent
        melding_group: beveiliging
    continue_on_error: true
  mode: single
  max_exceeded: silent
- id: '1777657887100'
  alias: 'HVAC: Verwarming - Bepaal Zon-blokkade (Pirate Weather + Solar)'
  description: Zet de zon-blokkade aan op basis van middagtemperatuur en zonne-opbrengst
    en stuurt direct de verwarming aan.
  triggers:
  - trigger: time
    at: 03:00:00
  - trigger: time
    at: 07:00:00
  - trigger: time
    at: '10:00:00'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{% set zon = states('sensor.energy_production_today') | float(0)
          %}\n{# 1. Max temperatuur van vandaag ophalen uit de DAILY sensor #} {%
          set temp_max = state_attr('sensor.pirate_weather_daily', 'forecast')[0].temperature
          | float(0) if state_attr('sensor.pirate_weather_daily', 'forecast') else
          0 %}\n{# 2. De temperatuur van exact 11:00 uur zoeken in de HOURLY sensor
          #} {% set ns = namespace(temp_11u=0) %} {% if state_attr('sensor.pirate_weather_hourly',
          'forecast') is not none %}\n  {% for uur in state_attr('sensor.pirate_weather_hourly',
          'forecast') %}\n    {% if uur.datetime.startswith(now().strftime('%Y-%m-%d')
          ~ 'T11:') %}\n      {% set ns.temp_11u = uur.temperature | float(0) %}\n
          \   {% endif %}\n  {% endfor %}\n{% endif %}\n{# Check of aan de voorwaarden
          wordt voldaan #} {{ zon > 15 and temp_max >= 20 and ns.temp_11u >= 15 }}"
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.zon_verwarming_blokkade
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heating
    default:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.zon_verwarming_blokkade
  mode: single
- id: '1778955303858'
  alias: 'Zendure: Capaciteitstarief - Activeer Piek Shaving'
  description: Verlaag de batterijreserve naar 5% bij een hoge piek om het net te
    ontlasten.
  triggers:
  - entity_id: sensor.elektriciteit_meter_p1_vermogen
    above: 2400
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: input_boolean.piek_verbruik_alert
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.piek_verbruik_alert
  - action: number.set_value
    target:
      entity_id: number.solarflow_2400_ac_min_soc
    data:
      value: 5
  mode: single
- id: '1778955417727'
  alias: 'Zendure: Capaciteitstarief - Herstel Reserve'
  description: Zet de batterijreserve terug naar 15% als de piek stabiel voorbij is.
  triggers:
  - entity_id: sensor.elektriciteit_meter_p1_vermogen
    below: 1500
    for:
      minutes: 3
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: input_boolean.piek_verbruik_alert
    state: 'on'
  actions:
  - action: number.set_value
    target:
      entity_id: number.solarflow_2400_ac_min_soc
    data:
      value: 15
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.piek_verbruik_alert
  mode: single
- id: '1779259588768'
  alias: 'Herinneringen: Vuilbakken - Centraal Afvalritueel'
  description: Combineert ochtendcheck (ontwaken), avondritueel en de thuiskomst van
    Bert in één slimme automatisering.
  triggers:
  - trigger: state
    entity_id: input_select.woning_status
    from: Juist Wakker
    id: ochtend
  - trigger: time
    at: '20:30:00'
    id: avond_of_thuiskomst
  - trigger: state
    entity_id: input_select.woning_status
    from: Juist Thuis
    to:
    - Thuis
    - Thuis Werk
    - Thuis Verlof
    id: avond_of_thuiskomst
  - trigger: state
    entity_id: person.bert
    to: home
    id: bert_thuis
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id: ochtend
    - condition: trigger
      id: bert_thuis
    - condition: state
      entity_id: input_select.woning_status
      state:
      - Juist Thuis
      - Thuis
      - Thuis Werk
      - Thuis Verlof
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: ochtend
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.recycleapp_glas
          attribute: Days_until
          below: 1
        - condition: numeric_state
          entity_id: sensor.recycleapp_papier
          attribute: Days_until
          below: 1
        - condition: numeric_state
          entity_id: sensor.recycleapp_pmd
          attribute: Days_until
          below: 1
        - condition: numeric_state
          entity_id: sensor.recycleapp_restafval
          attribute: Days_until
          below: 1
    - condition: and
      conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: avond_of_thuiskomst
        - condition: trigger
          id: bert_thuis
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.recycleapp_glas
          attribute: Days_until
          above: 0
          below: 2
        - condition: numeric_state
          entity_id: sensor.recycleapp_papier
          attribute: Days_until
          above: 0
          below: 2
        - condition: numeric_state
          entity_id: sensor.recycleapp_pmd
          attribute: Days_until
          above: 0
          below: 2
        - condition: numeric_state
          entity_id: sensor.recycleapp_restafval
          attribute: Days_until
          above: 0
          below: 2
  actions:
  - if:
    - condition: trigger
      id: bert_thuis
    then:
    - wait_for_trigger:
      - trigger: state
        entity_id: device_tracker.router_iphone_bert
        to: home
      continue_on_timeout: false
      timeout: 00:05:00
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Afval Status Master
      entity_id: ai_task.google_ai_task
      instructions: "Je bent Siri, de vrolijke huisassistent. Vertel de bewoners of
        het bezoek welk afval vandaag of morgen buiten moet.\nMOMENT VAN DE MELDING:
        De automatisering is getriggerd in de context van: \"{{ trigger.id }}\". -
        Als de context \"ochtend\" is: wens Bert een goedemorgen en herinner hem er
        specifiek aan dat de vuilbak VANDAAG nog buiten moet. - Als de context \"bert_thuis\"
        is: heet Bert specifiek welkom thuis en herinner hem er direct aan dat hij
        (vóór hij in de zetel ploft) nog afval moet buitenzetten. - Als de context
        \"avond_of_thuiskomst\" is: breng hen (Bert, Caroline en eventueel bezoek)
        gezellig op de hoogte voor vanavond/morgen.\nDATA RECYCLEAPP (Aantal dagen
        tot ophaling): - Papier: {{ state_attr('sensor.recycleapp_papier', 'Days_until')
        }} dagen - Glas: {{ state_attr('sensor.recycleapp_glas', 'Days_until') }}
        dagen - PMD: {{ state_attr('sensor.recycleapp_pmd', 'Days_until') }} dagen
        - Restafval: {{ state_attr('sensor.recycleapp_restafval', 'Days_until') }}
        dagen\nREGELS: - Een afvalsoort moet pas buiten als het \"0 dagen\" (vandaag)
        of \"1 dag\" (morgen) is. - Noem alleen het afval dat effectief vandaag of
        morgen wordt opgehaald. - Maak het grappig (bijvoorbeeld over stinkende zakken
        of dat Bert moet sjouwen). - Houd het kort voor een iOS notificatie.\nCONTEXT:
        - Status thuis: Bert ({{ states('person.bert') }}), Caroline ({{ states('person.caroline')
        }}), Bezoek actief: {{ states('binary_sensor.bezoek') }}. - Het is nu {{ now().strftime('%A
        %d %B %H:%M') }}.\nSTRIKTE FORMATTERING REGELS:\n1. Geef DIRECT de tekst van
        de melding. Typ GEEN introductie zoals \"Hier is de melding:\" of \"Oké, ik
        heb dit gemaakt:\".\n2. Gebruik NOOIT Markdown-opmaak. Gebruik GEEN sterretjes
        (**) voor vetgedrukte tekst. \n3. De output moet pure, schone platte tekst
        zijn die direct in een pushnotificatie past."
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Afvalkalender \U0001F5D1️"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %} {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  {% set p
          = state_attr('sensor.recycleapp_papier', 'Days_until') | int(99) %}\n  {%
          set g = state_attr('sensor.recycleapp_glas', 'Days_until') | int(99) %}\n
          \ {% set pmd = state_attr('sensor.recycleapp_pmd', 'Days_until') | int(99)
          %}\n  {% set r = state_attr('sensor.recycleapp_restafval', 'Days_until')
          | int(99) %}\n  \n  ⚠️ [Lokaal] \n  {%- if trigger.id == 'ochtend' -%} Goedemorgen
          Bert! \n  {%- elif trigger.id == 'bert_thuis' -%} Welkom thuis Bert! \n
          \ {%- else -%} Afvalstatus voor vanavond/morgen: \n  {%- endif %} - \n  {%-
          if p in [0, 1] or g in [0, 1] or pmd in [0, 1] or r in [0, 1] -%}\n    Buiten
          zetten: \n    {%- if p == 0 %} Papier (vandaag). {% elif p == 1 %} Papier
          (morgen). {% endif -%}\n    {%- if g == 0 %} Glas (vandaag). {% elif g ==
          1 %} Glas (morgen). {% endif -%}\n    {%- if pmd == 0 %} PMD (vandaag).
          {% elif pmd == 1 %} PMD (morgen). {% endif -%}\n    {%- if r == 0 %} Restafval
          (vandaag). {% elif r == 1 %} Restafval (morgen). {% endif -%}\n  {%- else
          -%}\n    Geen afval vandaag of morgen. Lekker relaxen!\n  {%- endif -%}\n{%
          endif %}"
        prioriteit: '{{ ''Bert'' if trigger.id in [''ochtend'', ''bert_thuis''] else
          ''Geen'' }}'
        melding_tag: afval-status
        melding_group: huis
    continue_on_error: true
  mode: single
- id: '1779260538569'
  alias: 'HVAC: Centraal - Airco''s Beschikbaarheid Check'
  description: Samenvoeging van alle airco-foutmeldingen naar Bert via het centraal
    notificatiescript.
  triggers:
  - trigger: state
    entity_id:
    - climate.airco_elmo
    - climate.airco_trix
    - climate.airco_slaapkamer
    to: unavailable
    id: airco_uitval
  - trigger: state
    entity_id: input_select.woning_status
    to: Juist Thuis
    id: thuiskomst
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: trigger
            id: airco_uitval
          - condition: template
            value_template: '{{ trigger.entity_id == ''climate.airco_elmo'' }}'
        - condition: and
          conditions:
          - condition: trigger
            id: thuiskomst
          - condition: state
            entity_id: climate.airco_elmo
            state: unavailable
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: ⚠️ Airco Status
            melding_tekst: Airco bij Elmo is momenteel niet beschikbaar!
            prioriteit: Bert
            melding_tag: airco-elmo-status
            melding_group: huis
        continue_on_error: true
    - conditions:
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: trigger
            id: airco_uitval
          - condition: template
            value_template: '{{ trigger.entity_id == ''climate.airco_trix'' }}'
        - condition: and
          conditions:
          - condition: trigger
            id: thuiskomst
          - condition: state
            entity_id: climate.airco_trix
            state: unavailable
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: ⚠️ Airco Status
            melding_tekst: Airco 'Trix' is momenteel niet beschikbaar!
            prioriteit: Bert
            melding_tag: airco-trix-status
            melding_group: huis
        continue_on_error: true
    - conditions:
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: trigger
            id: airco_uitval
          - condition: template
            value_template: '{{ trigger.entity_id == ''climate.airco_slaapkamer''
              }}'
        - condition: and
          conditions:
          - condition: trigger
            id: thuiskomst
          - condition: state
            entity_id: climate.airco_slaapkamer
            state: unavailable
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: ⚠️ Airco Status
            melding_tekst: Airco 'Slaapkamer' is momenteel niet beschikbaar!
            prioriteit: Bert
            melding_tag: airco-slaapkamer-status
            melding_group: huis
        continue_on_error: true
  mode: parallel
  max: 10
- id: '1779262620652'
  alias: 'HVAC: Centraal - Noodrem bij Stroompiek'
  description: Zet ALLE airco's direct uit bij een stroompiek boven de 2500W op de
    P1-meter, ongeacht of ze aan het koelen of verwarmen zijn.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.elektriciteit_meter_p1_vermogen
    for:
      minutes: 2
    above: 2500
  conditions:
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_elmo
        state: 'off'
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_trix
        state: 'off'
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_slaapkamer
        state: 'off'
  actions:
  - delay: 00:00:20
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_elmo
        state: 'off'
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.airco_elmo
      data:
        hvac_mode: 'off'
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_trix
        state: 'off'
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.airco_trix
      data:
        hvac_mode: 'off'
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.airco_slaapkamer
        state: 'off'
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.airco_slaapkamer
      data:
        hvac_mode: 'off'
  mode: single
  max_exceeded: silent
- id: '1779263425630'
  alias: 'HVAC: Airco Slaapkamer - Uit'
  description: Schakelt de airco uit bij geopende ramen, statuswijzigingen, bereikte
    temperaturen of vermogenslimieten. Blijft aan tijdens zonne-overschot (gratis
    koelen óf verwarmen).
  triggers:
  - trigger: state
    entity_id: binary_sensor.aqara_raamsensor_4
    to: 'on'
    id: raam_open
  - trigger: state
    entity_id: schedule.heating_attic
    to: 'off'
    id: schema_uit
  - trigger: numeric_state
    entity_id: climate.slaapkamer
    attribute: current_temperature
    above: 21.5
    for: 00:02:00
    id: warm_genoeg
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.airco_slaapkamer
      state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: raam_open
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.airco_slaapkamer
        data:
          hvac_mode: 'off'
      - if:
        - condition: numeric_state
          entity_id: sensor.solarflow_2400_ac_electric_level
          above: 80
        then:
        - action: ai_task.generate_data
          continue_on_error: true
          data:
            task_name: Airco Raam Open Slaapkamer
            entity_id: ai_task.google_ai_task
            instructions: Je bent Siri. Er was gratis zonne-energie beschikbaar, maar
              iemand heeft het raam van de grote slaapkamer opengezet. Meld op een
              plagende manier dat de airco is uitgezet omdat we de buitenlucht niet
              gaan koelen of verwarmen.
          response_variable: ai_antwoord
        - action: script.turn_on
          target:
            entity_id: script.centraal_universele_notificatie_spraak
          data:
            variables:
              melding_titel: "\U0001F32C️ Slaapkamer raam geopend"
              melding_tekst: '{% if ai_antwoord is defined and ai_antwoord.data is
                defined %} {{ ai_antwoord.data }} {% else %} Raam open, airco uit.
                {% endif %}'
              melding_tag: hvac-status-slaapkamer
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Juist Weg
      - condition: numeric_state
        entity_id: climate.slaapkamer
        attribute: current_temperature
        below: 16
      sequence:
      - stop: Airco blijft aan als vorstbeveiliging.
    - conditions:
      - condition: trigger
        id: warm_genoeg
      - condition: state
        entity_id: schedule.heating_attic
        state: 'on'
      sequence:
      - stop: Schema is nog actief, dus niet uitschakelen op temperatuur.
    - conditions:
      - condition: numeric_state
        entity_id: sensor.solarflow_2400_ac_electric_level
        above: 95
      - condition: numeric_state
        entity_id: sensor.solaredge_current_power
        above: 1300
      - condition: numeric_state
        entity_id: sensor.elektriciteit_meter_p1_vermogen
        below: -500
      - condition: or
        conditions:
        - condition: state
          entity_id: sensor.woning_hvac_modus
          state: Koelen
        - condition: state
          entity_id: sensor.woning_hvac_modus
          state: Verwarmen
      sequence:
      - stop: Airco niet uitzetten, we gebruiken gratis zonne-energie!
    default:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.airco_slaapkamer
      data:
        hvac_mode: 'off'
  mode: queued
  max: 5
- id: '1779286173845'
  alias: 'Notificatie: Regenverwachting (Slim)'
  description: Waarschuwt 1x per regenbui als er regen wordt verwacht.
  triggers:
  - trigger: time_pattern
    minutes: /15
  actions:
  - variables:
      forecast: '{{ state_attr(''sensor.pirate_weather_hourly'', ''forecast'') }}'
      f: '{{ forecast[0] if forecast is defined and forecast else {} }}'
      kans: '{{ f.precipitation_probability | int(0) }}'
      hoeveelheid: '{{ f.precipitation | float(0) }}'
      is_regen: '{{ kans > 60 and hoeveelheid >= 0.4 }}'
      slotje: '{{ is_state(''input_boolean.reeds_gewaarschuwd_voor_regen'', ''on'')
        }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_regen and not slotje }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.reeds_gewaarschuwd_voor_regen
      - action: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: "\U0001F327️ Regen op komst"
            melding_tekst: Er wordt voor het komende uur {{ kans }}% kans op regen
              verwacht ({{ hoeveelheid }}mm).
            prioriteit: Push
            melding_tag: weer-waarschuwing
    - conditions:
      - condition: template
        value_template: '{{ not is_regen and slotje }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.reeds_gewaarschuwd_voor_regen
  mode: single
- id: '1779709809010'
  alias: 'HVAC: Centraal - Modus Manager'
  description: Bepaalt ALTIJD de hoofdmodus van de woning (Koelen, Verwarmen of Verluchten)
    op basis van temperatuurverschillen. Schakelt de booleans om; de template-sensor  volgt
    automatisch.
  triggers:
  - trigger: time
    at: 06:00:00
  - trigger: time
    at: '10:00:00'
  - trigger: time
    at: '16:00:00'
  - trigger: state
    entity_id: sensor.hue_sensor_buiten_temperature
  - trigger: state
    entity_id: input_boolean.zon_verwarming_blokkade
  conditions: []
  actions:
  - variables:
      t_buiten: '{{ states(''sensor.hue_sensor_buiten_temperature'') | float(20) }}'
      t_binnen: '{{ state_attr(''climate.ons_huisje'', ''current_temperature'') |
        float(21) }}'
      huidige_modus: '{{ states(''sensor.woning_hvac_modus'') }}'
      berekende_modus: "{% if t_binnen > 22.0 and (t_buiten >= t_binnen or (t_binnen
        - t_buiten) < 3.0) %}\n  Koelen\n{% elif is_state('input_boolean.zon_verwarming_blokkade',
        'off') and not is_state('sensor.season', 'summer') and t_buiten < (t_binnen
        - 1.0) and t_binnen < 21.5 %}\n  Verwarmen\n{% else %}\n  Verluchten\n{% endif
        %}"
  - condition: template
    value_template: '{{ berekende_modus != huidige_modus }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ berekende_modus == ''Koelen'' }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heating
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hvac_koeling_aan_uit
    - conditions:
      - condition: template
        value_template: '{{ berekende_modus == ''Verwarmen'' }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_koeling_aan_uit
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.heating
    default:
    - action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.hvac_koeling_aan_uit
        - input_boolean.heating
- id: '1779712395054'
  alias: 'HVAC: Centraal - Pre-Condition Systeem Manager'
  description: Regelt het klimaat (Evohome bij verwarmen, Airco's bij koelen) wanneer
    het huis wordt voorbereid op de aankomst van de bewoners.
  triggers:
  - trigger: state
    entity_id: input_boolean.pre_heat
    from: 'off'
    to: 'on'
    id: pre_condition_start
  - trigger: state
    entity_id: input_boolean.pre_heat
    from: 'on'
    to: 'off'
    id: pre_condition_stop
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: pre_condition_start
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: sensor.woning_hvac_modus
            state: Verwarmen
          - condition: or
            conditions:
            - condition: state
              entity_id: climate.ons_huisje
              attribute: preset_mode
              state: eco
            - condition: state
              entity_id: climate.ons_huisje
              attribute: preset_mode
              state: away
          sequence:
          - action: evohome.set_system_mode
            data:
              mode: Auto
    - conditions:
      - condition: trigger
        id: pre_condition_stop
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: sensor.woning_hvac_modus
            state: Verwarmen
          - condition: state
            entity_id: input_select.woning_status
            state: Weg
          sequence:
          - action: evohome.set_system_mode
            data:
              mode: AutoWithEco
  mode: single
  max_exceeded: silent
- id: '1779712652338'
  alias: 'HVAC: Centraal - Pre-Condition Trigger Manager'
  description: Activeert de pre-conditioning (verwarmen of koelen) op basis van de
    locatie van Bert en Caroline, en past de notificaties dynamisch aan op het seizoen.
  triggers:
  - trigger: state
    entity_id: person.bert
    to: Mechelen Station
    id: onderweg_normaal
  - trigger: state
    entity_id: person.bert
    to: Willebroek Station
    id: onderweg_normaal
  - trigger: state
    entity_id: person.caroline
    to: Checkpoint 2
    id: onderweg_normaal
  - trigger: state
    entity_id: person.caroline
    to: Checkpoint 4
    id: onderweg_normaal
  - trigger: numeric_state
    entity_id: sensor.home_nearest_distance
    below: 80
    id: onderweg_normaal
  - trigger: numeric_state
    entity_id: sensor.home_nearest_distance
    below: 100
    for: 00:01:00
    id: terug_van_vakantie
  - trigger: state
    entity_id: input_select.woning_status
    to:
    - Thuis
    - Thuis Werk
    - Thuis Verlof
    - Juist Thuis
    - Juist Wakker
    for: 00:01:00
    id: thuis_opruimen
  conditions:
  - condition: state
    entity_id: input_select.woning_status
    state:
    - Op Vakantie
    - Weg
    - Op Vakantie (Bezoek)
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: onderweg_normaal
      - condition: state
        entity_id: input_boolean.pre_heat
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.pre_heat
      - action: ai_task.generate_data
        continue_on_error: true
        data:
          task_name: Pre-Condition Geactiveerd
          entity_id: ai_task.google_ai_task
          instructions: 'Je bent Siri en beheert het klimaat voor Bert en Caroline.
            De pre-conditioning is zojuist automatisch ingeschakeld omdat er iemand
            onderweg is naar huis. HUIDIGE MODUS VAN HET HUIS: {{ states(''sensor.woning_hvac_modus'')
            }} (Verwarmen of Koelen). Als de modus Verwarmen is, vertel ze gezellig
            dat het huis lekker warm zal zijn. Als de modus Koelen is, meld dan fris
            dat de airco''s het huis heerlijk koel maken tegen aankomst. STRIKTE FORMATTERING:
            Pure schone platte tekst, geen markdown, direct de melding starten.'
        response_variable: ai_antwoord
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: "{{ '❄️ Pre-cooling Geactiveerd!' if is_state('sensor.woning_hvac_modus',
              'Koelen') else '\U0001F525 Pre-heat Geactiveerd!' }}"
            melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
              'on') %} {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
              is defined and ai_antwoord.data | trim != \"\" %} {% if not lokale_modus
              and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
              Pre-conditioning is ingeschakeld. Het huis wordt klaargemaakt voor jullie
              aankomst!\n{% endif %}"
            prioriteit: Geen
            melding_tag: hvac-preheat-status
            melding_group: huis
        continue_on_error: true
    - conditions:
      - condition: trigger
        id: terug_van_vakantie
      - condition: state
        entity_id: input_select.woning_status
        state: Op Vakantie
      - condition: state
        entity_id: input_boolean.pre_heat
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.pre_heat
      - action: ai_task.generate_data
        continue_on_error: true
        data:
          task_name: Pre-Condition Vakantie Geactiveerd
          entity_id: ai_task.google_ai_task
          instructions: 'Je bent Siri. Bert en Caroline komen terug van vakantie en
            zijn de 100km grens gepasseerd. HUIDIGE MODUS VAN HET HUIS: {{ states(''sensor.woning_hvac_modus'')
            }}. Heet ze van harte welkom terug. Als het huis op ''Verwarmen'' staat,
            beloof ze een warm nest.  Als het op ''Koelen'' staat, beloof ze een heerlijk
            frisse oase na de warme reis. Geen markdown, direct de tekst.'
        response_variable: ai_antwoord_vakantie
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: "\U0001F9F3 Welkom thuis! (Pre-Condition)"
            melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
              'on') %} {% set ai_beschikbaar = ai_antwoord_vakantie is defined and
              ai_antwoord_vakantie.data is defined and ai_antwoord_vakantie.data |
              trim != \"\" %} {% if not lokale_modus and ai_beschikbaar %}\n  {{ ai_antwoord_vakantie.data
              }}\n{% else %}\n  ⚠️ [Lokaal] Welkom terug! De klimaatregeling is gestart
              om het huis perfect comfortabel te maken.\n{% endif %}"
            prioriteit: Geen
            melding_tag: hvac-preheat-status
            melding_group: huis
        continue_on_error: true
    - conditions:
      - condition: trigger
        id: thuis_opruimen
      - condition: state
        entity_id: input_boolean.pre_heat
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.pre_heat
  mode: single
  max_exceeded: silent
- id: '1779781816149'
  alias: 'HVAC: Centraal - Verwarming Winter Assistant'
  description: Beheert de Evohome verwarming voor Elmo en Trix. Schakelt direct uit
    bij open raam, evalueert escalaties bij langdurige open ramen/kou, en herstelt
    de modus bij sluiting.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.aqara_raamsensor_3
    - binary_sensor.aqara_raamsensor_2
    id: raam_wijziging
  - trigger: state
    entity_id:
    - climate.elmo
    - climate.trix
    to: heat
    for: 00:02:00
    id: verwarming_aangezet
  - trigger: state
    entity_id:
    - binary_sensor.aqara_raamsensor_3
    - binary_sensor.aqara_raamsensor_2
    to: 'on'
    for: 02:00:00
    id: escalatie_waarschuwing
  - trigger: numeric_state
    entity_id:
    - climate.elmo
    - climate.trix
    attribute: current_temperature
    below: 15.5
    id: escalatie_waarschuwing
  conditions:
  - condition: state
    entity_id: sensor.woning_hvac_modus
    state: Verwarmen
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''raam_wijziging'', ''verwarming_aangezet'']
          }}'
      - condition: template
        value_template: "{{ (is_state('binary_sensor.aqara_raamsensor_3', 'on') and
          is_state('climate.elmo', 'heat')) or\n   (is_state('binary_sensor.aqara_raamsensor_2',
          'on') and is_state('climate.trix', 'heat')) }}"
      sequence:
      - if:
        - condition: state
          entity_id: binary_sensor.aqara_raamsensor_3
          state: 'on'
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.elmo
          data:
            hvac_mode: 'off'
      - if:
        - condition: state
          entity_id: binary_sensor.aqara_raamsensor_2
          state: 'on'
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.trix
          data:
            hvac_mode: 'off'
      - action: ai_task.generate_data
        continue_on_error: true
        data:
          task_name: Verwarming Uit Raam Open
          entity_id: ai_task.google_ai_task
          instructions: 'Je bent Siri, de slimme huisassistent. Meld aan Bert en Caroline
            dat de verwarming boven  zojuist automatisch is UITGEZET in de kamer(s)
            waar een raam openstaat  (Elmo open: {{ states(''binary_sensor.aqara_raamsensor_3'')
            }}, Trix open: {{ states(''binary_sensor.aqara_raamsensor_2'') }}). Houd
            het kort, vlot en zonder markdown.'
        response_variable: ai_antwoord_uit
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: ⚠️ Verwarming Uit (Raam Open)
            melding_tekst: '{% set lokale_modus = is_state(''input_boolean.lokale_notificaties'',
              ''on'') %} {% set ai_bes = ai_antwoord_uit is defined and ai_antwoord_uit.data
              is defined and ai_antwoord_uit.data | trim != "" %} {% if not lokale_modus
              and ai_bes %}{{ ai_antwoord_uit.data }}{% else %}⚠️ [Lokaal] Verwarming
              boven uitgezet wegens open raam.{% endif %}'
            prioriteit: Push Alleen
            melding_tag: hvac-status-kamers
            melding_group: huis
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''escalatie_waarschuwing'' }}'
      - condition: template
        value_template: '{{ is_state(''binary_sensor.aqara_raamsensor_2'', ''on'')
          or is_state(''binary_sensor.aqara_raamsensor_3'', ''on'') }}'
      - condition: template
        value_template: '{{ states(''input_select.woning_status'') in [''Thuis'',
          ''Thuis Werk'', ''Thuis Verlof''] }}'
      sequence:
      - action: ai_task.generate_data
        continue_on_error: true
        data:
          task_name: Escalatie Kou Kinderkamers
          entity_id: ai_task.google_ai_task
          instructions: Je bent Siri. Er staat al heel lang een raam open boven (of
            het is kouder dan 15.5 graden). Herinner de bewoners eraan dat de kamers
            nu wel erg koud worden en dat de verwarming pas weer start als de ramen
            toe zijn. Geen markdown, direct en gevat.
        response_variable: ai_antwoord_escalatie
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: "Koude Kinderkamers \U0001F321️"
            melding_tekst: '{% set lokale_modus = is_state(''input_boolean.lokale_notificaties'',
              ''on'') %} {% set ai_bes = ai_antwoord_escalatie is defined and ai_antwoord_escalatie.data
              is defined and ai_antwoord_escalatie.data | trim != "" %} {% if not
              lokale_modus and ai_bes %}{{ ai_antwoord_escalatie.data }}{% else %}⚠️
              [Lokaal] Kamers boven worden te koud. Sluit de ramen om te kunnen verwarmen.{%
              endif %}'
            prioriteit: Geen
            melding_tag: hvac-status-kamers
            melding_group: huis
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''raam_wijziging'' }}'
      - condition: template
        value_template: "{{ (is_state('binary_sensor.aqara_raamsensor_3', 'off') and
          is_state('climate.elmo', 'off')) or\n   (is_state('binary_sensor.aqara_raamsensor_2',
          'off') and is_state('climate.trix', 'off')) }}"
      sequence:
      - if:
        - condition: state
          entity_id: binary_sensor.aqara_raamsensor_3
          state: 'off'
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.elmo
          data:
            hvac_mode: heat
      - if:
        - condition: state
          entity_id: binary_sensor.aqara_raamsensor_2
          state: 'off'
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.trix
          data:
            hvac_mode: heat
      - action: ai_task.generate_data
        continue_on_error: true
        data:
          task_name: Raam Dicht Verwarming Aan
          entity_id: ai_task.google_ai_task
          instructions: Je bent Siri. Er is zojuist een raam gesloten boven. Bevestig
            dat de Evohome verwarming  voor die kamer(s) weer actief is en bedank
            ze vlot. Geen markdown.
        response_variable: ai_antwoord_aan
      - action: script.turn_on
        target:
          entity_id: script.centraal_universele_notificatie_spraak
        data:
          variables:
            melding_titel: "Verwarming Slaapkamers \U0001F321️"
            melding_tekst: '{% set lokale_modus = is_state(''input_boolean.lokale_notificaties'',
              ''on'') %} {% set ai_bes = ai_antwoord_aan is defined and ai_antwoord_aan.data
              is defined and ai_antwoord_aan.data | trim != "" %} {% if not lokale_modus
              and ai_bes %}{{ ai_antwoord_aan.data }}{% else %}⚠️ [Lokaal] Ramen gesloten.
              Verwarming boven volgt weer het normale schema.{% endif %}'
            prioriteit: Push Alleen
            melding_tag: hvac-status-kamers
            melding_group: huis
  mode: single
- id: '1779943993776'
  alias: 'Licht: Kinderen - Wekker Ochtend Centraal'
  description: Wekt Elmo en/of Trix op basis van hun schema's en bundelt de notificaties  naar
    de ouders om overlap te voorkomen.
  triggers:
  - trigger: state
    entity_id: schedule.slapen_elmo
    from: 'on'
    to: 'off'
    id: elmo_trigger
  - trigger: state
    entity_id: schedule.slapen_trix
    from: 'on'
    to: 'off'
    id: trix_trigger
  conditions:
  - condition: state
    entity_id: input_boolean.kids_wekker
    state: 'on'
  - condition: state
    entity_id: input_select.woning_status
    state:
    - Thuis
    - Juist Thuis
    - Thuis Werk
    - Thuis Verlof
  - condition: time
    before: '10:00:00'
  actions:
  - delay: 00:00:05
  - variables:
      elmo_actief: '{{ is_state(''schedule.slapen_elmo'', ''off'') and is_state(''switch.hue_smart_plug_6'',
        ''on'') }}'
      trix_actief: '{{ is_state(''schedule.slapen_trix'', ''off'') and is_state(''switch.hue_smart_plug_5'',
        ''on'') }}'
  - condition: template
    value_template: '{{ elmo_actief or trix_actief }}'
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Wekker Ochtend Kinderen Notificatie
      entity_id: ai_task.google_ai_task
      instructions: "Je bent Siri. Stuur een kort, vlot bericht naar de ouders (Bert
        en Caroline)  om te melden dat de wekroutine start. \nSITUATIE: {% if elmo_actief
        and trix_actief %}\n  Zowel hun kleine jongen (Elmo) als hun kleine meid (Trix)
        moeten nu gewekt worden.\n{% elif elmo_actief %}\n  Hun kleine jongen (Elmo)
        moet nu gewekt worden.\n{% else %}\n  Hun kleine meid (Trix) moet nu gewekt
        worden.\n{% endif %}\nMaak het een tikkeltje ludiek of herkenbaar voor de
        vroege ochtend (max 1 à 2 zinnen).\nSTRIKTE FORMATTERING REGELS: 1. Geef DIRECT
        de tekst van de melding. Geen introducties. 2. Gebruik NOOIT Markdown-opmaak
        (geen sterretjes). 3. De output moet pure, schone platte tekst zijn voor een
        smartphone notificatie."
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: ⏰ Tijd om op te staan!
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %} {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          Het schema is afgelopen. Tijd om {% if elmo_actief and trix_actief %}Elmo
          en Trix{% elif elmo_actief %}Elmo{% else %}Trix{% endif %} te gaan wekken!\n{%
          endif %}"
        prioriteit: Geen
        melding_tag: kids-status
        melding_group: huis
    continue_on_error: true
  - parallel:
    - if:
      - condition: template
        value_template: '{{ elmo_actief }}'
      then:
      - delay: 00:01:02
      - if:
        - condition: state
          entity_id: input_boolean.kids_wekker
          state: 'on'
        - condition: state
          entity_id: light.hue_white_and_color_ambiance_a19_gen2_1
          state: 'off'
        then:
        - action: script.turn_on
          target:
            entity_id: script.light_elmo
      - delay: 00:10:00
      - action: switch.turn_off
        target:
          entity_id: switch.hue_smart_plug_6
    - if:
      - condition: template
        value_template: '{{ trix_actief }}'
      then:
      - delay: 00:01:02
      - if:
        - condition: state
          entity_id: input_boolean.kids_wekker
          state: 'on'
        - condition: state
          entity_id: light.hue_white_and_color_ambiance_a19_gen2_2
          state: 'off'
        then:
        - action: script.turn_on
          target:
            entity_id: script.light_trix
      - delay: 00:10:00
      - action: switch.turn_off
        target:
          entity_id: switch.hue_smart_plug_5
  mode: queued
  max: 10
- id: '1779944162001'
  alias: 'Licht: Kinderen - Alarm Wekker Handmatig Centraal'
  description: Regelt het handmatig wekken van Elmo en/of Trix via hun input_buttons
    en  bundelt de pushnotificaties naar de ouders om overlap te voorkomen.
  triggers:
  - trigger: state
    entity_id: input_button.elmo_alarm
    id: elmo_knop
  - trigger: state
    entity_id: input_button.trix_alarm
    id: trix_knop
  conditions: []
  actions:
  - delay: 00:00:02
  - variables:
      elmo_actief: '{{ has_been_triggered if trigger.id == ''elmo_knop'' else (as_timestamp(now())
        - as_timestamp(states.input_button.elmo_alarm.last_changed) < 5) }}'
      trix_actief: '{{ has_been_triggered if trigger.id == ''trix_knop'' else (as_timestamp(now())
        - as_timestamp(states.input_button.trix_alarm.last_changed) < 5) }}'
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Handmatige Wekker Kinderen Notificatie
      entity_id: ai_task.google_ai_task
      instructions: "Je bent Siri. Stuur een kort, alert bericht naar de ouders (Bert
        en Caroline)  om te bevestigen dat ze zojuist handmatig de wekroutine hebben
        gestart.\nSITUATIE: {% if elmo_actief and trix_actief %}\n  De wekkers voor
        zowel hun kleine jongen (Elmo) als hun kleine meid (Trix) zijn handmatig geactiveerd.\n{%
        elif elmo_actief %}\n  De wekker voor hun kleine jongen (Elmo) is handmatig
        geactiveerd.\n{% else %}\n  De wekker voor hun kleine meid (Trix) is handmatig
        geactiveerd.\n{% endif %}\nMaak het vlot en direct (maximaal 1 à 2 zinnen).\nSTRIKTE
        FORMATTERING REGELS: 1. Geef DIRECT de tekst van de melding. Geen introducties.
        2. Gebruik NOOIT Markdown-opmaak (geen sterretjes). 3. De output moet pure,
        schone platte tekst zijn voor een smartphone notificatie."
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: ⚡ Handmatige wekker gestart
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %} {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          Handmatige wekroutine gestart voor {% if elmo_actief and trix_actief %}Elmo
          en Trix{% elif elmo_actief %}Elmo{% else %}Trix{% endif %}.\n{% endif %}"
        prioriteit: Geen
        melding_tag: kids-status
        melding_group: huis
    continue_on_error: true
  - parallel:
    - if:
      - condition: template
        value_template: '{{ elmo_actief }}'
      then:
      - if:
        - condition: state
          entity_id: light.hue_white_and_color_ambiance_a19_gen2_1
          state: 'off'
        then:
        - action: scene.turn_on
          target:
            entity_id: scene.elmo_ochtend
          data:
            transition: 120
      - delay: 00:05:00
      - action: switch.turn_off
        target:
          entity_id: switch.hue_smart_plug_6
    - if:
      - condition: template
        value_template: '{{ trix_actief }}'
      then:
      - if:
        - condition: state
          entity_id: light.hue_white_and_color_ambiance_a19_gen2_2
          state: 'off'
        then:
        - action: scene.turn_on
          target:
            entity_id: scene.trix_ochtend
          data:
            transition: 60
      - delay: 00:05:00
      - action: switch.turn_off
        target:
          entity_id: switch.hue_smart_plug_5
  mode: queued
  max: 10
- id: '1779958423869'
  alias: 'Computer: Plex Integration Aan/Uit'
  description: Zet de Plex integratie aan of uit via Spook op basis van de computerstatus.
  triggers:
  - trigger: state
    entity_id:
    - switch.wake_on_lan
    to: 'on'
    for:
      hours: 0
      minutes: 2
      seconds: 0
    id: computer_aan
  - trigger: state
    entity_id:
    - switch.wake_on_lan
    to: 'off'
    for:
      hours: 0
      minutes: 2
      seconds: 0
    id: computer_uit
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''computer_aan'' }}'
      sequence:
      - action: homeassistant.enable_config_entry
        data:
          config_entry_id: 3af0f4f786e997822a4409220460b5d2
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''computer_uit'' }}'
      sequence:
      - action: homeassistant.disable_config_entry
        data:
          config_entry_id: 3af0f4f786e997822a4409220460b5d2
  mode: single
- id: '1779959380879'
  alias: 'Energie: Thuisbatterij - Capaciteitstarief Waarschuwing'
  description: Stuurt een AI-notificatie naar de ouders wanneer de Zendure thuisbatterij
    onder de 5% zakt, om pieken in het capaciteitstarief te voorkomen.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.solarflow_2400_ac_electric_level
    below: 6
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.woning_status
      state: Slapen
  - condition: template
    value_template: '{{ states(''input_select.woning_status'') in [''Thuis'', ''Thuis
      Werk'', ''Thuis Verlof'', ''Juist Thuis'', ''Juist Wakker''] }}'
  actions:
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Thuisbatterij Leeg Waarschuwing
      entity_id: ai_task.google_ai_task
      instructions: 'Je bent Siri en beheert de energie in het huis van Bert en Caroline.

        SITUATIE: De Zendure thuisbatterij (SolarFlow 2400) is bijna volledig leeg  en
        heeft het kritieke niveau van {{ states(''sensor.solarflow_2400_ac_electric_level'')
        }}% bereikt.  Dit betekent dat de batterij vanaf nu GEEN stroompieken meer
        kan opvangen om het  Vlaamse capaciteitstarief te beschermen.

        Breng ze hiervan op een alerte, vlotte manier op de hoogte. Waarschuw ze  kort
        dat ze moeten opletten met zware verbruikers (zoals oven, airco''s, droger,
        etc.)  om een dure piek te vermijden.

        STRIKTE FORMATTERING REGELS: 1. Geef DIRECT de tekst van de melding. Typ GEEN
        introductie. 2. Gebruik NOOIT Markdown-opmaak (geen sterretjes voor vetgedrukte
        tekst). 3. De output moet pure, schone platte tekst zijn die geschikt is voor
        een pushnotificatie en HomePod TTS. 4. Hou het voldoende kort voor een iOS
        notificatie en spraaknotificatie via HomePods (maximaal 1 à 2 zinnen).'
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "\U0001FAAB Batterij leeg: Let op capaciteitstarief!"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %} {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          De thuisbatterij is gezakt naar {{ states('sensor.solarflow_2400_ac_electric_level')
          }}%. Let op met zware verbruikers om pieken in het capaciteitstarief te
          voorkomen!\n{% endif %}"
        prioriteit: Geen
        melding_tag: energie-batterij-leeg
        melding_group: huis
    continue_on_error: true
  mode: single
  max_exceeded: silent
