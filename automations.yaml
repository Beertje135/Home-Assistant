- id: '1713760825027'
  alias: Harmony - einde tv avond
  description: Herinnert Bert en Caroline er sarcastisch aan dat het bedtijd is.
  triggers:
  - trigger: time
    at: '21:30:00'
  conditions:
  - condition: state
    entity_id: binary_sensor.bezoek
    state: 'off'
  - condition: or
    conditions:
    - condition: state
      entity_id: input_select.woning_status
      state: Thuis
    - condition: state
      entity_id: input_select.woning_status
      state: Thuis Werk
    - condition: state
      entity_id: input_select.woning_status
      state: Thuis Verlof
