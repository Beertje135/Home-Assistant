  actions:
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "\U0001F680 SERVER UPDATE"
        melding_tekst: Er is een nieuwe update beschikbaar voor Home Assistant.
        prioriteit: Bert Push
        melding_tag: server-update
        melding_group: server
  mode: single
  max_exceeded: silent
- id: homeassistant_004
  alias: 'Systeem: HomeAssistant - Hoge Belasting'
  description: Waarschuwt inclusief de naam van de sensor die boven de 90% komt.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.memory_use_percent
    - sensor.disk_use_percent_home
    - sensor.processor_use
    above: 90
    for:
      hours: 0
      minutes: 1
      seconds: 0
  actions:
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "{% if states('input_select.woning_status') in ['Slapen', 'Op
          Vakantie'] %}\n  ⚠️ SERVER ALERT (Stil)\n{% else %}\n  \U0001F6A8 SERVER
          CRITICAL\n{% endif %}\n"
        melding_tekst: "{% if states('input_select.woning_status') in ['Slapen', 'Op
          Vakantie'] %}\n  Systeembelasting hoog tijdens nacht: {{ trigger.to_state.attributes.friendly_name
          }} ({% if trigger.to_state.state is defined %}{{ trigger.to_state.state
          | replace('%', '') }}{% endif %} procent).\n{% else %}\n  Systeembelasting
          te hoog! Sensor: {{ trigger.to_state.attributes.friendly_name }} ({% if
          trigger.to_state.state is defined %}{{ trigger.to_state.state | replace('%',
          '') }}{% endif %} procent). Controleer de logs.\n{% endif %}\n"
        prioriteit: "{% if states('input_select.woning_status') in ['Slapen', 'Op
          Vakantie'] %}\n  Bert Push\n{% else %}\n  Bert Push\n{% endif %}\n"
        melding_tag: server-alert
  mode: parallel
  max: 3
- id: harmony_001
  alias: 'Harmony: Sync - Hub naar Input Select'
  description: Zorgt dat de dropdown in de UI meeloopt met de fysieke afstandsbediening.
  mode: restart
  trigger:
  - platform: state
    entity_id: remote.harmony_hub
    attribute: current_activity
  condition:
  - condition: not
    conditions:
    - condition: state
      entity_id: remote.harmony_hub
      state: unavailable
  action:
  - action: input_select.select_option
    target:
      entity_id: input_select.harmony_hub
    data:
      option: '{% set activity = state_attr(''remote.harmony_hub'', ''current_activity'')
        %} {{ activity if activity is not none else ''PowerOff'' }}

        '
- id: harmony_002
  alias: 'Harmony: Sync - Input Select naar Hub'
  description: Start de juiste activiteit wanneer je de dropdown in de UI gebruikt.
  mode: single
  trigger:
  - platform: state
    entity_id: input_select.harmony_hub
  condition:
  - condition: not
    conditions:
    - condition: state
      entity_id: remote.harmony_hub
      state: unavailable
  action:
  - action: remote.turn_on
    target:
      entity_id: remote.harmony_hub
    data:
      activity: '{{ states(''input_select.harmony_hub'') }}'
- id: harmony_start_001
  alias: 'Harmony: Auto-Start - TV Avond'
  description: Zet de Apple TV aan bij beweging in de woonkamer volgens schema.
  triggers:
  - entity_id: binary_sensor.hue_motion_sensor_3_motion
    from: 'off'
    to: 'on'
    trigger: state
  conditions:
