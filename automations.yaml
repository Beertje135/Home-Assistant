    at: input_datetime.light_garden_off
    id: trigger_deel_uit
  - trigger: state
    entity_id: remote.harmony_hub
    attribute: current_activity
    to:
    - TV Decoder
    - WebOS
    - Apple tv
    id: trigger_deel_uit
  - trigger: state
    entity_id:
    - binary_sensor.hue_outdoor_sensor_1_motion
    - binary_sensor.hue_outdoor_sensor_3_motion
    to: 'off'
    for: 00:02:00
    id: trigger_deel_uit
  - trigger: state
    entity_id: binary_sensor.hue_motion_sensor_2_motion
    to: 'off'
    for: 00:06:00
    id: trigger_deel_uit
  - trigger: state
    entity_id: input_boolean.light_downstairs
    to: 'off'
    id: trigger_deel_uit
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''trigger_stayon_reset'' }}'
      - condition: state
        entity_id: input_boolean.light_garden_stay_on
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.light_garden_stay_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''trigger_alles_aan'' }}'
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.bezoek
          state: 'on'
        - condition: state
          entity_id: group.bewoners
          state: home
        - condition: numeric_state
          entity_id: sensor.home_nearest_distance
          below: 2
      - condition: or
        conditions:
        - condition: state
          entity_id: light.hue_lily_outdoor_spot_light_rgbcct_1
          state: 'off'
        - condition: template
          value_template: "{{ is_state('light.hue_lily_outdoor_spot_light_rgbcct_1',
            'on') and \n   (now() - states.scene.tuin2_normaal.last_changed).total_seconds()
            > 300 }}\n"
      - condition: or
        conditions:
        - condition: state
          entity_id: input_boolean.light_garden_stay_on
          state: 'on'
        - condition: and
          conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.hue_outdoor_sensor_2_motion
              state: unavailable
            - condition: numeric_state
              entity_id: sensor.hue_outdoor_sensor_2_light_level
              below: 8
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.hue_outdoor_sensor_3_motion
              state: unavailable
            - condition: numeric_state
              entity_id: sensor.hue_outdoor_sensor_3_light_level
              below: 8
      - condition: or
        conditions:
        - condition: not
          conditions:
          - condition: state
            entity_id: input_select.woning_status
            state: Slapen
        - condition: template
          value_template: '{% set b_home = is_state(''person.bert'', ''home'') and
            (now() - states.person.bert.last_changed).total_seconds() < 600 %} {%
            set c_home = is_state(''person.caroline'', ''home'') and (now() - states.person.caroline.last_changed).total_seconds()
            < 600 %} {{ b_home or c_home }}

            '
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ (is_state('person.bert', 'home') and (now() - states.person.bert.last_changed).total_seconds()
              < 300) or\n   (is_state('person.caroline', 'home') and (now() - states.person.caroline.last_changed).total_seconds()
              < 300) }}\n"
          sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.tuin2_normaal
            data:
              transition: 2
        - conditions:
          - condition: state
            entity_id: input_boolean.keep_christmas_on
            state: 'on'
          sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.tuin2_kerstmis
            data:
              transition: 5
          - action: light.turn_on
            target:
              entity_id:
              - light.hue_lily_outdoor_spot_light_rgbcct_1
              - light.hue_lily_outdoor_spot_light_rgbcct_2
              - light.hue_lily_outdoor_spot_light_rgbcct_3
              - light.hue_lily_outdoor_spot_light_rgbcct_4
              - light.hue_lily_outdoor_spot_light_rgbcct_5
              - light.hue_lily_outdoor_spot_light_rgbcct_6
              - light.hue_lily_outdoor_spot_light_rgbcct_7
              - light.hue_lily_outdoor_spot_light_rgbcct_8
            data:
              effect: sparkle
        - conditions:
          - condition: state
            entity_id: sensor.season
            state: autumn
          sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.tuin_2_alles_herfst
            data:
              transition: 5
        - conditions:
          - condition: state
            entity_id: sensor.season
            state: winter
          sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.tuin_alles_winter
            data:
              transition: 5
        - conditions:
          - condition: state
            entity_id: sensor.season
            state: spring
          sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.tuin_alles_lente
            data:
              transition: 5
        - conditions:
          - condition: state
            entity_id: sensor.season
            state: summer
          sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.tuin_alles_zomer
            data:
              transition: 5
        default:
        - action: scene.turn_on
          target:
            entity_id: scene.tuin2_normaal
          data:
            transition: 5
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''trigger_alles_uit'' }}'
      - condition: state
        entity_id: input_boolean.light_garden_stay_on
        state: 'off'
      - condition: or
        conditions:
        - condition: state
          entity_id: group.licht_tuin_group1
          state: 'on'
        - condition: state
          entity_id: group.licht_tuin_group2
          state: 'on'
      - condition: state
        entity_id: binary_sensor.hue_outdoor_sensor_1_motion
        state: 'off'
        for: 00:05:00
      - condition: state
        entity_id: binary_sensor.hue_outdoor_sensor_3_motion
        state: 'off'
        for: 00:05:00
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.tuin2_uit
    - conditions:
