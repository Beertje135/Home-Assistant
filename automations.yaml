- id: vacuum_001
  alias: 'Stofzuiger: Dusty - Status Update'
  description: Stuurt live een slimme AI of lokale melding wanneer Dusty van status
    verandert  (Vastgelopen, Vol, Gedockt of Bezig) via het centrale script.
  triggers:
  - trigger: state
    entity_id: vacuum.dusty
    attribute: bin_full
    to: 'true'
  - trigger: state
    entity_id: vacuum.dusty
    attribute: status
    to: Stuck
  - trigger: state
    entity_id: vacuum.dusty
    to:
    - docked
    - cleaning
  conditions: []
  actions:
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      task_name: Dusty Status Live
      entity_id: ai_task.google_ai_task
      instructions: "Je bent Siri. Geef een gevatte statusupdate over onze robotstofzuiger
        \"Dusty\". \nGEBRUIK DE VOLGENDE STATUSGEGEVENS: - Algemene status: {{ states('vacuum.dusty')
        }} - Specifieke status (attr): {{ state_attr('vacuum.dusty', 'status') }}
        - Opvangbak vol (attr): {{ state_attr('vacuum.dusty', 'bin_full') }} - Moet
        vandaag nog kuisen: {{ states('input_boolean.vacuum_clean_today') }}\nRICHTLIJNEN
        VOOR JE BERICHT: - Als Dusty vastzit (\"stuck\" of specifieke status bevat
        \"stuck/error\"): Maak een grapje over dat hij weer eens vastzit (domme Dusty).
        - Als de opvangbak vol is (\"bin_full\" is true): Zeg dat hij te veel stof
        geeten heeft en geleegd moet worden. - Als hij aan het kuisen is (\"cleaning\"):
        Wens hem succes of zeg \"Beep Beep\". - Als hij in zijn docking staat (\"docked\")
        maar vandaag nog MOET kuisen (\"vacuum_clean_today\" is ON): Zeg dat hij lui
        is of zijn werk nog moet afmaken. - In alle andere gevallen: Geef een korte,
        vrolijke update dat hij braaf in zijn station staat te laden.\nHoud het kort,
        vrolijk en grappig. Maximaal 2 zinnen.\nSTRIKTE FORMATTERING REGELS: 1. Geef
        DIRECT de tekst van de melding. Typ GEEN introductie. 2. Gebruik NOOIT Markdown-opmaak.
        Gebruik GEEN sterretjes (**) voor vetgedrukte tekst.  3. De output moet pure,
        schone platte tekst zijn die direct in een pushnotificatie en TTS past."
    response_variable: ai_antwoord
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Dusty Live Update \U0001F916"
        melding_tekst: "{% set lokale_modus = is_state('input_boolean.lokale_notificaties',
          'on') %}  {% set ai_beschikbaar = ai_antwoord is defined and ai_antwoord.data
          is defined and ai_antwoord.data | trim != \"\" %}\n{% if not lokale_modus
          and ai_beschikbaar %}\n  {{ ai_antwoord.data }}\n{% else %}\n  ⚠️ [Lokaal]
          {% set status = states('vacuum.dusty') %} {% set bin = state_attr('vacuum.dusty',
          'bin_full') %} {% set kuisen = states('input_boolean.vacuum_clean_today')
          %}\n  {% if 'stuck' in status or 'error' in status or state_attr('vacuum.dusty',
          'status') == 'Stuck' %}\n    Domme Dusty! Hij zit weer ergens vast en heeft
          hulp nodig.\n  {% elif bin == true or bin == 'true' %}\n    Dusty heeft
          te veel stof gegeten, zijn opvangbak zit helemaal vol!\n  {% elif status
          == 'cleaning' %}\n    Beep beep! Dusty is momenteel vlijtig de boel aan
          het kuisen.\n  {% elif status == 'docked' and kuisen == 'on' %}\n    Dusty
          staat in zijn station, maar hij is lui geweest want hij moet vandaag eigenlijk
          nog kuisen!\n  {% else %}\n    Dusty staat netjes opgeladen in zijn honk.
          Alles is proper!\n  {% endif %}\n{% endif %}"
        prioriteit: Geen
        melding_tag: dusty-status
        melding_group: huis
    continue_on_error: true
  mode: single
  max_exceeded: silent
