- id: '1760418239880'
  alias: Zonne Energie - Opbrengst Hoog - Notificatie
  description: Melding bij stabiele opbrengst boven 1000W voor 15 minuten. Loopt via
    het centrale notificatiescript met AI en lokale fallback.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.elektriciteit_meter_p1_vermogen
    for:
      minutes: 15
    below: -1000
  conditions:
  - condition: state
    entity_id: input_select.woning_status
    state:
    - Thuis
    - Thuis Werk
    - Thuis Verlof
  - condition: numeric_state
    entity_id: sensor.solarflow_2400_ac_electric_level
    above: 80
  actions:
  - variables:
      actueel_vermogen: '{{ states(''sensor.elektriciteit_meter_p1_vermogen'') | abs
        }}'
      aanwezigen_namen: '{% set bert = is_state(''person.bert'', ''home'') %} {% set
        caro = is_state(''person.caroline'', ''home'') %} {% set bezoek = is_state(''binary_sensor.bezoek'',
        ''on'') %} {% if bert and caro %}Bert en Caroline {% elif bert %}Bert {% elif
        caro %}Caroline {% elif bezoek %}het bezoek {% else %}iedereen{% endif %}

        '
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Zonne-Energie Status
        entity_id: ai_task.google_ai_task
        instructions: '{% from ''ai_formatting.jinja'' import persona, regels %} {{
          persona() }} Geef een enthousiaste statusupdate over onze zonne-energie.
          Laat aan {{ aanwezigen_namen }} weten dat er momenteel veel zonne-energie
          over is en dat het een ideaal moment is om zware apparaten (zoals de wasmachine,
          droger of vaatwasser) aan te zetten.

          GEGEVENS:  - Actueel vermogen teruglevering: {{ actueel_vermogen }} Watt.

          Richtlijn: Wees kort, bondig en enthousiast. Maximaal 2 korte zinnen.

          {{ regels() }}

          '
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: Energie Update ☀️
        melding_tekst: '{% from ''ai_formatting.jinja'' import render_melding %}

          {# Lokale fallback voor als AI uit staat of niet beschikbaar is #} {% set
          fallback = ''⚠️ [Lokaal] Hey '' ~ aanwezigen_namen ~ ''! De zon schijnt
          volop en we leveren momenteel '' ~ actueel_vermogen ~ '' Watt terug. Tijd
          om die zware apparaten aan te gooien!'' %}

          {{ render_melding(ai_antwoord, fallback) }}

          '
        prioriteit: Geen
        melding_tag: energie-status
        melding_group: huis
    continue_on_error: true
  mode: single
  max_exceeded: silent
