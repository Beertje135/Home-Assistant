        state: 'off'
      - condition: or
        conditions:
        - condition: state
          entity_id: light.hue_lily_outdoor_spot_light_rgbcct_2
          state: 'off'
        - condition: state
          entity_id: light.hue_lily_outdoor_spot_light_rgbcct_5
          state: 'off'
        - condition: state
          entity_id: light.hue_lily_outdoor_spot_light_rgbcct_6
          state: 'off'
      - condition: or
        conditions:
        - condition: not
          conditions:
          - condition: state
