- id: alarm_001
  alias: 'Personen: Slaaptijd Trix - Notificatie'
  description: 'Start de avondroutine voor Trix'' slaapritueel (boekje & papje): AI
    melding via HomePod en pushnotificatie naar ouders via het centrale script.'
  triggers:
  - trigger: state
    entity_id: schedule.slapen_trix
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: Slaaptijd Trix
        entity_id: ai_task.google_ai_task
        instructions: '{% from ''ai_formatting.jinja'' import persona, regels %} {{
          persona() }} Je bent een leuke en grappige omroeper voor kinderen genaamd
          Homey. Jouw publiek is Trix, een meisje van 4 jaar oud dat stapelgek is
          op eenhoorns!  Vandaag is het {{ now().strftime(''%d-%m-%Y'') }}. Zeg op
          een magische en vrolijke manier dat het tijd is om zich klaar te maken voor
          bed (over 30 minuten gaat ze slapen). Herinner haar eraan dat als ze nog
          een lekker papje wil drinken en samen een boekje wil lezen, ze nu snel moet
          gaan beginnen met omkleden en tandenpoetsen.  Maak het speels, betrek er
          subtiel een eenhoorn-thema bij, en beperk je tot maximaal 3 zinnen.

          {{ regels() }}

          '
      response_variable: ai_antwoord
    else:
    - variables:
        ai_antwoord:
          response: ''
  - action: script.turn_on
    target:
      entity_id: script.centraal_universele_notificatie_spraak
    data:
      variables:
        melding_titel: "Bedtijd voor Trix! \U0001F37C"
        melding_tekst: Het is tijd voor Trix om te gaan slapen. Het ritueel is gestart.
        spraak_boodschap: '{% from ''ai_formatting.jinja'' import render_melding %}

          {# Lokale fallback string voor de HomePod #} {% set fallback = ''⚠️ [Lokaal]
          Attentie Trix! Het is tijd om je bedje op te zoeken. Als je nog een boekje
          wil lezen en een papje wil drinken, moet je je nu snel klaarmaken!'' %}

          {{ render_melding(ai_antwoord, fallback) }}

          '
        prioriteit: Geen
        melding_tag: kids-status
        melding_group: huis
    continue_on_error: true
  mode: single
  max_exceeded: silent
- id: verbruik_001
  alias: Energie - Verbruik te hoog - Notificatie
  description: Een melding geven voor te hoog verbruik als de huidige maandpiek dreigt
    te worden overschreden
