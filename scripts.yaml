empty:
  alias: Geen Actie
  description: Een placeholder script dat 1 seconde wacht en daarna stopt. Wordt gebruikt
    als er geen actie vereist is.
  icon: mdi:timer-sand-empty
  sequence:
  - delay: 00:00:01
  mode: single
all_switch_off:
  alias: 'Alles Uit: Slimme Stekkers'
  description: Schakelt de algemene smart plugs uit, met een veiligheidscheck op de
    camera van Trix.
  icon: mdi:power-off
  sequence:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id:
      - switch.hue_smart_plug_6
      - switch.hue_smart_plug_5
    data: {}
  mode: single
all_remote_off:
  alias: 'Alles Uit: Media & Computer'
  description: Schakelt de Harmony Hub uit en zet de computer uit na 5 minuten, tenzij
    'Keep Computer On' actief is of de woningstatus dit niet toelaat.
  icon: mdi:remote-off
  sequence:
  - action: input_select.select_option
    target:
      entity_id: input_select.harmony_hub
    data:
      option: PowerOff
  - condition: state
    entity_id: input_boolean.keep_computer_on
    state: 'off'
  - delay: 00:10:00
  - condition: state
    entity_id: input_boolean.keep_computer_on
    state: 'off'
  - condition: state
    entity_id: input_select.woning_status
    state:
    - Juist Weg
    - Weg
    - Slapen
    - Op Vakantie
    - Op Vakantie (Bezoek)
  - action: hassio.addon_stdin
    data:
      addon: core_rpc_shutdown
      input: pc_bert_lan
  mode: single
all_music_off:
  alias: 'Alles Uit: Muziek'
  description: Schakelt alle radio's en muziekspelers in de badkamer, keuken, woonkamer
    en het bureau uit.
  icon: mdi:music-off
  sequence:
  - action: script.turn_on
    target:
      entity_id:
      - script.radio_bathroom_off
      - script.radio_kitchen_off
      - script.radio_livingroom_off
      - script.radio_office_off
  mode: single
all_light_off:
  alias: 'Alles Uit: Verlichting'
  description: Schakelt alle Hue lampen, ledstrips en de IKEA sfeerpluggen uit. Behalve
    keuken en badkamer die apart werken.
  icon: mdi:lightbulb-off
  sequence:
  - action: light.turn_off
