      transition: 10
  mode: single
all_all_off:
  alias: 'Alles Uit: Volledig'
  description: 'De hoofdknop: Schakelt alle verlichting, muziek, media en slimme stekkers
    in de hele woning uit.'
  icon: mdi:home-off
  sequence:
  - action: script.turn_on
    target:
      entity_id:
      - script.all_light_off
      - script.all_music_off
      - script.all_remote_off
      - script.all_switch_off
