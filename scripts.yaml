    entity_id: media_player.apple_homepod_mini_wit_2
    state: playing
  - action: media_player.media_pause
    target:
      entity_id: media_player.apple_homepod_mini_wit_2
  mode: single
radio_kitchen_off:
  alias: 'Muziek: Keuken - Uit'
  description: Pauzeert de HomePod Mini in de keuken als deze momenteel afspeelt.
  icon: mdi:stop-circle-outline
  sequence:
  - condition: state
    entity_id: media_player.apple_homepod_mini_wit_1
    state: playing
  - action: media_player.media_pause
    target:
      entity_id: media_player.apple_homepod_mini_wit_1
  mode: single
radio_livingroom_off:
  alias: 'Muziek: Woonkamer - Uit'
  description: Pauzeert de zwarte HomePod Mini in de woonkamer als deze momenteel
