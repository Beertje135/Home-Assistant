    target:
      entity_id:
      - light.lightstrip_badkamer
      - light.hue_white_b22_1
      - light.hue_white_filament_bulb_g93_1
      - light.hue_white_filament_bulb_g93_2
      - light.hue_white_filament_bulb_g93_3
      - light.ikea_of_sweden_tretakt_smart_plug_2
      - light.ikea_of_sweden_tretakt_smart_plug_3
      - light.hue_white_and_color_ambiance_a19_gen2_1
      - light.hue_white_filament_globe_g125_1
      - light.lightstrip_keuken
      - light.hue_smart_plug_3
      - light.hue_smart_plug_2
      - light.ikea_of_sweden_tretakt_smart_plug_1
      - light.hue_white_filament_globe_g125_2
      - light.hue_white_and_color_ambiance_a19_gen2_2
      - light.lightstrip_woonkamer_tv
      - light.hue_smart_plug_4
      - light.hue_white_b22_2
      - light.hue_smart_plug_1
      - light.hue_lily_outdoor_spot_light_rgbcct_1
      - light.hue_lily_outdoor_spot_light_rgbcct_2
      - light.hue_lily_outdoor_spot_light_rgbcct_3
      - light.hue_lily_outdoor_spot_light_rgbcct_4
      - light.hue_lily_outdoor_spot_light_rgbcct_5
      - light.hue_lily_outdoor_spot_light_rgbcct_6
      - light.hue_lily_outdoor_spot_light_rgbcct_7
      - light.hue_lily_outdoor_spot_light_rgbcct_8
      - light.hue_lightstrip_outdoor_2m_1
