  icon: mdi:sofa-single-outline
  sequence:
  - condition: state
    entity_id: media_player.apple_homepod_mini_zwart_1
    state: playing
  - action: media_player.media_pause
    target:
      entity_id: media_player.apple_homepod_mini_zwart_1
  mode: single
radio_office_off:
  alias: 'Muziek: Bureau - Uit'
  description: Zet de muziek in het bureau uit als deze speelt
  mode: single
  icon: mdi:stop
  sequence:
  - condition: state
    entity_id: media_player.apple_homepod_mini_wit_3
    state: playing
  - action: media_player.media_pause
    target:
      entity_id: media_player.apple_homepod_mini_wit_3
radio_office_volume:
  alias: 'Muziek: Bureau - Volume Logica'
  description: Zet het volume van de bureau HomePod op basis van status en tijd
  mode: queued
  icon: mdi:volume-high
  sequence:
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: media_player.apple_homepod_mini_wit_3
        state: unavailable
    then:
    - choose:
      - conditions:
        - condition: state
          entity_id: input_select.woning_status
          state: Juist Wakker
        sequence:
        - action: media_player.volume_set
          data:
            volume_level: 0.02
          target:
            entity_id: media_player.apple_homepod_mini_wit_3
      - conditions:
        - condition: time
          before: 08:00:00
        sequence:
        - action: media_player.volume_set
          data:
            volume_level: 0.02
          target:
            entity_id: media_player.apple_homepod_mini_wit_3
      - conditions:
        - condition: state
          entity_id: person.bert
          state: home
        - condition: time
          after: 08:00:00
        sequence:
        - action: media_player.volume_set
          data:
            volume_level: 0.1
          target:
            entity_id: media_player.apple_homepod_mini_wit_3
      default:
      - action: media_player.volume_set
        data:
          volume_level: 0.02
        target:
          entity_id: media_player.apple_homepod_mini_wit_3
radio_livingroom_volume:
  alias: 'Muziek: Woonkamer - Volume Logica'
  icon: mdi:volume-medium
  mode: queued
  sequence:
  - wait_template: '{{ is_state(''media_player.apple_homepod_mini_zwart_1'', ''playing'')
      }}'
    timeout: 00:00:05
    continue_on_timeout: false
  - choose:
    - conditions:
      - or:
        - condition: state
          entity_id: input_select.woning_status
          state: Juist Wakker
        - condition: time
          before: 07:30:00
      sequence:
      - action: media_player.volume_set
        target:
          entity_id: media_player.apple_homepod_mini_zwart_1
        data:
          volume_level: 0.04
    - conditions:
      - condition: state
        entity_id: person.caroline
        state: not_home
      - condition: state
        entity_id: person.bert
        state: home
      - condition: time
        after: 07:30:00
      sequence:
      - action: media_player.volume_set
        target:
          entity_id: media_player.apple_homepod_mini_zwart_1
        data:
          volume_level: 0.1
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Thuis Werk
      sequence:
      - action: media_player.volume_set
        target:
          entity_id: media_player.apple_homepod_mini_zwart_1
        data:
          volume_level: 0.04
    default:
    - action: media_player.volume_set
      target:
        entity_id: media_player.apple_homepod_mini_zwart_1
      data:
        volume_level: 0.1
radio_kitchen_volume:
  alias: 'Muziek: Keuken - Volume Logica'
  icon: mdi:volume-high
  mode: queued
  max: 10
  sequence:
  - wait_template: '{{ is_state(''media_player.apple_homepod_mini_wit_1'', ''playing'')
      }}'
    timeout: 00:00:05
    continue_on_timeout: false
  - choose:
    - conditions:
      - condition: state
        entity_id: person.caroline
        state: not_home
      - condition: state
        entity_id: person.bert
        state: home
      - condition: time
        after: 08:30:00
      sequence:
      - action: media_player.volume_set
        target:
          entity_id: media_player.apple_homepod_mini_wit_1
        data:
          volume_level: 0.2
    - conditions:
      - or:
        - condition: state
          entity_id: input_select.woning_status
          state: Juist Wakker
        - condition: state
          entity_id: input_select.woning_status
          state: Thuis Werk
        - condition: time
          before: 08:30:00
        - condition: time
          after: '19:00:00'
      sequence:
      - action: media_player.volume_set
        target:
          entity_id: media_player.apple_homepod_mini_wit_1
        data:
          volume_level: 0.04
    default:
    - action: media_player.volume_set
      target:
        entity_id: media_player.apple_homepod_mini_wit_1
      data:
        volume_level: 0.1
radio_bathroom_volume:
  alias: 'Muziek: Badkamer - Volume Logica'
  icon: mdi:volume-low
  mode: queued
  sequence:
  - wait_template: '{{ is_state(''media_player.apple_homepod_mini_wit_2'', ''playing'')
      }}'
    timeout: 00:00:05
    continue_on_timeout: false
  - choose:
    - conditions:
      - condition: state
        entity_id: person.caroline
        state: not_home
      - condition: state
        entity_id: person.bert
        state: home
      - condition: time
        after: 07:30:00
      sequence:
      - action: media_player.volume_set
        target:
          entity_id: media_player.apple_homepod_mini_wit_2
        data:
          volume_level: 0.1
    default:
    - action: media_player.volume_set
      target:
        entity_id: media_player.apple_homepod_mini_wit_2
      data:
        volume_level: 0.02
light_bathroom_on:
  alias: 'Licht: Badkamer - Aan'
  description: Bepaalt de juiste badkamerscene op basis van status, tijd en zonlicht
    (met de juiste lenzen-beveiliging).
  icon: mdi:lightbulb-auto
  mode: single
  max_exceeded: silent
  sequence:
  - wait_for_trigger:
    - trigger: template
      value_template: '{{ states(''light.lightstrip_badkamer'') not in [''unavailable'',
        ''unknown''] }}'
    timeout: 00:05:00
    continue_on_timeout: false
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Slapen
        for:
          minutes: 6
      - condition: time
        after: 05:00:00
        before: '23:00:00'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.badkamer_gedimmed
        data:
          transition: 3
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Slapen
      - condition: time
        after: 05:00:00
        before: '23:00:00'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.badkamer_normaal
        data:
          transition: 3
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Slapen
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.badkamer_nacht
        data:
          transition: 3
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Juist Wakker
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.badkamer_normaal
        data:
          transition: 3
    - conditions:
      - condition: time
        after: '21:40:00'
        before: 06:10:00
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.badkamer_gedimmed
        data:
          transition: 3
    - conditions:
      - condition: state
        entity_id: input_boolean.sun_up_down
        state: 'on'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.badkamer_normaal_dag
        data:
          transition: 3
    default:
    - action: scene.turn_on
      target:
        entity_id: scene.badkamer_normaal
      data:
        transition: 3
light_dressing_on:
  alias: 'Licht: Dressing - Aan'
  description: Schakelt de juiste scene in voor de dressing op basis van tijd, woningstatus
    en actieve slimme stekkers.
  icon: mdi:wardrobe-outline
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Slapen
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.dressing_nacht
        data:
          transition: 3
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Juist Wakker
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.dressing_gedimmed
        data:
          transition: 3
    - conditions:
      - condition: time
        after: '21:50:00'
        before: 06:45:00
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.dressing_gedimmed
        data:
          transition: 3
    default:
    - action: scene.turn_on
      target:
        entity_id: scene.dressing_normaal
      data:
        transition: 3
light_bureau_on:
  alias: 'Licht: Bureau - Aan'
  description: Bepaalt het licht in het bureau op basis van woningstatus, tijd en
    of de  camera's van de kinderen (smart plugs) actief zijn.
  icon: mdi:desk
  mode: single
  max_exceeded: silent
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Slapen
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.bureau_nacht
        data:
          transition: 3
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: switch.hue_smart_plug_5
          state: 'on'
        - condition: state
          entity_id: switch.hue_smart_plug_6
          state: 'on'
      - condition: time
        after: '17:00:00'
        before: 08:00:00
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.bureau_gedimmed
        data:
          transition: 3
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: input_select.woning_status
          state: Juist Wakker
        - condition: time
          after: '21:50:00'
          before: 06:45:00
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.bureau_gedimmed
        data:
          transition: 3
    default:
    - action: scene.turn_on
      target:
        entity_id: scene.bureau_normaal
      data:
        transition: 3
light_kitchen_on:
  alias: 'Licht: Keuken - Aan'
  description: Keukenverlichting via standaard condities (geen templates).
  icon: mdi:chef-hat
  mode: single
  max_exceeded: silent
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Slapen
      - condition: time
        after: 05:01:00
        before: '23:00:00'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.keuken_gedimmed
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Slapen
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.keuken_nacht
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Juist Wakker
      - condition: state
        entity_id: input_boolean.sun_up_down
        state: 'off'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.keuken_gedimmed
    - conditions:
      - condition: state
        entity_id: schedule.slapen_elmo
        state: 'on'
      - condition: state
        entity_id: input_boolean.media_livingroom
        state: 'on'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.keuken_film
    - conditions:
      - condition: time
        after: '20:30:00'
        before: 06:30:00
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.keuken_gedimmed
    - conditions:
      - condition: template
        value_template: '{{ states(''input_select.woning_status'') in [''Thuis'',
          ''Juist Thuis'', ''Thuis Werk'', ''Thuis Verlof'', ''Op Vakantie (Bezoek)'']
          }}'
      - condition: numeric_state
        entity_id: sensor.hue_motion_sensor_2_light_level
        below: 100
      - condition: state
        entity_id: binary_sensor.hue_motion_sensor_2_motion
        state: 'off'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.keuken_gedimmed
    - conditions:
      - condition: state
        entity_id: input_boolean.sun_up_down
        state: 'on'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.keuken_normaal_dag
    - conditions:
      - condition: state
        entity_id: input_boolean.sun_up_down
        state: 'off'
      - condition: time
        after: '20:00:00'
        before: 06:30:00
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.keuken_gedimmed
    default:
    - action: scene.turn_on
      target:
        entity_id: scene.keuken_normaal
light_elmo:
  alias: 'Licht: Slaapkamer Elmo - Aan'
  description: Schakelt de juiste scene voor Elmo op basis van zijn slaapschema met
    een slimme ochtend-timer.
  icon: mdi:baby-carriage
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: light.hue_white_and_color_ambiance_a19_gen2_1
        state: 'on'
      sequence: []
    - conditions:
      - condition: state
        entity_id: schedule.slapen_elmo
        state: 'off'
      - condition: template
        value_template: '{{ (as_timestamp(now()) - as_timestamp(states.schedule.slapen_elmo.last_changed))
          < 3600 }}'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.elmo_ochtend
    - conditions:
      - condition: state
        entity_id: schedule.slapen_elmo
        state: 'on'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.elmo_nacht
    default:
    - action: scene.turn_on
      target:
        entity_id: scene.elmo_uit
light_trix:
  alias: 'Licht: Slaapkamer Trix - Aan'
  description: Schakelt de juiste scene voor Trix op basis van haar slaapschema en
    de tijd.
  icon: mdi:human-child
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: light.hue_white_and_color_ambiance_a19_gen2_2
        state: 'on'
      sequence: []
    - conditions:
      - condition: state
        entity_id: schedule.slapen_trix
        state: 'off'
      - condition: time
        before: 08:00:00
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.trix_ochtend
    - conditions:
      - condition: state
        entity_id: schedule.slapen_trix
        state: 'on'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.trix_nacht
    default:
    - action: scene.turn_on
      target:
        entity_id: scene.trix_uit
light_porch_on:
  alias: 'Licht: Veranda - Aan'
  description: Bepaalt de sfeer in de veranda op basis van woningstatus, TV-activiteit
    en muziek.
  icon: mdi:glass-cocktail
  mode: single
  max_exceeded: silent
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Slapen
      - condition: time
        after: 05:01:00
        before: '23:00:00'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.veranda_gedimmed
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Slapen
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.veranda_nacht
    - conditions:
      - condition: state
        entity_id: schedule.slapen_elmo
        state: 'on'
      - condition: state
        entity_id: input_boolean.media_livingroom
        state: 'on'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.veranda_film
    - conditions:
      - condition: state
        entity_id: schedule.slapen_elmo
        state: 'on'
      - condition: state
        entity_id: remote.harmony_hub
        attribute: current_activity
        state:
        - TV Decoder
        - WebOS
        - Apple tv
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.veranda_televisie
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: input_boolean.media_kitchen
          state: 'on'
        - condition: time
          after: '21:40:00'
        - condition: time
          before: 07:15:00
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.veranda_gedimmed
    default:
    - action: scene.turn_on
      target:
        entity_id: scene.veranda_normaal
light_livingroom_on:
  alias: 'Licht: Woonkamer - Aan'
  description: Bepaalt de verlichting in de woonkamer op basis van status, media-activiteit
    en lichtmeting.
  icon: mdi:sofa
  mode: single
  max_exceeded: silent
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Slapen
      - condition: time
        after: 05:01:00
        before: '23:00:00'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.woonkamer_gedimmed
    - conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Slapen
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.woonkamer_nacht
    - conditions:
      - condition: state
        entity_id: schedule.slapen_elmo
        state: 'on'
      - condition: state
        entity_id: input_boolean.media_livingroom
        state: 'on'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.woonkamer_film
    - conditions:
      - condition: state
        entity_id: remote.harmony_hub
        attribute: current_activity
        state:
        - TV Decoder
        - WebOS
        - Apple tv
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.woonkamer_televisie
    - conditions:
      - condition: state
        entity_id: remote.harmony_hub
        attribute: current_activity
        state: Nintendo Switch 2
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.woonkamer_gaming
    - conditions:
      - condition: or
        conditions:
        - condition: time
          after: '21:40:00'
        - condition: numeric_state
          entity_id: sensor.hue_motion_sensor_3_light_level
          above: 26
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.woonkamer_gedimmed
    default:
    - action: scene.turn_on
      target:
        entity_id: scene.woonkamer_normaal
light_livingroom_off:
  alias: 'Licht: Woonkamer - Uit'
  description: Schakelt de woonkamer uit, maar houdt rekening met kerstverlichting.
  icon: mdi:lightbulb-off
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.keep_christmas_on
        state: 'on'
      - condition: state
        entity_id: input_boolean.light_downstairs
        state: 'on'
      - condition: template
        value_template: '{{ states(''input_select.woning_status'') in [''Thuis'',
          ''Juist Thuis'', ''Thuis Verlof'', ''Thuis Werk'', ''Juist Wakker'', ''Op
          Vakantie (Bezoek)''] }}'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.woonkamer_uit_kerstmis
    default:
    - action: scene.turn_on
      target:
        entity_id: scene.woonkamer_uit
notify_prepare_media:
  alias: 'Notificatie: Voorbereiden Muziek & Volume (Centraal)'
  mode: single
  icon: mdi:volume-high
  sequence:
  - repeat:
      for_each:
      - player: media_player.apple_homepod_mini_wit_1
        boolean: input_boolean.muziek_homepod_wit_1_hervat
      - player: media_player.apple_homepod_mini_wit_2
        boolean: input_boolean.muziek_homepod_wit_2_hervat
      - player: media_player.apple_homepod_mini_wit_3
        boolean: input_boolean.muziek_homepod_wit_3_hervat
      - player: media_player.apple_homepod_mini_zwart_1
        boolean: input_boolean.muziek_homepod_zwart_1_hervat
      sequence:
      - if:
        - condition: template
          value_template: "{{ is_state(repeat.item.player, 'playing') or \n   is_state(repeat.item.player,
            'buffering') }}"
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: '{{ repeat.item.boolean }}'
        - action: media_player.media_pause
          target:
            entity_id: '{{ repeat.item.player }}'
  - action: scene.create
    data:
      scene_id: media_snapshot_before_tts
      snapshot_entities:
      - media_player.apple_homepod_mini_wit_1
      - media_player.apple_homepod_mini_wit_2
      - media_player.apple_homepod_mini_wit_3
      - media_player.apple_homepod_mini_zwart_1
  - variables:
      v_loud: '{{ 0.6 if (now() > today_at(''20:00:00'') or now() < today_at(''07:20:00''))
        else 0.5 }}'
      v_soft: '{{ 0.5 if (now() > today_at(''20:00:00'') or now() < today_at(''07:20:00''))
        else 0.4 }}'
  - action: media_player.volume_set
    data:
      volume_level: '{{ v_loud }}'
    target:
      entity_id: media_player.apple_homepod_mini_wit_1
  - action: media_player.volume_set
    data:
      volume_level: '{{ v_soft }}'
    target:
      entity_id:
      - media_player.apple_homepod_mini_wit_2
      - media_player.apple_homepod_mini_wit_3
      - media_player.apple_homepod_mini_zwart_1
  - delay:
      seconds: 1
notify_resume_media:
  alias: Notificatie - Hervat Muziek (Centraal)
  mode: single
  icon: mdi:play-pause
  sequence:
  - delay:
      hours: 0
      minutes: 0
      seconds: 25
      milliseconds: 0
  - repeat:
      for_each:
      - player: media_player.apple_homepod_mini_wit_1
        hervat_bool: input_boolean.muziek_homepod_wit_1_hervat
        volgen_bool: input_boolean.muziek_homepod_wit_1_volgen
        vol_script: script.radio_kitchen_volume
      - player: media_player.apple_homepod_mini_zwart_1
        hervat_bool: input_boolean.muziek_homepod_zwart_1_hervat
        volgen_bool: input_boolean.muziek_homepod_zwart_1_volgen
        vol_script: script.radio_livingroom_volume
      - player: media_player.apple_homepod_mini_wit_2
        hervat_bool: input_boolean.muziek_homepod_wit_2_hervat
        volgen_bool: input_boolean.muziek_homepod_wit_2_volgen
        vol_script: script.radio_bathroom_volume
      - player: media_player.apple_homepod_mini_wit_3
        hervat_bool: input_boolean.muziek_homepod_wit_3_hervat
        volgen_bool: input_boolean.muziek_homepod_wit_3_volgen
        vol_script: script.radio_office_volume
      sequence:
      - action: script.turn_on
        target:
          entity_id: '{{ repeat.item.vol_script }}'
      - if:
        - condition: template
          value_template: '{{ is_state(repeat.item.hervat_bool, ''on'') }}'
        then:
        - action: media_player.media_play
          target:
            entity_id: '{{ repeat.item.player }}'
        - action: input_boolean.turn_off
          target:
            entity_id: '{{ repeat.item.hervat_bool }}'
      - if:
        - condition: template
          value_template: "{{ not (is_state(repeat.item.volgen_bool, 'off') and \n
            \  (now() - states[repeat.item.volgen_bool].last_changed).total_seconds()
            > 240) }}\n"
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: '{{ repeat.item.volgen_bool }}'
centraal_universele_notificatie_spraak:
  alias: 'Centraal: Universele Notificatie & Spraak'
  icon: mdi:bell-ring-outline
  mode: queued
  max: 10
  fields:
    melding_titel:
      description: De titel van de pushnotificatie
    melding_tekst:
      description: De tekst voor de notificatie en TTS spraak
    prioriteit:
      description: 'Keuzes: Geen, Kritiek, Bert Push, Caroline Push, Bert, Caroline,
        Bert Kritiek, Caroline Kritiek, Spreek Alleen, Push Alleen'
      example: Bert
    melding_tag:
      description: Unieke tag om meldingen te overschrijven (optioneel)
    melding_group:
      description: Unieke group om meldingen te groeperen (optioneel)
  sequence:
  - alias: Push meldingen naar GSMs
    parallel:
    - alias: Notificatie Bert
      if:
      - condition: or
        conditions:
        - condition: template
          value_template: '{{ prioriteit in [''Kritiek'', ''Bert Kritiek''] }}'
        - condition: and
          conditions:
          - condition: state
            entity_id: input_boolean.notify_bert
            state: 'on'
          - condition: template
            value_template: "{{ prioriteit in ['Bert Push', 'Bert', 'Push Alleen']
              or \n   (is_state('person.bert', 'home') and prioriteit not in ['Caroline
              Push', 'Caroline', 'Caroline Kritiek', 'Spreek Alleen']) }}\n"
      then:
      - action: notify.mobile_app_iphone_van_bert
        data:
          title: '{{ melding_titel }}'
          message: '{{ melding_tekst }}'
          data:
            group: '{{ melding_group | default(''huis'') }}'
            tag: '{{ melding_tag | default(''algemeen-status'') }}'
            push:
              sound:
                name: default
                critical: '{{ true if prioriteit in [''Kritiek'', ''Bert Kritiek'']
                  else false }}'
                volume: '{{ 1.0 if prioriteit in [''Kritiek'', ''Bert Kritiek''] else
                  0.5 }}'
    - alias: Notificatie Caroline
      if:
      - condition: or
        conditions:
        - condition: template
          value_template: '{{ prioriteit in [''Kritiek'', ''Caroline Kritiek''] }}'
        - condition: and
          conditions:
          - condition: state
            entity_id: input_boolean.notify_caro
            state: 'on'
          - condition: template
            value_template: "{{ prioriteit in ['Caroline Push', 'Caroline', 'Push
              Alleen'] or \n   (is_state('person.caroline', 'home') and prioriteit
              not in ['Bert Push', 'Bert', 'Bert Kritiek', 'Spreek Alleen']) }}\n"
      then:
      - action: notify.mobile_app_iphone_17_van_caroline
        data:
          title: '{{ melding_titel }}'
          message: '{{ melding_tekst }}'
          data:
            group: '{{ melding_group | default(''huis'') }}'
            tag: '{{ melding_tag | default(''algemeen-status'') }}'
            push:
              sound:
                name: default
                critical: '{{ true if prioriteit in [''Kritiek'', ''Caroline Kritiek'']
                  else false }}'
                volume: '{{ 1.0 if prioriteit in [''Kritiek'', ''Caroline Kritiek'']
                  else 0.5 }}'
    continue_on_error: true
  - alias: Spraak notificatie via HomePods
    if:
    - condition: or
      conditions:
      - condition: state
        entity_id: input_boolean.notify_speak
        state: 'on'
      - condition: template
        value_template: '{{ prioriteit in [''Kritiek'', ''Bert Kritiek'', ''Caroline
          Kritiek''] }}'
    - condition: template
      value_template: '{{ prioriteit in [''Geen'', ''Kritiek'', ''Bert'', ''Caroline'',
        ''Bert Kritiek'', ''Caroline Kritiek'', ''Spreek Alleen''] or prioriteit is
        not defined }}

        '
    - condition: or
      conditions:
      - condition: state
        entity_id: binary_sensor.bezoek
        state: 'on'
      - condition: state
        entity_id: group.bewoners
        state: home
    - condition: not
      conditions:
      - condition: state
        entity_id: input_select.woning_status
        state: Slapen
        for:
          hours: 0
          minutes: 5
          seconds: 0
      - condition: state
        entity_id: input_select.woning_status
        state: Op Vakantie
    - condition: state
      entity_id: input_boolean.lokale_notificaties
      state: 'off'
    then:
    - choose:
      - alias: Overal spreken (Als de kids niet slapen)
        conditions:
        - condition: state
          entity_id: switch.hue_smart_plug_5
          state: 'off'
        - condition: state
          entity_id: switch.hue_smart_plug_6
          state: 'off'
        - condition: state
          entity_id: schedule.slapen_elmo
          state: 'off'
        - condition: state
          entity_id: schedule.slapen_trix
          state: 'off'
        sequence:
        - action: script.turn_on
          target:
            entity_id: script.notify_prepare_media
        - delay: 00:00:02
        - action: tts.cloud_say
          data:
            entity_id: media_player.homepods_all
            message: '{{ melding_tekst }}'
            cache: true
          continue_on_error: true
        - wait_template: '{{ not is_state(''media_player.homepods_all'', ''playing'')
            }}'
          timeout:
            hours: 0
            minutes: 0
            seconds: 50
            milliseconds: 0
          continue_on_timeout: true
        - action: script.turn_on
          target:
            entity_id: script.notify_resume_media
      default:
      - action: script.turn_on
        target:
          entity_id: script.notify_prepare_media
      - delay: 00:00:02
      - action: tts.cloud_say
        data:
          entity_id: media_player.homepods_partial
          message: '{{ melding_tekst }}'
          cache: true
        continue_on_error: true
      - wait_template: '{{ not is_state(''media_player.homepods_partial'', ''playing'')
          }}'
        timeout:
          hours: 0
          minutes: 0
          seconds: 50
          milliseconds: 0
        continue_on_timeout: true
      - action: script.turn_on
        target:
          entity_id: script.notify_resume_media
